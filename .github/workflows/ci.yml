name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (lint, unit tests, vuln)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code -- internal/api/gen internal/store/db || (echo "::error::Run 'make generate' and commit the result" && exit 1)
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - run: go test -race -coverprofile=coverage.out ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  agent-version:
    name: Agent version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the check needs history and the agent-v* tags
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: bash tools/agent_version_test.sh
      - run: bash deploy/maintenance/web_apk_refresh_test.sh
      # Always against main, also for stacked PRs: the rule is about what was released, not about the PR base.
      - run: tools/agent_version.sh check origin/main

  integration:
    name: Go integration (containers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # internal/api alone takes about ten minutes with the race detector on a hosted runner, which is
      # go test's default per-package limit: the job timed out at random. 25 minutes leaves room.
      - run: go test -race -timeout 25m -tags integration ./...

  web:
    name: Web (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated client is up to date
        run: |
          pnpm generate
          git diff --exit-code -- apps/web/src/api/schema.d.ts || (echo "::error::Run 'make generate' and commit the result" && exit 1)
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  perf:
    name: Maps performance smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @openvms/test exec playwright install --with-deps chromium
      - run: pnpm test:perf
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/test/playwright-report
          retention-days: 7

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [go, web]
    strategy:
      matrix:
        include:
          - { name: api, dockerfile: deploy/docker/go.Dockerfile, app: api }
          - { name: worker, dockerfile: deploy/docker/go.Dockerfile, app: worker }
          - { name: frigate-mock, dockerfile: deploy/docker/go.Dockerfile, app: frigate-mock }
          - { name: web, dockerfile: deploy/docker/web.Dockerfile, app: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            APP=${{ matrix.app }}
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          tags: openvms-${{ matrix.name }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, pinned by SHA
        with:
          image-ref: openvms-${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  compose:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: [images]
    steps:
      - uses: actions/checkout@v7
      - name: Start stack
        env:
          OPENVMS_HTTPS_SITE_IPV4: 10.1.1.24
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Readiness through Caddy
        run: |
          curl --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors -fsS http://localhost:8000/health/ready
          curl --retry 10 --retry-delay 1 --retry-connrefused --retry-all-errors -fsS http://localhost:8000/api/v1/system/info
          curl --retry 10 --retry-delay 1 --retry-connrefused --retry-all-errors -fsS -o /dev/null http://localhost:8000/
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
