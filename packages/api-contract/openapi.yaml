      required: [id, name, camera_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        camera_count: { type: integer }
    SearchServerHit:
      type: object
      required: [id, name, site_id, site_name, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        site_id: { type: string, format: uuid }
        site_name: { type: string }
        status: { $ref: "#/components/schemas/HealthStatus" }
    SearchEventHit:
      type: object
      required: [id, camera_id, camera_name, site_name, severity, labels, start_time, has_thumbnail]
      properties:
        id: { type: string, format: uuid }
        camera_id: { type: string, format: uuid }
        camera_name: { type: string }
        site_name: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        labels: { type: array, items: { type: string } }
        start_time: { type: string, format: date-time }
        has_thumbnail: { type: boolean }
    SearchPlateHit:
      type: object
      required: [plate, camera_id, camera_name, site_name, seen_at]
      properties:
        plate: { type: string }
        camera_id: { type: string, format: uuid }
        camera_name: { type: string }
        site_name: { type: string }
        seen_at: { type: string, format: date-time }
        event_id: { type: string, format: uuid, nullable: true }
    RuleTriggerType:
      type: string
      enum: [event, camera_offline, server_offline]
    RuleConditions:
      type: object
      properties:
        camera_ids:
          type: array
          items: { type: string, format: uuid }
        server_ids:
          type: array
          items: { type: string, format: uuid }
        site_ids:
          type: array
          description: Only match cameras, servers and events that belong to one of these sites. Empty means every site.
          items: { type: string, format: uuid }
        labels:
          type: array
          items: { type: string }
        zones:
          type: array
          items: { type: string }
        severities:
          type: array
          items: { type: string }
        duration_seconds:
          type: integer
    RuleActions:
      type: object
      properties:
        create_alarm:
          type: boolean
        notify_in_app:
          type: boolean
        severity:
          type: string
          enum: [info, warning, critical]
        channel_ids:
          type: array
          description: External notification channels to deliver to, in addition to the in-app notification and alarm.
          items: { type: string, format: uuid }
    Rule:
      type: object
      required: [id, tenant_id, name, trigger_type, conditions, actions, enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        trigger_type: { $ref: "#/components/schemas/RuleTriggerType" }
        conditions: { $ref: "#/components/schemas/RuleConditions" }
        actions: { $ref: "#/components/schemas/RuleActions" }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RuleCreate:
      type: object
      required: [name, trigger_type]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        trigger_type: { $ref: "#/components/schemas/RuleTriggerType" }
        conditions: { $ref: "#/components/schemas/RuleConditions" }
        actions: { $ref: "#/components/schemas/RuleActions" }
        enabled: { type: boolean, default: true }
    RuleUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        trigger_type: { $ref: "#/components/schemas/RuleTriggerType" }
        conditions: { $ref: "#/components/schemas/RuleConditions" }
        actions: { $ref: "#/components/schemas/RuleActions" }
        enabled: { type: boolean }
    RulesList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Rule" }
    NotificationSeverity:
      type: string
      enum: [info, warning, critical]
    Notification:
      type: object
      required: [id, tenant_id, title, body, severity, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, nullable: true }
        rule_id: { type: string, format: uuid, nullable: true }
        title: { type: string }
        body: { type: string }
        link: { type: string, nullable: true }
        severity: { $ref: "#/components/schemas/NotificationSeverity" }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    NotificationList:
      type: object
      required: [items, unread_count]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        unread_count: { type: integer }
    NotificationChannelType:
      type: string
      enum: [webhook, email, whatsapp, telegram]
    NotificationChannelConfig:
      type: object
      description: Non-secret settings; only the fields of the channel type are used.
      properties:
        url: { type: string, description: "webhook: http(s) URL; link-local and metadata addresses are refused" }
        host: { type: string, description: "email: SMTP host" }
        port: { type: integer, minimum: 1, maximum: 65535 }
        tls: { type: string, enum: [none, starttls, tls] }
        username: { type: string, description: "email: SMTP user" }
        from: { type: string, description: "email: sender address" }
        recipients:
          type: array
          description: "email: addresses; whatsapp: phone numbers or chat ids (stored as <number>@c.us or <id>@g.us)"
          items: { type: string }
        session: { type: string, description: "whatsapp: WAHA session name" }
        chat_ids:
          type: array
          description: "telegram: chat ids or @channel names"
          items: { type: string }
    NotificationChannelSecrets:
      type: object
      description: Write-only values. They are never returned.
      properties:
        signing_secret: { type: string, description: "webhook: HMAC-SHA256 key for X-OpenVMS-Signature" }
        headers:
          type: object
          description: "webhook: custom request headers"
          additionalProperties: { type: string }
        smtp_password: { type: string }
        bot_token: { type: string, description: "telegram: Bot API token" }
    NotificationChannel:
      type: object
      required: [id, tenant_id, name, type, enabled, config, secrets_set, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: "#/components/schemas/NotificationChannelType" }
        enabled: { type: boolean }
        config: { $ref: "#/components/schemas/NotificationChannelConfig" }
        secrets_set:
          type: array
          description: Names of the secrets that hold a value.
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NotificationChannelCreate:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        type: { $ref: "#/components/schemas/NotificationChannelType" }
        enabled: { type: boolean, default: true }
        config: { $ref: "#/components/schemas/NotificationChannelConfig" }
        secrets: { $ref: "#/components/schemas/NotificationChannelSecrets" }
    NotificationChannelUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        enabled: { type: boolean }
        config: { $ref: "#/components/schemas/NotificationChannelConfig" }
        secrets: { $ref: "#/components/schemas/NotificationChannelSecrets" }
        clear_secrets:
          type: array
          items: { type: string, enum: [signing_secret, headers, smtp_password, bot_token] }
    NotificationChannelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NotificationChannel" }
    NotificationChannelTestResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [destination, ok]
            properties:
              destination: { type: string, description: "Recipient, chat id or empty for webhooks" }
              ok: { type: boolean }
              error: { type: string }
    NotificationDelivery:
      type: object
      required: [id, channel_name, channel_type, destination, status, attempts, next_attempt_at, created_at]
      properties:
        id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid, nullable: true }
