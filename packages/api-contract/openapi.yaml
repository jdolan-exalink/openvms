    parameters:
      - { name: alarmId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [alarms]
      operationId: investigateAlarm
      summary: Mark an alarm as investigating
      description: Requires alarms.manage on the alarm's camera.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        "200":
          description: Alarm in investigating state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alarm" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/alarms/{alarmId}/close:
    parameters:
      - { name: alarmId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [alarms]
      operationId: closeAlarm
      summary: Close an alarm
      description: Requires alarms.manage on the alarm's camera.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        "200":
          description: Closed alarm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alarm" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/alarms/{alarmId}/comments:
    parameters:
      - { name: alarmId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [alarms]
      operationId: addAlarmComment
      summary: Add a comment to an alarm
      description: Requires alarms.manage on the alarm's camera.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string }
      responses:
        "201":
          description: Comment added as transition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlarmTransition" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/alarms/{alarmId}/transitions:
    parameters:
      - { name: alarmId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [alarms]
      operationId: listAlarmTransitions
      summary: List lifecycle transitions and comments for an alarm
      description: Requires alarms.view on the alarm's camera.
      responses:
        "200":
          description: Transitions history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmTransition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/alarms/{alarmId}/assignees:
    parameters:
      - { name: alarmId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [alarms]
      operationId: listAlarmAssignees
      summary: List users who can be assigned to this alarm
      description: Returns users in the tenant holding alarms.manage on the alarm's camera.
      responses:
        "200":
          description: Assignable users
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AlarmAssignee" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/alarms/{alarmId}/events:
    parameters:
      - { name: alarmId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [alarms]
      operationId: listAlarmEvents
      summary: List events correlated into an alarm
      description: Returns the events linked in alarm_events for this alarm in chronological order. Requires alarms.view on the alarm's camera.
      responses:
        "200":
          description: Correlated events for the alarm
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AlarmEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/search:
    get:
      tags: [search]
      operationId: globalSearch
      summary: Global search across entities
      description: |
        Searches cameras, sites, servers, events, and plates matching query string q.
        Results in each category are gated by the caller's permissions (cameras.view,
        servers.view, events.search, lpr.search).
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        "200":
          description: Search results grouped by entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/rules:
    get:
      tags: [rules]
      operationId: listRules
      summary: List automation rules for the tenant
      description: Returns all automation rules for the current tenant. Requires rules.read.
      responses:
        "200":
          description: List of rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [rules]
      operationId: createRule
      summary: Create an automation rule
      description: Creates a new automation rule for the tenant (version 1). Requires rules.manage. Conditions are validated; invalid combinations return 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleCreate"
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/rules/templates:
    get:
      tags: [rules]
      operationId: listRuleTemplates
      summary: List reusable automation rule templates
      description: Returns validated starter conditions and actions. Requires rules.read.
      responses:
        "200":
          description: Available templates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleTemplatesList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/rules/simulate:
    post:
      tags: [rules]
      operationId: simulateRule
      summary: Preview a rule against recent tenant events
      description: Evaluates submitted conditions against recent events visible to the current user, estimates per-camera cooldown suppression from historical event timestamps, and never executes actions or consults the live firing ledger. Requires rules.manage and events.search. The limit bounds the newest events evaluated; has_more indicates additional events exist in the window.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleSimulationRequest" }
      responses:
        "200":
          description: Simulation results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleSimulation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/rules/{ruleId}/versions:
    parameters:
      - name: ruleId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [rules]
      operationId: listRuleVersions
      summary: List rule version snapshots
      description: Requires rules.read and access to the rule.
      responses:
        "200":
          description: Rule versions, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleVersionsList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/rules/{ruleId}:
    parameters:
      - name: ruleId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [rules]
      operationId: getRule
      summary: Get rule by ID
      description: Requires rules.read.
      responses:
        "200":
          description: The rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [rules]
      operationId: updateRule
      summary: Update rule
      description: >-
        Requires rules.manage. Optimistic locking is optional: when If-Match carries the rule's current version
        (plain or quoted integer) a stale value returns 409 and a malformed one returns 400; without it the update
        proceeds unchecked. A successful update increments the version and records a snapshot.
        The merged rule is validated and invalid conditions return 400.
      parameters:
        - name: If-Match
          in: header
          required: false
          description: Current rule version, e.g. 3 or "3".
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleUpdate"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [rules]
      operationId: deleteRule
      summary: Delete rule
      description: Requires rules.manage.
      responses:
        "204":
          description: Rule deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/notification-channels:
    get:
      tags: [notification-channels]
      operationId: listNotificationChannels
      summary: List external notification channels
      description: Returns the tenant's channels. Secrets are never returned, only the names of those that are set. Requires notifications.manage.
      responses:
        "200":
          description: Channels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannelList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [notification-channels]
      operationId: createNotificationChannel
      summary: Create a notification channel
      description: Requires notifications.manage. Secrets are write-only and stored sealed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationChannelCreate"
      responses:
        "201":
          description: Created channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/notification-channels/{channelId}:
    parameters:
      - name: channelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [notification-channels]
      operationId: getNotificationChannel
      summary: Get a notification channel
      responses:
        "200":
          description: The channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [notification-channels]
      operationId: updateNotificationChannel
      summary: Update a notification channel
      description: Omitted secrets keep their value; names in clear_secrets are removed. The channel type cannot change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationChannelUpdate"
      responses:
        "200":
          description: Updated channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [notification-channels]
      operationId: deleteNotificationChannel
      summary: Delete a notification channel
      description: Removes the channel from every rule that used it. Delivery history is kept.
      responses:
        "204":
          description: Channel deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/notification-channels/{channelId}/test:
    parameters:
      - name: channelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [notification-channels]
      operationId: testNotificationChannel
      summary: Send a test message through a channel
      description: Sends synchronously to every destination and reports the outcome of each one. Works on disabled channels.
      responses:
        "200":
          description: Per-destination outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannelTestResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/notification-channels/{channelId}/whatsapp/session:
    parameters:
      - name: channelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [notification-channels]
      operationId: getWhatsAppSession
      summary: WhatsApp pairing status of a channel's WAHA session
      description: Proxies WAHA. Only for whatsapp channels. Requires notifications.manage.
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppSession"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/WahaUnavailable" }
  /api/v1/notification-channels/{channelId}/whatsapp/session/start:
    parameters:
      - name: channelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [notification-channels]
      operationId: startWhatsAppSession
      summary: Start (or create) the channel's WAHA session
      responses:
        "200":
          description: Session status after the start request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppSession"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/WahaUnavailable" }
  /api/v1/notification-channels/{channelId}/whatsapp/qr:
    parameters:
      - name: channelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [notification-channels]
      operationId: getWhatsAppQR
      summary: Pairing QR of the channel's WAHA session
      description: Available only while the session status is SCAN_QR_CODE; otherwise 409.
      responses:
        "200":
          description: QR image, base64 encoded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppQR"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/WahaUnavailable" }
  /api/v1/notification-deliveries:
    get:
      tags: [notification-channels]
      operationId: listNotificationDeliveries
      summary: List recent external notification deliveries
      description: Newest first. Requires notifications.manage.
      parameters:
        - name: channel_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDeliveryList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: List in-app notifications
      description: Returns recent notifications for the authenticated user and tenant.
      parameters:
        - name: unread_only
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Notifications list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/notifications/{id}/read:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [notifications]
      operationId: markNotificationRead
      summary: Mark a notification as read
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      summary: Mark all notifications as read for current user
      responses:
        "200":
          description: Result count
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer }
  /api/v1/maps/analytics:
    get:
      tags: [maps]
      operationId: getMapAnalytics
      summary: Activity heatmaps and analytics
      description: Returns aggregated and normalized activity heatmap points for cameras on a site.
      parameters:
        - name: site_id
          in: query
          schema: { type: string, format: uuid }
        - name: camera_id
          in: query
          schema: { type: string, format: uuid }
        - name: zone_id
          in: query
          schema: { type: string, format: uuid }
        - name: metric
          in: query
          schema:
            type: string
            enum: [object, person, vehicle, motion, alarm, lpr]
            default: object
        - name: object_type
          in: query
          schema: { type: string }
        - name: start
          in: query
          schema: { type: string, format: date-time }
        - name: end
          in: query
          schema: { type: string, format: date-time }
        - name: coverage
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Analytics heatmap data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapAnalyticsResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/maps/config:
    get:
      tags: [maps]
      operationId: getMapConfig
      summary: Map configuration
      description: Tile provider, style URLs, attribution, offline flag, and limits.
      responses:
        "200":
          description: Map configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapConfig"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/maps/overview:
    get:
      tags: [maps]
      operationId: getMapOverview
      summary: Sites map overview
      description: Geo positions and health/alarm aggregates for sites the caller can view.
      responses:
        "200":
          description: Sites overview list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapSiteOverviewList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/maps/sites/{siteId}:
    get:
      tags: [maps]
      operationId: getMapSite
      summary: Site map details
      description: Bounds, buildings, floors, and zones for the site.
      parameters:
        - name: siteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Site map details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapSiteDetails"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/maps/sites/{siteId}/entities:
    get:
      tags: [maps]
      operationId: getMapSiteEntities
      summary: Placed entities for site
      description: Compact placed entities (cameras, servers, devices) with status and alarm counts.
      parameters:
        - name: siteId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: floor_id
          in: query
          schema: { type: string, format: uuid }
        - name: is_geo
          in: query
          schema: { type: boolean }
        - name: min_lat
          in: query
          schema: { type: number, format: double }
        - name: min_lng
          in: query
          schema: { type: number, format: double }
        - name: max_lat
          in: query
          schema: { type: number, format: double }
        - name: max_lng
          in: query
          schema: { type: number, format: double }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: Compact placed entities
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapEntitiesResponse"
        "304":
          description: Entities have not changed since If-None-Match revision
          headers:
            ETag:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/maps/sites/{siteId}/buildings:
    post:
      tags: [maps]
      operationId: createMapBuilding
      summary: createMapBuilding
      parameters:
        - name: siteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapBuildingInput" }
      responses:
        "201":
          description: Successful operation
          content:
            application/json:
