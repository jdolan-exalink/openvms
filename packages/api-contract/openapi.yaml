openapi: 3.0.3
info:
  title: OpenVMS API
  version: 0.3.0
  description: |
    Control plane API for the Federated Frigate VMS.
    Every endpoint is defined here first; server and client code are generated from this file.
servers:
  - url: /
tags:
  - name: health
  - name: system
  - name: identity
  - name: tenants
  - name: sites
  - name: servers
  - name: cameras
  - name: permissions
  - name: events
  - name: vision-ai
  - name: lpr
  - name: faces
  - name: audit
  - name: live
  - name: playback
  - name: rules
  - name: notifications
  - name: notification-channels
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /health/live:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness probe
      security: []
      description: Returns 200 while the process is running. Does not check dependencies.
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessStatus"
  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness probe
      security: []
      description: Checks every backing service. Returns 503 when any required dependency is down.
      responses:
        "200":
          description: All dependencies are reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: At least one dependency is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
  /api/v1/system/info:
    get:
      tags: [system]
      operationId: getSystemInfo
      summary: Build and runtime information
      security: []
      responses:
        "200":
          description: System information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
  /api/v1/system/capacity:
    get:
      tags: [system]
      operationId: getSystemCapacity
      summary: Host resources and ONNX crop throughput
      responses:
        "200":
          description: Current machine and classifier capacity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemCapacity"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/classify/policy:
    get:
      tags: [system]
      operationId: getClassifyPolicy
      summary: Fine classifier switches for visible servers and cameras
      responses:
        "200":
          description: Switches. A missing row is enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassifyPolicy"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/servers/{serverId}/body-classify:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [servers]
      operationId: setServerBodyClassify
      summary: Turn the fine vehicle classifier on or off for a server
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BodyClassifyInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BodyClassifyInput" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/cameras/{cameraId}/body-classify:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [cameras]
      operationId: setCameraBodyClassify
      summary: Turn the fine vehicle classifier on or off for a camera
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BodyClassifyInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BodyClassifyInput" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/me:
    get:
      tags: [identity]
      operationId: getMe
      summary: Current user and their permissions
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/me/map-prefs:
    get:
      tags: [maps]
      operationId: getMapUserPrefs
      summary: Your map preferences
      description: |
        Layer toggles, filters and focus policy stored for the calling user. The response echoes
        exactly what was saved; a user who never saved anything gets an empty object, and the
        client merges its own defaults.
      responses:
        "200":
          description: Stored map preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapUserPrefs"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [maps]
      operationId: putMapUserPrefs
      summary: Save your map preferences
      description: Replaces the whole preference blob of the calling user. Preferences are per user, never shared.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapUserPrefs"
      responses:
        "200":
          description: Stored map preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapUserPrefs"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/features:
    get:
      tags: [system]
      operationId: getFeatures
      summary: Rollout feature flags
      description: |
        Read-only flags that gate the Live View platform rollout. Configured by the operator
        through OPENVMS_FEATURES; every flag is off unless listed there.
      responses:
        "200":
          description: Current flag values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Features"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/permissions:
    get:
      tags: [permissions]
      operationId: listPermissionCatalog
      summary: Permission catalog
      description: Every permission the VMS knows and the narrowest scope it can be granted at.
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PermissionDefinition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/grants:
    get:
      tags: [permissions]
      operationId: listGrants
      summary: List grants
      description: Grants whose scope the caller can manage (permissions.manage).
      parameters:
        - { name: subject_type, in: query, schema: { $ref: "#/components/schemas/SubjectType" } }
        - { name: subject_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Grants
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Grant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [permissions]
      operationId: createGrant
      summary: Grant or deny a permission on a scope
      description: |
        Requires permissions.manage on the scope. Callers cannot grant a permission they do not
        hold themselves on that scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/grants/{grantId}:
    parameters:
      - { name: grantId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [permissions]
      operationId: deleteGrant
      summary: Revoke a grant
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tenants:
    get:
      tags: [tenants]
      operationId: listTenants
      summary: List tenants visible to the caller
      responses:
        "200":
          description: Tenants
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [tenants]
      operationId: createTenant
      summary: Create a tenant (platform administrators)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/tenants/{tenantId}/branding:
    parameters:
      - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [tenants]
      operationId: getTenantBranding
      summary: Get a tenant's owner branding (name/logo burned into plate detail watermarks)
      description: |
        Readable by any authenticated member of the tenant (needed to render the on-screen
        watermark overlay), not only tenant.manage holders. A tenant with no branding
        configured yet answers with an empty owner_name and has_logo=false, not 404.
      responses:
        "200":
          description: Branding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantBranding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [tenants]
      operationId: updateTenantBranding
      summary: Update a tenant's owner branding (tenant.manage)
      description: |
        Partial update: omitted fields keep their current value. Set remove_logo to clear
        the logo (owner_name is kept unless also sent). The logo is validated server-side
        (PNG or JPEG, at most 512 KB decoded) before it is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantBrandingInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantBranding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [tenants]
      operationId: deleteTenantBranding
      summary: Clear a tenant's owner branding entirely (tenant.manage)
      responses:
        "204": { description: Cleared }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tenants/{tenantId}/branding/logo:
    parameters:
      - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [tenants]
      operationId: getTenantBrandingLogo
      summary: Download a tenant's branding logo image
      responses:
        "200":
          description: Logo image
          content:
            image/*: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/sites:
    get:
      tags: [sites]
      operationId: listSites
      summary: List sites the caller can view
      parameters:
        - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Sites
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Site" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [sites]
      operationId: createSite
      summary: Create a site
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/sites/{siteId}:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [sites]
      operationId: getSite
      summary: Get a site
      responses:
        "200":
          description: Site
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [sites]
      operationId: updateSite
      summary: Update a site
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [sites]
      operationId: deleteSite
      summary: Soft-delete an empty site
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/servers:
    get:
      tags: [servers]
      operationId: listServers
      summary: List Frigate servers the caller can view
      parameters:
        - { name: site_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Servers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Server" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [servers]
      operationId: createServer
      summary: Register a Frigate server
      description: |
        Connects with the given credentials, detects version and capabilities and, when
        import_cameras is true, imports every camera. Credentials are stored encrypted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerCreate" }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/servers/probe:
    post:
      tags: [servers]
      operationId: probeServer
      summary: Test a Frigate connection without saving it
      description: Wizard step 3. Requires servers.manage on the target site.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerProbe" }
      responses:
        "200":
          description: Connection works
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/servers/provision:
    post:
      tags: [servers]
      operationId: startServerProvision
      summary: Install Frigate, NTP and the OpenVMS agent on a new host over SSH
      description: |
        The SSH password is used only for this install session. It is not stored and
        is never returned. Requires servers.manage on the target site.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerProvisionRequest" }
      responses:
        "202":
          description: Install started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerProvision" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/servers/provision/{jobId}:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [servers]
      operationId: getServerProvision
      summary: Install progress for a job started by this user
      responses:
        "200":
          description: Progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerProvision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/servers/{serverId}:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [servers]
      operationId: getServer
      summary: Get a Frigate server
      responses:
        "200":
          description: Server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [servers]
      operationId: updateServer
      summary: Rename, move or change the credentials of a server
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [servers]
      operationId: deleteServer
      summary: Permanently delete a server and all its data
      description: >-
        Hard delete, in one transaction: the server, its cameras and every record that
        belongs to them (events, plate reads, alarms, exports, clip jobs, sync state,
        camera group memberships, grants scoped to the server or its cameras). Stored
        thumbnails and clips are removed best-effort after the commit. The audit log is
        kept, including a SERVER_REMOVED entry with the deleted counts. Frigate itself and
        its recordings are not touched. Requires servers.manage on the server.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/servers/{serverId}/sync:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [servers]
      operationId: syncServer
      summary: Rediscover version, capabilities and cameras
      responses:
        "200":
          description: Synchronised
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/servers/{serverId}/restart:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [servers]
      operationId: restartServer
      summary: Restart the Frigate server
      description: Requires servers.restart on the server.
      responses:
        "200":
          description: Restart initiated
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/servers/{serverId}/agent/tls:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [servers]
      operationId: getServerAgentTLSConfig
      summary: Read registered agent TLS trust configuration
      description: Requires servers.manage. Returns only the public custom CA bundle, never credentials or private keys.
      responses:
        "200":
          description: Agent TLS trust configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerAgentTLSConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [servers]
      operationId: setServerAgentTLSConfig
      summary: Configure registered agent TLS trust
      description: Requires servers.manage. The CA bundle is public trust material; private keys and agent credentials are not accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerAgentTLSConfig" }
      responses:
        "200":
          description: Saved configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerAgentTLSConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [servers]
      operationId: deleteServerAgentTLSConfig
      summary: Disable registered agent TLS configuration
      description: Requires servers.manage. This only deletes trust metadata and does not issue an agent or camera request.
      responses:
        "204": { description: TLS configuration deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/servers/{serverId}/agent/connection:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [servers]
      operationId: getServerAgentConnection
      summary: How the server's agent is connected
      description: Requires servers.manage. Says whether the agent was connected by address and at which one; never returns the token, the headers or the certificate.
      responses:
        "200":
          description: Connection state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerAgentConnection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [servers]
      operationId: connectServerAgent
      summary: Connect an agent that already runs at an address OpenVMS can reach
      description: Requires servers.manage and servers.config.secrets. OpenVMS calls the address with the token before storing anything, so a mistake cannot replace a working registration. The token and the headers are stored sealed and never returned. The address may be a LAN or VPN address, or a name published through a tunnel; OpenVMS never connects to this host, link-local or multicast addresses, and uses https for public ones.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerAgentConnectRequest" }
      responses:
        "200":
          description: The agent answered and was registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerAgentConnectResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/AgentConnectFailed" }
        "502": { $ref: "#/components/responses/AgentConnectFailed" }
    delete:
      tags: [servers]
      operationId: disconnectServerAgent
      summary: Forget an agent that was connected by address
      description: Requires servers.manage and servers.config.secrets. An agent installed over SSH is not affected; remove it with the uninstall flow.
      responses:
        "204": { description: The registration was removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/servers/{serverId}/agent/install:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [servers]
      operationId: installServerAgent
      summary: Install the OpenVMS edge agent over SSH
      description: Requires servers.manage and servers.config.secrets. The API accepts this password only over direct HTTPS or HTTPS asserted by an explicitly allowlisted immediate proxy. The SSH target and password are transient and never stored or returned. The first host key is persisted per server, IPv4 and port before password authentication; later key changes are rejected. First-contact trust does not independently verify server identity. Existing agent registrations cannot be replaced.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerAgentInstallRequest" }
      responses:
        "202":
          description: Ephemeral in-memory install job accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerAgentInstallJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/servers/{serverId}/agent/discover:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [servers]
      operationId: inspectServerAgentOverSSH
      summary: Inspect the OpenVMS edge agent over SSH without changing the host
      description: Requires servers.manage and servers.config.secrets. The password is transient and never stored or returned. The remote operation only reads service and version state; it does not install, restart, or otherwise modify the host. Requires HTTPS.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerAgentDiscoveryRequest" }
      responses:
        "200":
          description: Validated agent presence independent of agent health; raw remote output and credentials are never returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerAgentDiscoveryResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/servers/{serverId}/agent/install/{jobId}:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [servers]
      operationId: getServerAgentInstallJob
      summary: Read transient agent install progress
      description: Requires both server-scoped permissions. Jobs live only in API memory; missing jobs after process restart have an unknown outcome and are never treated as success.
      responses:
        "200":
          description: Install status without credentials or remote output
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerAgentInstallJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/servers/{serverId}/agent/enroll-token:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [servers]
      operationId: createServerAgentEnrollToken
      summary: Create a one-time agent enrollment token
      description: Requires servers.manage and servers.config.secrets. The token is returned once, is valid for 15 minutes, can be redeemed a single time and is stored only as a hash. Creating a new token invalidates the server's older unused ones.
      responses:
        "201":
          description: Enrollment token; this is the only time it is shown
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentEnrollToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/servers/{serverId}/agent/revoke-certificates:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [servers]
      operationId: revokeServerAgentCertificates
      summary: Revoke every certificate of the server's agent
      description: Requires servers.manage. Revokes all agent certificates of the server that are not revoked yet, so the agent listener refuses them from the next call and the agent cannot renew; the agent must enroll again with a new token. Use it for a decommissioned or compromised agent. Pending enrollment tokens are not touched. Audited as SERVER_AGENT_CERTS_REVOKED. Calling it again returns zero.
      responses:
        "200":
          description: How many certificates were revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentCertificatesRevoked" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/agent/enroll:
    post:
      tags: [servers]
      operationId: enrollAgent
      summary: Exchange an enrollment token and a CSR for an agent client certificate
      security: []
      description: |
        Called by an edge agent, which has no user session. The agent generates its own key
        and sends only the CSR, so private keys never reach the API. The token is single use
        and the CSR is validated before the token is consumed. Every token problem (unknown,
        used, expired) answers the same 401 so tokens cannot be probed. The certificate
        identity (tenant and server) comes from the token, never from the CSR. If issuance
        fails after the token was consumed, the token stays consumed and a new one is needed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentEnrollRequest" }
      responses:
        "200":
          description: Signed client certificate and the CA bundle the agent must trust
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentEnrollment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/servers/{serverId}/agent/update-ssh:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [servers]
      operationId: updateServerAgentOverSSH
      summary: Update an existing registered agent and configure HTTPS
      description: Requires servers.manage and servers.config.secrets. The registered agent IPv4 and existing bearer are fixed by server registration. The root SSH password is transient. The first host key is persisted per server, IPv4 and port before password authentication; later key changes are rejected. First-contact trust does not independently verify server identity. HTTPS health is verified before public trust metadata is recorded. Existing TLS-enabled agents are not replaced by this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerAgentUpdateRequest" }
      responses:
        "202":
          description: Ephemeral in-memory update job accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerAgentInstallJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/servers/{serverId}/agent/update-ssh/{jobId}:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [servers]
      operationId: getServerAgentUpdateJob
      summary: Read transient existing-agent update progress
      description: Requires both server-scoped permissions. Update jobs live only in API memory; progress contains no credentials or remote command output.
      responses:
        "200":
          description: Update progress without credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerAgentInstallJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/servers/{serverId}/agent/uninstall:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [servers]
      operationId: uninstallServerAgentOverSSH
      summary: Uninstall a registered agent from the host over SSH
      description: |
        Requires servers.manage and servers.config.secrets. Stops and disables the systemd agent service, removes agent files, and removes registration.
        With config_action restore_original the original Frigate configuration saved by the agent is written back (and Frigate restarted) before anything is removed; if the agent holds none, or the write fails, the job fails and nothing is uninstalled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerAgentUninstallRequest" }
      responses:
        "202":
          description: Ephemeral in-memory uninstall job accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerAgentInstallJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/servers/{serverId}/agent/uninstall/{jobId}:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [servers]
      operationId: getServerAgentUninstallJob
      summary: Read transient existing-agent uninstall progress
      description: Requires both server-scoped permissions. Uninstall jobs live only in API memory; progress contains no credentials or remote command output.
      responses:
        "200":
          description: Uninstall progress without credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerAgentInstallJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/servers/{serverId}/onvif/discover:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [servers]
      operationId: discoverServerOnvif
      summary: Discover ONVIF devices from a registered edge agent
      description: Requires servers.manage. Accepts only a local interface name; agent credentials and camera URLs or credentials are never accepted. Discovery uses the agent's local CIDR policy.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnvifDiscoveryRequest" }
      responses:
        "200":
          description: Credential-free discovered device endpoints
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnvifDiscoveryResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/servers/{serverId}/onvif/probe:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [servers]
      operationId: probeServerOnvif
      summary: Read ONVIF device information through a registered agent
      description: Requires servers.manage and servers.config.secrets. Credentials are transient, sent only over verified agent HTTPS, and are never stored or returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnvifProbeRequest" }
      responses:
        "200":
          description: Bounded, sanitized read-only ONVIF device information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnvifProbeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/servers/{serverId}/onvif/check-cameras:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [servers]
      operationId: checkServerCamerasOnvif
      summary: Correlate and check ONVIF capabilities for all cameras on the server
      description: Scans the network for ONVIF devices and correlates them with installed cameras on the server, saving ONVIF profiles (such as ONVIF-T), versions, and capabilities. Requires servers.manage on the server.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerCheckCamerasOnvifRequest" }
      responses:
        "200":
          description: Result of checking cameras
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerCheckCamerasOnvifResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/servers/{serverId}/frigate/add-camera:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [servers]
      operationId: addCameraToFrigate
      summary: Add a discovered camera to Frigate configuration and sync inventory
      description: Adds camera ffmpeg and ONVIF configuration to Frigate config.yml, triggers Frigate reload/restart, and synchronizes inventory. Requires servers.config and servers.config.secrets.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddCameraToFrigateRequest" }
      responses:
        "200":
          description: Camera successfully added and synced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddCameraToFrigateResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/servers/{serverId}/agent:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [servers]
      operationId: getServerAgent
      summary: Live agent metrics for the servers screen
      description: Polled about once a second while the servers screen is open.
      responses:
        "200":
          description: Agent reading
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerAgent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/servers/{serverId}/agent/update:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [servers]
      operationId: updateServerAgent
      summary: Replace the edge agent with the current build
      description: Requires servers.manage on the server.
      responses:
        "200":
          description: Agent after the update
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerAgent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/servers/{serverId}/agent/backup:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [servers]
      operationId: getServerAgentBackup
      summary: Whether the agent keeps the original Frigate configuration
      description: |
        Reads the metadata of the original config.yml that the edge agent keeps on its host. The
        configuration itself is never returned. Requires servers.manage on the server.
      responses:
        "200":
          description: Backup state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerAgentBackup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
    post:
      tags: [servers]
      operationId: ensureServerAgentBackup
      summary: Make the agent keep the original Frigate configuration
      description: |
        Stores, on the agent's host, the Frigate config.yml as it was before OpenVMS changed it. The
        agent keeps the first copy it receives and never replaces it, so calling this again returns
        the stored metadata. Requires servers.manage and servers.config.secrets on the server. The
        409 code agent_backup_unsupported means the agent is older than the release with backups.
      responses:
        "200":
          description: Backup state after the call
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerAgentBackup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/cameras:
    get:
      tags: [cameras]
      operationId: listCameras
      summary: List cameras the caller can view
      description: Only cameras covered by cameras.view are returned; the total never counts others.
      parameters:
        - { name: site_id, in: query, schema: { type: string, format: uuid } }
        - { name: server_id, in: query, schema: { type: string, format: uuid } }
        - { name: group_id, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, description: Case-insensitive name filter, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Cameras
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Camera" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/cameras/{cameraId}:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [cameras]
      operationId: getCamera
      summary: Get a camera
      responses:
        "200":
          description: Camera
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [cameras]
      operationId: updateCamera
      summary: Update a camera's VMS-side settings (name, enabled, default live quality, description, location, tags)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/cameras/{cameraId}/config:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [cameras]
      operationId: getCameraFrigateConfig
      summary: Get a camera's Frigate detection and analytics configuration
      description: Requires cameras.view on the camera.
      responses:
        "200":
          description: Configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraFrigateConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
    patch:
      tags: [cameras]
      operationId: updateCameraFrigateConfig
      summary: Update a camera's Frigate detection and analytics configuration
      description: Requires servers.config on the parent server.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraFrigateConfigUpdate" }
      responses:
        "200":
          description: Updated configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraFrigateConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/cameras/{cameraId}/frigate-config:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [cameras]
      operationId: getCameraFrigateConfigFull
      summary: Get the full effective Frigate configuration of a camera
      description: |
        Requires cameras.view on the camera. Credentials (ffmpeg input URLs, ONVIF user and
        password) stay masked unless the caller holds servers.config.secrets, in which case
        secrets_visible is true. editable is false for callers without servers.config. OpenVMS
        requires Frigate 0.17 or later; older servers are rejected on registration and connect.
      responses:
        "200":
          description: Camera configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FrigateCameraConfigDoc" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
    patch:
      tags: [cameras]
      operationId: patchCameraFrigateConfig
      summary: Edit camera configuration sections on Frigate
      description: |
        Requires servers.config on the parent server; editing ffmpeg inputs or ONVIF
        user/password also needs servers.config.secrets. Sections Frigate can hot-reload are
        applied live; the rest are saved and flagged, and restart_required tells the caller to
        offer a restart. Redacted values are rejected. Every change stores a revision.
        Requires Frigate 0.17 or later.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FrigateConfigPatch" }
      responses:
        "200":
          description: Per-section outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FrigatePatchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/camera-config/object-catalog:
    get:
      tags: [cameras]
      operationId: getObjectCatalog
      summary: Get the normalized object catalog
      description: |
        Any authenticated actor may read it. Returns the ordered OpenVMS categories and objects
        (Spanish labels) instead of an engine's raw label list. `supported` is true or false when
        the model labels of `server_id` are readable and null (unknown) otherwise; an object the
        engine has no label for is always false. Raw labels the catalog does not know are never
        listed here: they stay visible as `detection.raw` of the camera model.
      parameters:
        - { name: engine, in: query, required: false, schema: { type: string, enum: [frigate], default: frigate } }
        - { name: server_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectCatalog" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/cameras/{cameraId}/normalized-config:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [cameras]
      operationId: getCameraConfig
      summary: Get the engine-agnostic configuration model of a camera
      description: |
        Requires cameras.view on the camera. Returns the normalized model (identity, device,
        capabilities, streams by role, recording, detection, analytics, zones, PTZ, fisheye,
        integrations, overrides) that adapters build from the camera's engine, so clients never
        depend on engine structures. Stream URLs are reduced to scheme, host and path: credentials
        and query strings are never returned. When the engine cannot be reached the response still
        carries what OpenVMS knows and `sources` marks the engine as unavailable (HTTP 200).
        Fields the engine did not report are omitted, never guessed.
      responses:
        "200":
          description: Normalized camera configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/cameras/{cameraId}/normalized-config/review:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [cameras]
      operationId: reviewCameraConfig
      summary: Review a change of the normalized configuration before applying it
      description: |
        Requires the permission the Frigate config PATCH needs (servers.config on the camera's
        server). Compares the patch with the camera's current configuration and returns the
        changes (path, label, from, to) and their impact. It has no side effects: nothing is
        written to the engine or the database. Fields the model cannot represent or translate
        are rejected with 400, never ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraConfigPatch" }
      responses:
        "200":
          description: What applying the patch would do
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraConfigReview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/cameras/{cameraId}/normalized-config/apply:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [cameras]
      operationId: applyCameraConfig
      summary: Apply a change of the normalized configuration
      description: |
        Requires the permission the Frigate config PATCH needs (servers.config on the camera's
        server). Records the desired state, translates it to the engine, reads the camera back
        and stores the verified state. `expected_revision` is the `state.desired_revision` the
        caller last read; a different value answers 409. An engine failure answers 200 with
        `result: error` and a sanitized `state.last_error`; a failed apply never leaves the
        state `synced`. Every apply is audited (CAMERA_CONFIG_CHANGED) with previous and new
        values, origin and result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patch, expected_revision]
              properties:
                patch: { $ref: "#/components/schemas/CameraConfigPatch" }
                expected_revision: { type: integer, format: int64, minimum: 0 }
                origin: { $ref: "#/components/schemas/CameraConfigOrigin" }
      responses:
        "200":
          description: Outcome of the apply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraConfigApplyResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/cameras/{cameraId}/frigate-yaml:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [cameras]
      operationId: getCameraFrigateYaml
      summary: Get the YAML of one section of the camera's Frigate configuration
      description: |
        Advanced → "Editar YAML de detección". Requires the permission to edit YAML
        (cameras.config.yaml; the legacy pair servers.config + servers.config.secrets keeps
        working). `section` is a top-level camera section (detect, objects, record, snapshots,
        motion, zones, ffmpeg, ...). Credentials are masked exactly like the
        frigate-config document unless the actor holds servers.config.secrets (`secrets_visible`);
        a masked placeholder left untouched in the YAML never overwrites the real value when it
        is saved. `managed_paths` are the parts of the section that OpenVMS manages through the
        camera's desired state (profile overlaid with overrides), relative to the section, so
        the UI can warn before editing them. `revision` is the camera's desired-state revision to
        send back as `expected_revision`.
      parameters:
        - { name: section, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The section as YAML
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraYamlSection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/cameras/{cameraId}/frigate-yaml/validate:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [cameras]
      operationId: validateCameraFrigateYaml
      summary: Validate an edited section YAML without saving it
      description: |
        Same permission as reading the YAML. Returns syntax errors (line and column), schema
        errors (checked against the Frigate camera schema the schema editor uses), the diff
        against the current section (leaf values, credentials removed) and the managed
        parameters the edit would change (`managed_conflicts`). It has no side effects.
        Keys removed from the YAML are not deleted from Frigate (a warning says so).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [section, yaml]
              properties:
                section: { type: string }
                yaml: { type: string }
      responses:
        "200":
          description: Validation result (an invalid edit is still 200 with valid=false)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraYamlValidation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/cameras/{cameraId}/frigate-yaml/apply:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [cameras]
      operationId: applyCameraFrigateYaml
      summary: Save an edited section YAML
      description: |
        Same permission as reading the YAML, plus what the Frigate camera PATCH needs. The edit
        goes through the existing sectioned PATCH (revisions, rollback copy and audit of that
        path apply). Answers 400 when the YAML has syntax or schema errors, 409 when
        `expected_revision` is stale (`revision_conflict`) or when the edit changes parameters
        managed by OpenVMS and `confirm_managed_conflicts` is not true (`managed_conflict`);
        nothing is written in those cases. Only changed values are sent: untouched masked
        placeholders and unchanged credentials are never written. A confirmed edit of managed
        parameters leaves the camera in `drift` (diferencia detectada) instead of being
        overwritten silently. Audited as CAMERA_CONFIG_CHANGED with origin `yaml`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [section, yaml, expected_revision]
              properties:
                section: { type: string }
                yaml: { type: string }
                expected_revision: { type: integer, format: int64, minimum: 0 }
                confirm_managed_conflicts: { type: boolean, default: false }
      responses:
        "200":
          description: The edit was saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraYamlApplyResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/cameras/{cameraId}/normalized-config/history:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [cameras]
      operationId: listCameraConfigHistory
      summary: List the recent configuration changes of a camera
      description: |
        Requires servers.config on the camera's server (like the review). Newest first, from the
        audit trail (CAMERA_CONFIG_CHANGED): who, when, origin, result and the paths with old and
        new values (credentials removed). `rollbackable` says whether the old values can be
        restored through the rollback endpoint; `rollback_reason` says why not.
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Changes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CameraConfigHistoryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/cameras/{cameraId}/normalized-config/rollback:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [cameras]
      operationId: rollbackCameraConfig
      summary: Restore the configuration a change replaced
      description: |
        "Restaurar configuración anterior". Builds the inverse patch from the old values of a
        recorded change (`audit_id`, default the latest change that can be undone) and applies
        it through the normal review/apply pipeline with origin `ui`; the audit row of the
        rollback names the change it undid (`rollback_of`). It needs the same permissions as an
        apply for every section it touches. Answers 400 (nothing written) when the old values
        are not available or cannot be restored with the patch type (video, changes made with
        YAML), and 409 on a stale `expected_revision`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_revision]
              properties:
                audit_id: { type: integer, format: int64, minimum: 1 }
                expected_revision: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: Outcome of the rollback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraConfigRollbackResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/cameras/{cameraId}/advanced:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [cameras]
      operationId: getCameraAdvanced
      summary: Read-only technical information of the camera by backend
      description: |
        Requires cameras.config.advanced (legacy servers.config keeps working) and cameras.view.
        Frigate: sections of the generated configuration and which ones OpenVMS manages.
        ONVIF: media profiles with stream URIs reduced to scheme, host and path, capabilities
        and reported parameters, from the stored probe (no call to the camera). Provision: the
        ISR link and its technical data, from existing evidence and the agent's status (read
        only). Raw engine or ffmpeg errors never appear here; see `plain_error` in apply results.
      responses:
        "200":
          description: Technical information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraAdvanced" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/camera-config/profiles:
    get:
      tags: [cameras]
      operationId: listCameraConfigProfiles
      summary: List the tenant's camera configuration profiles
      description: |
        Level 2 of the configuration: named sparse patches (same document as a camera's
        overrides) a camera may follow. Requires cameras.view on the tenant. Each profile
        carries how many cameras follow it.
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CameraConfigProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [cameras]
      operationId: createCameraConfigProfile
      summary: Create a camera configuration profile
      description: |
        Requires cameras.manage on the tenant. The patch is validated like a camera patch:
        unknown or untranslatable fields are 400; `detection.selection` is not allowed (use raw
        `detection.objects`). Names are unique per tenant (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraConfigProfileInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraConfigProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/camera-config/profiles/{profileId}:
    parameters:
      - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [cameras]
      operationId: getCameraConfigProfile
      summary: Get a profile and the cameras that follow it
      description: |
        `cameras` lists only the followers the caller can view; `camera_count` counts all of
        them. A follower is `outdated` when the profile changed after it was last applied:
        re-apply it with the camera's profile review/apply.
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraConfigProfileDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [cameras]
      operationId: updateCameraConfigProfile
      summary: Replace a profile
      description: |
        Requires cameras.manage. Bumps `version`. Cameras are NOT changed automatically.
        `expected_version` (optional) makes a stale edit answer 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraConfigProfileInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraConfigProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [cameras]
      operationId: deleteCameraConfigProfile
      summary: Delete a profile no camera follows
      description: Requires cameras.manage. 409 (`profile_in_use`) while cameras follow it.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/cameras/{cameraId}/profile/review:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [cameras]
      operationId: reviewCameraProfile
      summary: Preview assigning (or unlinking) a profile
      description: |
        Requires cameras.manage on the camera and the permission the camera config review needs.
        No side effects. `profile_id: null` previews an unlink. `review` lists the changes
        that would reach the engine (profile fields not shadowed by the camera's overrides);
        `parameters` is their count; `shadowed` are profile fields the overrides keep winning.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraConfigProfileAssign" }
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraConfigProfileReview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/cameras/{cameraId}/profile/apply:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [cameras]
      operationId: applyCameraProfile
      summary: Assign (or unlink) a profile
      description: |
        Stores the link and applies the profile fields that differ through the normal
        desired/effective/audit pipeline with origin `profile`; the camera's overrides are never
        rewritten. Unlinking (`profile_id: null`) changes no engine value; `keep_values`
        (default true) turns the profile's current values into overrides. Audited as
        CAMERA_CONFIG_PROFILE_CHANGED (and CAMERA_CONFIG_CHANGED for the apply).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraConfigProfileAssign" }
      responses:
        "200":
          description: Outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraConfigProfileApplyResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/camera-config/bulk/review:
    post:
      tags: [cameras]
      operationId: reviewCameraConfigBulk
      summary: Review one configuration section for many cameras
      description: |
        Select cameras with `camera_ids` or `group_id` (members the caller can view), at most
        200. `patch` must hold exactly one top-level section (detection, recording, analytics or
        streams), else 400. Each row is `will_apply`, `incompatible`, `skipped` (no permission,
        not visible, or nothing to change) or `unreachable`. No side effects.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraConfigBulkRequest" }
      responses:
        "200":
          description: Per-camera review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraConfigBulkReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/camera-config/bulk/apply:
    post:
      tags: [cameras]
      operationId: applyCameraConfigBulk
      summary: Apply one configuration section to many cameras
      description: |
        Same selection and rules as the bulk review. Cameras are applied one after another
        through the normal pipeline (revisions, verification, audit with the given origin);
        fields outside the section are never touched and one failure stops nothing. Rows end
        `applied`, `failed`, `incompatible`, `skipped` or `unreachable`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraConfigBulkRequest" }
      responses:
        "200":
          description: Per-camera outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraConfigBulkReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/cameras/{cameraId}/video-options:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [cameras]
      operationId: getCameraVideoOptions
      summary: Video settings the camera really supports, per stream
      description: |
        Asks the camera itself (ONVIF) for the current video settings and the values it supports
        for the primary and detection streams, so clients offer only combinations the device can
        do. It uses the camera's ONVIF credentials, so it needs cameras.view on the camera plus
        servers.manage and servers.config.secrets on its server (the permissions of the ONVIF
        probe); credentials and device addresses are never returned. When the camera cannot be
        asked the answer is still 200 with `available: false` and a reason code: `no_onvif`
        (no ONVIF endpoint), `no_credentials` (none stored), `unreachable` (the camera did not
        answer) or `unsupported` (it does not expose the settings, or the stream's ONVIF profile
        could not be identified). `apply_via` tells, per field, whether a change goes to the
        camera (`onvif`), to Frigate's detect section (`frigate`) or cannot be made (`none`).
        Applying changes goes through the normalized-config review and apply endpoints with
        `streams.primary` / `streams.detection`; a change that restarts the stream says so in
        the review's impact before anything is saved.
      responses:
        "200":
          description: Supported video values per stream
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraVideoOptions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/cameras/{cameraId}/onvif/check:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [cameras]
      operationId: checkCameraOnvif
      summary: Check and save ONVIF capabilities for a camera
      description: Probes the camera ONVIF endpoint via the server agent and updates stored ONVIF profile, version, and capabilities. Requires cameras.manage on the camera.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraOnvifCheckRequest" }
      responses:
        "200":
          description: Camera updated with ONVIF information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/cameras/{cameraId}/web/session:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [cameras]
      operationId: createCameraWebSession
      summary: Open the camera's own web interface through its edge agent
      description: Creates a short-lived session under /camproxy/{session}/ that proxies the camera web interface through the agent of the camera's server. The camera address is taken from the camera record only; the caller may choose the scheme and port. Requires servers.manage and access to configuration secrets on the camera's server. 404 when the camera has no usable private IPv4 address, 409 when the server has no (or an outdated) agent, 502 when the agent cannot reach the camera.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraWebSessionRequest" }
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraWebSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/cameras/{cameraId}/lpr/test:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [cameras]
      operationId: testCameraLpr
      summary: Check the plate-reading chain of an LPR camera
      description: Read-only check of how a camera's plates reach OpenVMS. For Provision cameras it walks camera -> agent -> central ingestion (agent configured and reachable, receiver, registration, keepalives, readings); for cameras read by Frigate it checks the Frigate LPR setting, the server capability and recent reads. With wait_seconds it polls the agent until a fresh keepalive arrives. It never registers the camera, writes to the agent or creates reads. Requires cameras.view on the camera and servers.manage on its server.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraLprTestRequest" }
      responses:
        "200":
          description: Result of the checks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraLprTest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/cameras/{cameraId}/onvif/snapshot:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [cameras]
      operationId: getCameraOnvifSnapshot
      summary: Retrieve a camera snapshot through its edge agent
      description: Downloads one JPEG from the selected camera. The camera snapshot URI remains inside the edge agent. Requires cameras.manage and access to camera configuration secrets.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraOnvifSnapshotRequest" }
      responses:
        "200":
          description: Camera snapshot JPEG
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/cameras/{cameraId}/onvif/sync-time:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [cameras]
      operationId: syncCameraOnvifTime
      summary: Synchronize camera system date and time with server time via ONVIF
      description: Sends SetSystemDateAndTime to the camera via the server edge agent. Requires cameras.manage.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraOnvifSyncTimeRequest" }
      responses:
        "200":
          description: Camera date and time synchronized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraOnvifSyncTimeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/cameras/{cameraId}/onvif/ptz:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [cameras]
      operationId: controlCameraOnvifPTZ
      summary: Control camera PTZ via ONVIF
      description: Sends ContinuousMove, Stop, or GotoPreset commands to the camera. Requires cameras.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraOnvifPTZRequest" }
      responses:
        "200":
          description: PTZ command executed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraOnvifPTZResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/cameras/{cameraId}/onvif/video-config:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [cameras]
      operationId: operateCameraOnvifVideoConfig
      summary: Get or set camera video encoder configuration via ONVIF
      description: Queries or modifies video encoder configuration (resolution, framerate, bitrate). Requires cameras.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraOnvifVideoConfigRequest" }
      responses:
        "200":
          description: Video config operation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraOnvifVideoConfigResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/cameras/{cameraId}/onvif/video-encoding:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [cameras]
      operationId: operateCameraOnvifVideoEncoding
      summary: Read or change the video encoding (H.264 or H.265) of a camera via ONVIF Media2
      description: |
        `options` lists the camera's video encoder configurations and the encodings each one can be
        switched to; `set` switches one configuration to H.264 or H.265. Only an encoding the camera
        itself listed is ever written, the rest of the configuration (resolution, frame rate,
        bitrate, profile) is kept where the new encoding allows it, and the result is read back
        before it is reported as applied. The camera restarts that stream for a few seconds.
        Requires servers.manage and servers.config.secrets on the camera's server: the camera
        credentials travel with the request and are never stored or returned.

        A refused or impossible change is a 200 with `success: false` and a `code`:
        `media2_unsupported` (the camera has no Media2 service, the only one that exposes H.265),
        `encoding_unsupported`, `encoding_unchanged`, `configuration_not_found`. `not_applied`
        (the camera accepted the call but kept the old setting) is a 502.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraOnvifVideoEncodingRequest" }
      responses:
        "200":
          description: Operation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraOnvifVideoEncodingResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/cameras/{cameraId}/onvif/imaging:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [cameras]
      operationId: operateCameraOnvifImaging
      summary: Get imaging settings, options, or set values via ONVIF
      description: Queries supported imaging controls and their advertised ranges, reads settings, or modifies supported settings with readback verification. Requires cameras.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraOnvifImagingRequest" }
      responses:
        "200":
          description: Imaging operation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraOnvifImagingResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/cameras/{cameraId}/ptz/tours:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [cameras]
      operationId: listCameraPtzTours
      summary: List the PTZ tours stored for a camera
      description: Requires cameras.view. Tours are a stored sequence of device presets; this API does not run them.
      responses:
        "200":
          description: PTZ tours
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraPtzTourList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [cameras]
      operationId: createCameraPtzTour
      summary: Store a PTZ tour for a camera
      description: Requires cameras.manage. Names are unique per camera.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraPtzTourInput" }
      responses:
        "201":
          description: Created tour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraPtzTour" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/cameras/{cameraId}/ptz/tours/{tourId}:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: tourId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [cameras]
      operationId: updateCameraPtzTour
      summary: Replace a stored PTZ tour
      description: Requires cameras.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraPtzTourInput" }
      responses:
        "200":
          description: Updated tour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraPtzTour" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [cameras]
      operationId: deleteCameraPtzTour
      summary: Delete a stored PTZ tour
      description: Requires cameras.manage.
      responses:
        "204": { description: Tour deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/cameras/{cameraId}/zones:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [cameras]
      operationId: listCameraZones
      summary: List persisted zones for a camera
      description: Requires cameras.view. Points use normalized 0..1 camera-frame coordinates.
      responses:
        "200":
          description: Persisted camera zones
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraZoneList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [cameras]
      operationId: createCameraZone
      summary: Persist a camera zone and assign its stable ID
      description: Requires cameras.manage. Zone names are Frigate-compatible lowercase identifiers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraZoneInput" }
      responses:
        "201":
          description: Created camera zone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraZone" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/cameras/{cameraId}/zones/{zoneId}:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: zoneId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [cameras]
      operationId: updateCameraZone
      summary: Update a persisted camera zone without changing its stable ID
      description: Requires cameras.manage. Points use normalized 0..1 camera-frame coordinates.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraZoneInput" }
      responses:
        "200":
          description: Updated camera zone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraZone" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [cameras]
      operationId: deleteCameraZone
      summary: Delete a persisted camera zone
      description: Requires cameras.manage. Deletes only a zone belonging to the path camera.
      responses:
        "204": { description: Zone deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/cameras/{cameraId}/zones/{zoneId}/sync:
    parameters:
      - { name: cameraId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: zoneId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [cameras]
      operationId: retryCameraZoneSync
      summary: Manually retry a terminal camera-zone synchronization
      description: Requires cameras.manage. Requeues only failed or conflicted persisted zones.
      responses:
        "202": { description: Camera-zone synchronization queued }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/servers/{serverId}/frigate-config/schema:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [servers]
      operationId: getServerFrigateConfigSchema
      summary: Frigate's JSON schema for a camera configuration
      description: Requires servers.view. Trimmed to CameraConfig and the definitions it references; cached for a few minutes.
      responses:
        "200":
          description: JSON schema
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/servers/{serverId}/frigate-config/raw:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [servers]
      operationId: getServerFrigateConfigRaw
      summary: Read Frigate's config.yml, secrets included
      description: Requires servers.config.secrets.
      responses:
        "200":
          description: config.yml
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FrigateRawConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
    put:
      tags: [servers]
      operationId: putServerFrigateConfigRaw
      summary: Validate and write Frigate's config.yml
      description: |
        Requires servers.config and servers.config.secrets. Frigate validates the file (400
        with its message on failure); a revision is stored. Without restart=true the change
        only takes effect on the next Frigate restart.
      parameters:
        - { name: restart, in: query, required: false, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FrigateRawConfig" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FrigateRawSaveResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/servers/{serverId}/frigate-config/revisions:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [servers]
      operationId: listServerFrigateConfigRevisions
      summary: List stored Frigate configuration revisions, newest first
      description: |
        Requires servers.view. Patches are redacted and before_yaml/after_yaml are omitted
        unless the caller holds servers.config.secrets and passes include_yaml=true.
      parameters:
        - { name: camera_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: before, in: query, required: false, description: Only revisions created before this instant, schema: { type: string, format: date-time } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: include_yaml, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Revisions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FrigateConfigRevisionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/servers/{serverId}/frigate-config/revisions/{revisionId}/rollback:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: revisionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [servers]
      operationId: rollbackServerFrigateConfig
      summary: Restore the configuration a revision replaced
      description: |
        Requires servers.config and servers.config.secrets. Re-applies the revision's
        before_yaml through a save, which Frigate only reads on restart: restart_required is
        true. Records a rollback revision.
      responses:
        "200":
          description: Rolled back
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FrigateRawSaveResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/camera-folders:
    get:
      tags: [cameras]
      operationId: listCameraFolders
      summary: Shared camera folders of the tenant, filtered by what the caller can see
      description: |
        Folders are shared by everyone in the tenant (one tree). A folder is listed when it holds at least one
        camera the caller can view, or when the caller has cameras.manage on its server. manageable_server_ids
        lists the servers on which the caller may create, rename and delete folders and reorder cameras.
      responses:
        "200":
          description: Folders
          content:
            application/json:
              schema:
                type: object
                required: [items, manageable_server_ids]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CameraFolder" }
                  manageable_server_ids:
                    type: array
                    items: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [cameras]
      operationId: createCameraFolder
      summary: Create a folder on a server
      description: Requires cameras.manage on the server. Names are unique per server, case-insensitively.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server_id, name]
              properties:
                server_id: { type: string, format: uuid }
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraFolder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/camera-folders/reorder:
    post:
      tags: [cameras]
      operationId: reorderCameraFolders
      summary: Apply a batch of camera placements and folder positions atomically
      description: |
        Every camera may only be placed in a folder of its own server (or at the server root, folder_id null).
        Requires cameras.manage on each camera and on each folder's server. Nothing is applied if any item is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cameras:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required: [camera_id, sort_order]
                    properties:
                      camera_id: { type: string, format: uuid }
                      folder_id: { type: string, format: uuid, nullable: true }
                      sort_order: { type: integer, minimum: 0 }
                folders:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [folder_id, sort_order]
                    properties:
                      folder_id: { type: string, format: uuid }
                      sort_order: { type: integer, minimum: 0 }
      responses:
        "204": { description: Applied }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/camera-folders/{folderId}:
    parameters:
      - { name: folderId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [cameras]
      operationId: renameCameraFolder
      summary: Rename a folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraFolder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [cameras]
      operationId: deleteCameraFolder
      summary: Delete a folder; its cameras return to the server root
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/camera-groups:
    get:
      tags: [cameras]
      operationId: listCameraGroups
      summary: List camera groups
      responses:
        "200":
          description: Camera groups
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CameraGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [cameras]
      operationId: createCameraGroup
      summary: Create a camera group
      description: |
        Requires cameras.manage on the tenant and, for a manual group, on every member camera. Set filter to
        create a dynamic group: camera_ids must then be empty and the members are computed from the filter and
        kept in sync when cameras are added, retagged, renamed or moved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraGroupInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/camera-groups/{groupId}:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [cameras]
      operationId: getCameraGroup
      summary: Get a camera group
      responses:
        "200":
          description: Camera group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [cameras]
      operationId: replaceCameraGroup
      summary: Replace name, description and members (manual) or filter (dynamic) of a camera group
      description: |
        A group is manual or dynamic for its whole life. A manual group takes camera_ids; a dynamic group
        (created with a filter) takes the filter again, must not set camera_ids and has its members recomputed.
        Sending camera_ids for a dynamic group, omitting the filter for one, or adding a filter to a manual group
        returns 400. A dynamic group's filter can reach cameras the caller does not manage one by one, so
        updating it requires cameras.manage on the whole tenant. Optimistic locking is optional: when If-Match
        carries the group's version (plain or quoted integer) a stale value returns 409.
      parameters:
        - name: If-Match
          in: header
          required: false
          description: Current camera group version, e.g. 3 or "3".
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraGroupInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [cameras]
      operationId: deleteCameraGroup
      summary: Delete a camera group
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/events:
    get:
      tags: [events]
      operationId: listEvents
      summary: Search the federated event index
      description: |
        Review items from every Frigate the caller can see, newest first, with keyset
        pagination. Filtering by label, zone, sub_label, time or plate needs events.search.
        On LPR-capable cameras, sub_label carries recognized plate text, so — like plate — it
        is only returned and searchable there with lpr.view / lpr.search. On cameras without
        LPR capability, sub_label is an ordinary event field and follows normal events.view /
        events.search. A sub_label equal to a registered person's face name is redacted
        everywhere (and cannot be searched) unless the caller holds faces.view.
      parameters:
        - { name: site_id, in: query, style: form, explode: true, schema: { type: array, items: { type: string, format: uuid } } }
        - { name: server_id, in: query, style: form, explode: true, schema: { type: array, items: { type: string, format: uuid } } }
        - { name: camera_id, in: query, style: form, explode: true, schema: { type: array, items: { type: string, format: uuid } } }
        - { name: camera_group_id, in: query, style: form, explode: true, schema: { type: array, items: { type: string, format: uuid } }, description: "Restricts to cameras belonging to any of these groups, intersected with the cameras the caller can already see." }
        - { name: label, in: query, style: form, explode: true, schema: { type: array, items: { type: string } } }
        - { name: zone, in: query, style: form, explode: true, schema: { type: array, items: { type: string } } }
        - { name: sub_label, in: query, style: form, explode: true, schema: { type: array, items: { type: string } } }
        - { name: severity, in: query, schema: { $ref: "#/components/schemas/Severity" } }
        - { name: plate, in: query, schema: { type: string, maxLength: 20 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: overlap, in: query, schema: { type: boolean, default: false }, description: "When true, from/to select events overlapping [from, to) instead of events starting inside it. An event without end_time counts only if it started within one hour before from (older open rows are stale)." }
        - { name: reviewed, in: query, schema: { type: boolean } }
        - { name: has_snapshot, in: query, schema: { type: boolean }, description: "Only events Frigate reported a saved snapshot for on at least one detection." }
        - { name: has_preview, in: query, schema: { type: boolean }, description: "Only events whose preview clip has been copied to central storage." }
        - { name: vehicle_type, in: query, style: form, explode: true, schema: { type: array, items: { type: string } }, description: "Match enriched vehicle types (car, suv, pickup, van, truck, bus, motorcycle)." }
        - { name: vehicle_color, in: query, style: form, explode: true, schema: { type: array, items: { type: string } }, description: "Match enriched vehicle colors." }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        "200":
          description: A page of events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/vision-ai/slots:
    get:
      tags: [vision-ai]
      operationId: getVisionAISlots
      summary: Ranked camera slots for the Vision AI grid
      description: |
        Ranks the caller's recent events (running, or ended within the last 10 minutes, on cameras
        the caller holds events.view for; still-open events that started more than one hour ago
        are treated as stale and ignored) and assigns the best cameras to the slots of the requested
        layout. Allocation state (minimum display time, cooldown, replacement) is kept in memory per
        user, source and layout, so repeated polling yields stable, rotating slots. Plate text is
        only present on cameras where the caller holds lpr.view. Empty slots have a null camera_id.
        An unpinned camera leaves the grid once its last detection is older than `inactivity`
        seconds (Frigate birdseye style), after its minimum display time.
      parameters:
        - { name: source, in: query, schema: { $ref: "#/components/schemas/VisionAISource" } }
        - { name: layout, in: query, schema: { $ref: "#/components/schemas/VisionAILayout" } }
        - { name: server_id, in: query, style: form, explode: true, schema: { type: array, items: { type: string, format: uuid } }, description: "Only events of these servers fill the slots; omitted or empty means every server. Each selection keeps its own allocation state." }
        - name: inactivity
          in: query
          description: Inactivity timeout in seconds; 0 keeps a camera until its maximum display time.
          schema: { type: integer, enum: [0, 10, 30, 60, 120], default: 30 }
      responses:
        "200":
          description: The slot grid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisionAISlots" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/events/sync-status:
    get:
      tags: [events]
      operationId: listEventSyncStatus
      summary: Event ingestion state per Frigate server
      responses:
        "200":
          description: One entry per visible server
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/EventSyncStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/events/review:
    post:
      tags: [events]
      operationId: reviewEvents
      summary: Mark several events reviewed or not, all or nothing (events.review on every event)
      description: >
        Applies the same per-event authorization as PATCH /events/{eventId} inside one transaction:
        if any id is missing (404) or not reviewable by the caller (403) nothing is changed.
        Duplicate ids are collapsed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, reviewed]
              properties:
                ids: { type: array, minItems: 1, maxItems: 200, items: { type: string, format: uuid } }
                reviewed: { type: boolean }
      responses:
        "200":
          description: The updated events, in order of first appearance
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/events/{eventId}:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [events]
      operationId: getEvent
      summary: Get an event
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [events]
      operationId: updateEvent
      summary: Mark an event reviewed or not (events.review)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewed]
              properties:
                reviewed: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/events/{eventId}/reprocess:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [events]
      operationId: reprocessEvent
      summary: Read color and classification again (events.review)
      description: >
        Queues the stored capture for a new color and type reading. Does not raise alarms.
        The response shows the job as pending until the worker finishes.
      responses:
        "200":
          description: Event with the classification job pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/events/{eventId}/thumbnail:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [events]
      operationId: getEventThumbnail
      summary: Event thumbnail
      description: The copy kept by the VMS, or the one in the origin Frigate while it has not been copied yet.
      responses:
        "200":
          description: Image
          content:
            image/*: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/faces/persons:
    parameters:
      - { name: tenant_id, in: query, schema: { type: string, format: uuid }, description: "Optional. Members act on their own organization; platform administrators may omit it when the object names its organization, or when only one organization exists." }
    get:
      tags: [faces]
      operationId: listFacePersons
      summary: List the registered persons with image count and per-server sync summary (faces.view)
      description: Every read of person data is audited.
      responses:
        "200":
          description: Persons
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FacePerson" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [faces]
      operationId: createFacePerson
      summary: Register a person (faces.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FacePersonCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FacePerson" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/faces/persons/tombstones:
    parameters:
      - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
    get:
      tags: [faces]
      operationId: listPendingFaceTombstones
      summary: List deleted persons with owned faces pending remote cleanup (faces.manage)
      description: Returns only the person's name and the count of live servers with pending cleanup.
      responses:
        "200":
          description: Pending face tombstones
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FaceTombstone" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/faces/persons/{personId}/force-purge:
    parameters:
      - { name: personId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
    post:
      tags: [faces]
      operationId: forcePurgeFaceTombstone
      summary: Force-purge a deleted person and queue remaining remote cleanup (faces.manage)
      description: Scrubs stored event labels and records cleanup obligations without contacting Frigate.
      responses:
        "204": { description: Tombstone purged; remote cleanup is queued where needed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/faces/persons/{personId}:
    parameters:
      - { name: personId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
    get:
      tags: [faces]
      operationId: getFacePerson
      summary: Get one person (faces.view)
      responses:
        "200":
          description: Person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FacePerson" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [faces]
      operationId: updateFacePerson
      summary: Rename a person or edit its notes (faces.manage)
      description: Omitted fields keep their value. The identifier used inside Frigate never changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FacePersonUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FacePerson" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [faces]
      operationId: deleteFacePerson
      summary: Delete a person (faces.manage)
      description: |
        Removes the person and its enrollment images centrally, then propagates the deletion to
        every Frigate server and scrubs the name from stored events once all servers converged.
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/faces/persons/{personId}/images:
    parameters:
      - { name: personId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
    get:
      tags: [faces]
      operationId: listFaceImages
      summary: List a person's enrollment images (faces.view)
      responses:
        "200":
          description: Image metadata
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FaceImage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [faces]
      operationId: uploadFaceImage
      summary: Upload an enrollment image (faces.manage)
      description: |
        Multipart form with one `file` part: JPEG, PNG or WebP, at most 5 MB, and at most 20
        images per person. Identical images are rejected as a conflict.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaceImage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/faces/persons/{personId}/images/{imageId}:
    parameters:
      - { name: personId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: imageId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
    get:
      tags: [faces]
      operationId: getFaceImage
      summary: Download an enrollment image (faces.view)
      description: "Biometric data. Only served to authorized callers, every read is audited and responses are never cached publicly."
      responses:
        "200":
          description: The image
          content:
            image/*: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [faces]
      operationId: deleteFaceImage
      summary: Remove an enrollment image (faces.manage)
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/faces/persons/{personId}/sync:
    parameters:
      - { name: personId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
    get:
      tags: [faces]
      operationId: listFaceSyncStatus
      summary: Per-server sync status of a person (faces.view)
      responses:
        "200":
          description: One entry per server of the tenant
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FaceSyncStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/faces/persons/{personId}/sync/retry:
    parameters:
      - { name: personId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
    post:
      tags: [faces]
      operationId: retryFaceSync
      summary: Requeue the failed or conflicting server syncs of a person (faces.manage)
      responses:
        "200":
          description: How many server jobs were requeued
          content:
            application/json:
              schema:
                type: object
                required: [requeued]
                properties:
                  requeued: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/faces/watchlists:
    parameters:
      - { name: tenant_id, in: query, schema: { type: string, format: uuid }, description: "Optional. Members act on their own organization; platform administrators may omit it when the object names its organization, or when only one organization exists." }
    get:
      tags: [faces]
      operationId: listFaceWatchlists
      summary: List the watchlists of known persons (faces.view)
      description: Every read is audited. Members are person ids; resolve names with the persons list.
      responses:
        "200":
          description: Watchlists
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FaceWatchlist" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [faces]
      operationId: createFaceWatchlist
      summary: Create a watchlist (faces.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FaceWatchlistCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaceWatchlist" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/faces/watchlists/{watchlistId}:
    parameters:
      - { name: watchlistId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
    get:
      tags: [faces]
      operationId: getFaceWatchlist
      summary: Get one watchlist (faces.view)
      responses:
        "200":
          description: Watchlist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaceWatchlist" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [faces]
      operationId: updateFaceWatchlist
      summary: Rename a watchlist or replace its members (faces.manage)
      description: Omitted fields keep their value; person_ids replaces the whole member list.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FaceWatchlistUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaceWatchlist" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [faces]
      operationId: deleteFaceWatchlist
      summary: Delete a watchlist (faces.manage)
      description: Answers 409 while an alarm rule still uses the watchlist.
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/faces/config:
    get:
      tags: [faces]
      operationId: listFaceConfig
      summary: Face recognition settings of every server in scope (faces.view and servers.view)
      description: |
        Reads the running configuration of each server the caller holds servers.view on. A server
        that cannot be read is reported with `error` and does not fail the request. Settings are
        what Frigate is running now; a saved change only shows after Frigate restarts.
      parameters:
        - { name: tenant_id, in: query, description: "Optional. Platform administrators and members may omit it; it only narrows the list to one organization.", schema: { type: string, format: uuid } }
        - { name: site_id, in: query, style: form, explode: true, schema: { type: array, items: { type: string, format: uuid } } }
      responses:
        "200":
          description: One entry per server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaceConfigList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/faces/config/{serverId}:
    patch:
      tags: [faces]
      operationId: patchFaceConfig
      summary: Enable or tune face recognition on a server (faces.manage and servers.config)
      description: |
        Writes the `face_recognition` section through the Frigate configuration editor (a revision
        and an audit row per change). Global and per-camera face recognition settings only take
        effect after Frigate restarts, so restart_required is always true when something changed.
        Values are validated against Frigate's documented ranges.
      parameters:
        - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FaceConfigPatch" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaceConfigPatchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/faces/recognitions:
    get:
      tags: [faces]
      operationId: listFaceRecognitions
      summary: Recognition timeline built from the events index (faces.view)
      description: |
        Events whose sub_labels carry a registered person's name, newest first with keyset
        pagination, limited to the cameras the caller holds events.view on. No organization is
        needed: rows come from every organization the caller holds faces.view on, filterable by
        site, server, camera group and camera like the plate search. An event that recognized
        several persons yields one row per person. Use the event endpoints for the
        thumbnail and the playback link.
      parameters:
        - { name: tenant_id, in: query, description: "Optional. Omit it to search every organization the caller may see.", schema: { type: string, format: uuid } }
        - { name: site_id, in: query, style: form, explode: true, schema: { type: array, items: { type: string, format: uuid } } }
        - { name: server_id, in: query, style: form, explode: true, schema: { type: array, items: { type: string, format: uuid } } }
        - { name: camera_group_id, in: query, style: form, explode: true, schema: { type: array, items: { type: string, format: uuid } } }
        - { name: person_id, in: query, style: form, explode: true, schema: { type: array, items: { type: string, format: uuid } } }
        - { name: camera_id, in: query, style: form, explode: true, schema: { type: array, items: { type: string, format: uuid } } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: A page of recognitions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaceRecognitionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/faces/train:
    get:
      tags: [faces]
      operationId: listFaceTrainAttempts
      summary: Recent unclassified face attempts of every face-enabled server in scope (faces.view)
      description: |
        Reads Frigate's train folder (attempts saved with save_attempts) of every face-enabled
        server the caller may see, filterable by site and server. A server that cannot be
        reached is reported in `servers` and does not fail the request.
      parameters:
        - { name: tenant_id, in: query, description: "Optional. Omit it to list the servers of every organization the caller may see.", schema: { type: string, format: uuid } }
        - { name: site_id, in: query, style: form, explode: true, schema: { type: array, items: { type: string, format: uuid } } }
        - { name: server_id, in: query, style: form, explode: true, schema: { type: array, items: { type: string, format: uuid } } }
      responses:
        "200":
          description: Attempts newest first, and how each server answered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaceTrainList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/faces/train/{serverId}/image:
    get:
      tags: [faces]
      operationId: getFaceTrainImage
      summary: Picture of one attempt, proxied from Frigate (faces.view)
      description: "Biometric data. Audited and never exposed as a public URL."
      parameters:
        - { name: serverId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: file, in: query, required: true, schema: { type: string, maxLength: 255 } }
        - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The image
          content:
            image/*: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/faces/train/assign:
    post:
      tags: [faces]
      operationId: assignFaceTrainAttempt
      summary: Turn an attempt into an enrollment image of a person (faces.manage)
      description: |
        Fetches the attempt from Frigate and adds it to the central registry (an existing person,
        or a new one), so the registry sync distributes it to every server. The attempt is then
        deleted from Frigate on a best-effort basis.
      parameters:
        - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FaceTrainAssign" }
      responses:
        "201":
          description: Assigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaceTrainAssignResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/FrigateUnreachable" }
  /api/v1/faces/review-inbox:
    get:
      tags: [faces]
      operationId: listFaceReviewInbox
      summary: List durable unclassified face sightings (faces.view)
      description: Returns every persisted pending sighting in scope, including items whose crop is waiting for retry.
      parameters:
        - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
        - { name: site_id, in: query, style: form, explode: true, schema: { type: array, items: { type: string, format: uuid } } }
        - { name: server_id, in: query, style: form, explode: true, schema: { type: array, items: { type: string, format: uuid } } }
      responses:
        "200":
          description: Pending sightings newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaceReviewInbox" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/faces/review-inbox/groups:
    post:
      tags: [faces]
      operationId: groupFaceReviewSightings
      summary: Explicitly group pending face sightings as one identity (faces.manage)
      description: |
        Groups at least two pending sightings with retained crops. Existing groups are merged
        atomically; the oldest group ID is kept so the identity ID remains stable. This action
        records an audit entry and never uses automated similarity suggestions.
      parameters:
        - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FaceReviewIdentityGroupCreate" }
      responses:
        "200":
          description: Group created or merged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaceReviewIdentityGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/faces/review-inbox/suggestion-decisions:
    post:
      tags: [faces]
      operationId: recordFaceSuggestionDecision
      summary: Record whether two suggested faces are the same person (faces.manage)
      description: |
        Stores the operator's verdict on a suggested pair, named by one pending sighting from each
        side (sighting IDs stay valid when groups merge). A "different" verdict hides the two
        identities those sightings belong to from each other's suggestions. Both verdicts keep the similarity the
        operator saw so the suggestion threshold can be calibrated on real decisions. A later
        verdict for the same pair replaces the earlier one. Grouping is a separate action.
      parameters:
        - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FaceSuggestionDecisionCreate" }
      responses:
        "204": { description: Verdict recorded }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/faces/review-inbox/{sightingId}/image:
    get:
      tags: [faces]
      operationId: getFaceReviewSightingImage
      summary: Read a retained sighting crop (faces.view)
      description: "Sensitive biometric data. Authenticated, audited, and never cached by shared clients."
      parameters:
        - { name: sightingId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The retained image
          content:
            image/*: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/faces/review-inbox/{sightingId}/assign:
    post:
      tags: [faces]
      operationId: assignFaceReviewSighting
      summary: Assign a sighting to a registered or new person (faces.manage)
      parameters:
        - { name: sightingId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FaceReviewSightingAssign" }
      responses:
        "201":
          description: Sighting assigned and its crop transferred to the person's face library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaceReviewSightingAssignResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/faces/review-inbox/{sightingId}:
    delete:
      tags: [faces]
      operationId: rejectFaceReviewSighting
      summary: Reject a sighting and queue its crop for deletion (faces.manage)
      parameters:
        - { name: sightingId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Sighting rejected and crop deletion queued }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/lpr/reads:
    get:
      tags: [lpr]
      operationId: listPlateReads
      summary: Search plate reads across every authorized Frigate
      description: Needs lpr.view to list and lpr.search to filter by plate.
      parameters:
        - { name: plate, in: query, schema: { type: string, maxLength: 20 }, description: "Plate or part of it; spaces and dashes are ignored." }
        - { name: exact, in: query, schema: { type: boolean, default: false } }
        - { name: site_id, in: query, style: form, explode: true, schema: { type: array, items: { type: string, format: uuid } } }
        - { name: camera_id, in: query, style: form, explode: true, schema: { type: array, items: { type: string, format: uuid } } }
        - { name: camera_group_id, in: query, style: form, explode: true, schema: { type: array, items: { type: string, format: uuid } }, description: "Restricts to cameras belonging to any of these groups, intersected with the cameras the caller can already see." }
        - { name: vehicle_type, in: query, style: form, explode: true, schema: { type: array, items: { type: string } }, description: "Match enriched vehicle types (car, suv, pickup, van, sedan, truck_trailer, bus, motorcycle)." }
        - { name: vehicle_color, in: query, style: form, explode: true, schema: { type: array, items: { type: string } }, description: "Match enriched vehicle colors." }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        "200":
          description: A page of plate reads
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlateReadPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/lpr/reads/{readId}/clip-watermark-jobs:
    parameters:
      - { name: readId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [lpr]
      operationId: createClipWatermarkJob
      summary: Start a watermarked clip download job for a plate read (PDW-4)
      description: |
        Needs lpr.view + recordings.view (to view the clip at all) plus exports.create. The
        worker burns in the detection's date/time and the tenant's current owner branding
        (frozen at request time), the same watermark the plate detail modal already shows
        as a CSS overlay. Poll status with getClipWatermarkJob, then download with
        downloadClipWatermarkJob once status is done.
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClipWatermarkJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/lpr/reads/{readId}/clip-watermark-jobs/{jobId}:
    parameters:
      - { name: readId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [lpr]
      operationId: getClipWatermarkJob
      summary: Poll a clip watermark job's status (lpr.view + recordings.view)
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClipWatermarkJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/lpr/reads/{readId}/clip-watermark-jobs/{jobId}/download:
    parameters:
      - { name: readId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [lpr]
      operationId: downloadClipWatermarkJob
      summary: Download the finished watermarked clip (+ exports.download)
      responses:
        "200":
          description: Watermarked clip
          content:
            video/mp4: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/auth/login:
    post:
      tags: [identity]
      operationId: login
      summary: Log in with username and password (and TOTP when enabled)
      security: []
      description: |
        On success sets the HttpOnly session cookie. When the account has MFA and no
        totp_code was sent, answers mfa_required without opening a session. After
        repeated failures the account locks for a while (429).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in, or a TOTP code is needed
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: Account temporarily locked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/auth/recovery:
    post:
      tags: [identity]
      operationId: requestPasswordRecovery
      summary: Ask for a platform admin recovery code (written to the API log)
      security: []
      description: |
        For an active platform administrator, writes a random 6-digit code to the API log (valid
        10 minutes, one active code per account, at most one new code per minute). The answer is
        the same for any username, so it never reveals whether an account exists or may recover.
        Disabled with PASSWORD_RECOVERY_LOG_CODES=false (404 recovery_disabled).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordRecoveryRequest" }
      responses:
        "202":
          description: Accepted; if the account may recover, a code is in the API log
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordRecoveryAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429":
          description: Too many recovery requests from this client IP (shared with confirm)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/auth/recovery/confirm:
    post:
      tags: [identity]
      operationId: confirmPasswordRecovery
      summary: Set a new password with the logged recovery code
      security: []
      description: |
        Sets new_password when code is the account's active, unexpired code. A wrong, expired,
        exhausted (5 attempts) or unknown code or account answers the same 401. On success the
        account's failed-login lock and sessions are cleared; MFA stays as it was.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordRecoveryConfirm" }
      responses:
        "204": { description: Password changed; log in with the new password }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429":
          description: Too many recovery requests from this client IP (shared with the request)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/auth/logout:
    post:
      tags: [identity]
      operationId: logout
      summary: End the current browser session
      responses:
        "204":
          description: Logged out
          headers:
            Set-Cookie:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/me/password:
    post:
      tags: [identity]
      operationId: changePassword
      summary: Change your own password
      description: Other sessions of the user are closed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 8 }
