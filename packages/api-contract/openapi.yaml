components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API token for scripts and integrations. Browsers use the openvms_session cookie set by login.
    cookieAuth:
      type: apiKey
      in: cookie
      name: openvms_session
      description: Browser session. State-changing requests must also send the X-OpenVMS-Request header.
  responses:
    TooManyRequests:
      description: Too many requests from this client address; retry after the number of seconds in Retry-After
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds until a request is accepted again }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: The request is invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The caller lacks the permission on this resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The resource does not exist or belongs to another tenant
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The request conflicts with existing data
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    FrigateUnreachable:
      description: Frigate could not be reached or rejected the credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AgentConnectFailed:
      description: The agent could not be reached (502) or did not accept the connection (422); the code says which
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WahaUnavailable:
      description: The internal WhatsApp service (WAHA) could not be reached
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Me:
      type: object
      required: [id, username, display_name, tenant_id, grants, mfa_enabled, must_change_password, auth_method]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        mfa_enabled: { type: boolean }
        must_change_password: { type: boolean }
        auth_method:
          type: string
          enum: [session, token]
          description: How this request was authenticated.
        tenant_id:
          type: string
          format: uuid
          nullable: true
          description: Null for platform users.
        grants:
          type: array
          items: { $ref: "#/components/schemas/Grant" }
    SubjectType:
      type: string
      enum: [user, group]
    ScopeType:
      type: string
      enum: [platform, tenant, site, server, camera_group, camera]
    Effect:
      type: string
      enum: [allow, deny]
    PermissionDefinition:
      type: object
      required: [permission, description, narrowest_scope]
      properties:
        permission: { type: string, example: live.view }
        description: { type: string }
        narrowest_scope: { $ref: "#/components/schemas/ScopeType" }
    GrantInput:
      type: object
      required: [subject_type, subject_id, permission, effect, scope_type]
      properties:
        subject_type: { $ref: "#/components/schemas/SubjectType" }
        subject_id: { type: string, format: uuid }
        permission: { type: string, example: live.view }
        effect: { $ref: "#/components/schemas/Effect" }
        scope_type: { $ref: "#/components/schemas/ScopeType" }
        scope_id:
          type: string
          format: uuid
          description: Required unless scope_type is platform.
    Grant:
      allOf:
        - $ref: "#/components/schemas/GrantInput"
        - type: object
          required: [id, created_at]
          properties:
            id: { type: string, format: uuid }
            tenant_id: { type: string, format: uuid, nullable: true }
            created_at: { type: string, format: date-time }
    TenantInput:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$", example: municipalidad-helvecia }
        name: { type: string, minLength: 1, maxLength: 200 }
    Tenant:
      allOf:
        - $ref: "#/components/schemas/TenantInput"
        - type: object
          required: [id, created_at]
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
    TenantBranding:
      type: object
      required: [tenant_id, owner_name, timezone, has_logo, updated_at]
      properties:
        tenant_id: { type: string, format: uuid }
        owner_name: { type: string }
        timezone:
          type: string
          description: |
            IANA time zone name used to render the watermark's date/time (PDW-7). Defaults to
            America/Argentina/Buenos_Aires when the tenant has not configured one explicitly.
          example: America/Argentina/Buenos_Aires
        has_logo: { type: boolean }
        logo_content_type: { type: string }
        updated_at: { type: string, format: date-time }
    TenantBrandingInput:
      type: object
      properties:
        owner_name: { type: string, maxLength: 200 }
        timezone:
          type: string
          description: IANA time zone name (validated server-side); omit to keep the current value.
          example: America/Argentina/Buenos_Aires
        logo:
          type: string
          format: byte
          description: Base64-encoded PNG or JPEG, at most 512 KB decoded.
        logo_content_type: { type: string, enum: [image/png, image/jpeg] }
        remove_logo: { type: boolean, default: false, description: Clears the logo; cannot be combined with logo. }
    SiteCreate:
      type: object
      required: [tenant_id, name]
      properties:
        tenant_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        timezone: { type: string, example: America/Argentina/Cordoba }
        address: { type: string, maxLength: 500 }
    SiteUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        timezone: { type: string }
        address: { type: string, maxLength: 500 }
    Site:
      type: object
      required: [id, tenant_id, name, timezone, address, server_count, camera_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string }
        address: { type: string }
        server_count: { type: integer }
        camera_count:
          type: integer
          description: Cameras in this site the caller can view.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    HealthStatus:
      type: string
      enum: [unknown, online, degraded, offline]
    AuthMode:
      type: string
      enum: [credentials, none]
      description: |
        credentials logs in with a Frigate user on the authenticated port (8971).
        none is for a Frigate without login (internal port 5000 or auth disabled); use it only
        on trusted networks.
    ServerProbe:
      type: object
      required: [site_id, base_url]
      properties:
        site_id: { type: string, format: uuid }
        base_url:
          type: string
          example: https://10.20.0.11:8971
          description: Frigate URL. Port 5000 is only accepted with auth_mode none.
        auth_mode: { $ref: "#/components/schemas/AuthMode" }
        username: { type: string, description: Required with auth_mode credentials. }
        password: { type: string, format: password, description: Required with auth_mode credentials. Stored encrypted. }
        tls_skip_verify:
          type: boolean
          default: false
          description: Accept Frigate's self-signed certificate.
    EventAlarmMode:
      type: string
      enum: [all_alerts, rules_only]
      description: Controls whether Frigate alert events open event-source alarms directly (all_alerts) or only through rules (rules_only).
    ServerCreate:
      allOf:
        - $ref: "#/components/schemas/ServerProbe"
        - type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 200, example: Frigate-H01 }
            import_cameras: { type: boolean, default: true }
            event_alarm_mode: { $ref: "#/components/schemas/EventAlarmMode" }
    ServerUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        site_id: { type: string, format: uuid }
        base_url: { type: string }
        auth_mode: { $ref: "#/components/schemas/AuthMode" }
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1, format: password }
        tls_skip_verify: { type: boolean }
        event_alarm_mode: { $ref: "#/components/schemas/EventAlarmMode" }
    Capabilities:
      type: object
      required: [review, preview, exports, lpr, face_recognition, semantic_search, audio, ptz]
      properties:
        review: { type: boolean }
        preview: { type: boolean }
        exports: { type: boolean }
        lpr: { type: boolean }
        face_recognition: { type: boolean }
        semantic_search: { type: boolean }
        audio: { type: boolean }
        ptz: { type: boolean }
    DiscoveredCamera:
      type: object
      required: [remote_name, enabled, zones, lpr]
      properties:
        remote_name: { type: string }
        enabled: { type: boolean }
        zones: { type: array, items: { type: string } }
        lpr: { type: boolean }
    ProbeResult:
      type: object
      required: [frigate_version, adapter, capabilities, cameras]
      properties:
        frigate_version: { type: string, example: 0.17.2 }
        adapter:
          type: string
          description: Adapter chosen for this version.
          example: v017
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        cameras:
          type: array
          items: { $ref: "#/components/schemas/DiscoveredCamera" }
    ServerProblem:
      type: object
      required: [code]
      properties:
        code: { type: string, enum: [cameras_offline, storage_high, detection_stalled] }
        cameras: { type: array, items: { type: string }, description: Names of the enabled cameras without signal (cameras_offline). }
        used_percent: { type: integer, description: Share of the recordings disk in use (storage_high). }
    ServerStorage:
      type: object
      required: [total_mb, used_mb, free_mb]
      properties:
        total_mb: { type: number }
        used_mb: { type: number }
        free_mb: { type: number }
    Server:
      type: object
      required: [id, tenant_id, site_id, name, base_url, auth_mode, username, tls_skip_verify, frigate_version, capabilities, status, last_error, camera_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        name: { type: string }
        base_url: { type: string }
        auth_mode: { $ref: "#/components/schemas/AuthMode" }
        username: { type: string }
        tls_skip_verify: { type: boolean }
        frigate_version: { type: string }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        event_alarm_mode: { $ref: "#/components/schemas/EventAlarmMode" }
        status: { $ref: "#/components/schemas/HealthStatus" }
        last_seen_at: { type: string, format: date-time, nullable: true }
        last_checked_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string }
        uptime_seconds: { type: integer, nullable: true }
        storage: { $ref: "#/components/schemas/ServerStorage" }
        camera_count: { type: integer }
        problems:
          type: array
          description: Why the server is degraded; empty while it is healthy.
          items: { $ref: "#/components/schemas/ServerProblem" }
        agent_last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: When an enrolled edge agent last sent a heartbeat to the agent listener (database clock). Absent until the first heartbeat; compare with the current time to decide whether the agent is still reporting.
        agent_version: { type: string, description: Version the agent reported in its last heartbeat. Absent until the first heartbeat. }
        agent_status: { $ref: "#/components/schemas/AgentStatus" }
        agent_cert_expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the client certificate the agent is using expires (the latest not_after among its certificates that are in use and not revoked). Absent until the agent first connects with mTLS and after its certificates are revoked. A time in the past means the agent's certificate expired and it can only recover with a new enrollment token.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AgentStatus:
      type: string
      enum: [unknown, online, degraded, offline, maintenance]
      description: Operational status the agent reported in its last heartbeat. It is what the agent said, not whether the agent is still alive; use agent_last_seen_at for that.
    SyncResult:
      type: object
      required: [server, added, updated, missing]
      properties:
        server: { $ref: "#/components/schemas/Server" }
        added: { type: integer }
        updated: { type: integer }
        missing:
          type: integer
          description: Cameras no longer present in Frigate. They are kept and flagged, not deleted.
    ServerProvisionRequest:
      type: object
      required: [site_id, ip, server_name, ssh_user, ssh_password]
      properties:
        site_id: { type: string, format: uuid }
        ip: { type: string, description: "Address of the new machine. Example: 192.0.2.10" }
        server_name: { type: string, minLength: 1, maxLength: 200, description: Display name for the newly installed server. }
        host_key: { type: string, description: Optional verified SHA256 SSH host key fingerprint. When supplied, it must match the server key. }
        trust_on_first_use: { type: boolean, default: false, description: Explicitly accept the first SSH host key without prior verification. The initial host identity is not verified. }
        ssh_user: { type: string, minLength: 1, maxLength: 64 }
        ssh_password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
          writeOnly: true
          description: Used only for this install session. Not stored.
        allow_system_disk:
          type: boolean
          default: false
          description: Explicitly allow recordings on the root filesystem when /mnt/cctv is not mounted. Demo use only; disk may fill.
    ServerProvisionStep:
      type: object
      required: [id, state]
      properties:
        id:
          type: string
          enum: [connecting, packages, hardware, compose, ntp, agent, register]
        state:
          type: string
          enum: [pending, running, done, error]
        detail: { type: string }
    ServerProvision:
      type: object
      required: [id, status, steps]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [running, succeeded, failed]
        steps:
          type: array
          items: { $ref: "#/components/schemas/ServerProvisionStep" }
        warning:
          type: string
          enum: [cpu, system_disk, cpu_system_disk]
          description: CPU fallback and/or explicit system-disk recording warning.
        variant:
          type: string
          enum: [coral, tensorrt, openvino, cpu]
        server_id: { type: string, format: uuid }
        error: { type: string }
        host_key: { type: string, description: SHA256 fingerprint seen on first SSH contact. }
    ServerAgentInstallRequest:
      type: object
      additionalProperties: false
      description: The first observed SSH host key is stored for this server, IPv4 and port before password authentication; future changes are rejected. First-use trust-on-first-use does not independently verify server identity.
      required: [ssh_host, ssh_port, ssh_password, replace_existing]
      properties:
        ssh_host: { type: string, format: ipv4, maxLength: 15, description: Explicit SSH target IPv4 literal; never inferred from Frigate URL. }
        ssh_port: { type: integer, minimum: 1, maximum: 65535 }
        ssh_password: { type: string, minLength: 1, maxLength: 4096, writeOnly: true, description: Transient root SSH password; never persisted or echoed. }
        replace_existing: { type: boolean, description: Explicit confirmation to replace a detected or locally registered agent; replacement ends synchronization with its previous OpenVMS. }
    ServerAgentDiscoveryRequest:
      type: object
      additionalProperties: false
      required: [ssh_host, ssh_port, ssh_password]
      properties:
        ssh_host: { type: string, format: ipv4, maxLength: 15, description: Explicit SSH target IPv4 literal. }
        ssh_port: { type: integer, minimum: 1, maximum: 65535 }
        ssh_password: { type: string, minLength: 1, maxLength: 4096, writeOnly: true, description: Transient root SSH password; never persisted or echoed. }
    ServerAgentDiscoveryResult:
      type: object
      additionalProperties: false
      required: [state, ownership]
      properties:
        state: { type: string, enum: [present, absent, unknown] }
        ownership: { type: string, enum: [registered_here, unknown], description: Ownership is unknown unless this OpenVMS already has a matching local registration. }
        version: { type: string, maxLength: 64, description: Validated version when readable; omitted when present but unknown. }
        failure: { type: string, enum: [connection_failed], description: Safe failure category; raw transport or remote output is never returned. }
    ServerAgentUpdateRequest:
      type: object
      additionalProperties: false
      description: The first observed SSH host key is stored for this registered server IPv4 and port before password authentication; future changes are rejected. First-use trust-on-first-use does not independently verify server identity.
      required: [ssh_port, ssh_password]
      properties:
        ssh_port: { type: integer, minimum: 1, maximum: 65535 }
        ssh_password: { type: string, minLength: 1, maxLength: 4096, writeOnly: true, description: Transient root SSH password; never persisted or echoed. }
    ServerAgentUninstallRequest:
      type: object
      additionalProperties: false
      description: Same SSH trust rules as ServerAgentUpdateRequest, plus what to do with Frigate's configuration and with the agent's saved original.
      required: [ssh_port, ssh_password]
      properties:
        ssh_port: { type: integer, minimum: 1, maximum: 65535 }
        ssh_password: { type: string, minLength: 1, maxLength: 4096, writeOnly: true, description: Transient root SSH password; never persisted or echoed. }
        config_action:
          type: string
          enum: [keep, restore_original]
          default: keep
          description: keep leaves Frigate's current configuration; restore_original writes back the original saved by the agent and restarts Frigate.
        discard_backup:
          type: boolean
          default: false
          description: When true the agent's saved original configuration is deleted from the host; otherwise it stays so another OpenVMS can adopt the server.
    AgentEnrollToken:
      type: object
      required: [token, expires_at]
      properties:
        token: { type: string, description: "One-time secret, shown only in this response." }
        expires_at: { type: string, format: date-time }
    AgentCertificatesRevoked:
      type: object
      required: [revoked]
      properties:
        revoked: { type: integer, minimum: 0, description: Certificates revoked by this call. }
    AgentEnrollRequest:
      type: object
      required: [token, csr_pem]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 1, maxLength: 256 }
        csr_pem: { type: string, minLength: 1, maxLength: 8192, description: PEM PKCS#10 certificate request. Its subject and SANs are ignored. }
    AgentEnrollment:
      type: object
      required: [certificate_pem, ca_pem, not_after]
      properties:
        certificate_pem: { type: string }
        ca_pem: { type: string, description: Public CA certificate the agent pins for the API. }
        not_after: { type: string, format: date-time }
    ServerAgentInstallJob:
      type: object
      additionalProperties: false
      required: [id, status, stage]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        stage: { type: string, enum: [validating, connecting, transferring, activating, registering, complete, failed] }
        message: { type: string, maxLength: 200 }
        code:
          type: string
          description: Stable machine-readable failure reason of a failed install; clients localize it instead of showing message.
          enum: [not_root, unsupported_os, unsupported_architecture, agent_files_present, systemd_required, agent_already_installed, preflight_failed, transfer_failed, activation_failed, registration_failed, ssh_auth_failed, ssh_connection_failed]
        installed_version: { type: string, maxLength: 64, description: Version of the agent already present on the host, when code is agent_already_installed and it could be read. }
        bundled_version: { type: string, maxLength: 64, description: Agent version this OpenVMS ships, when code is agent_already_installed. }
        registered_here: { type: boolean, description: True when this OpenVMS already has an agent registered for the server (use the update flow). }
        version_state: { type: string, enum: [up_to_date, outdated, unknown], description: How the installed agent compares with the bundled one; unknown when either is not a MAJOR.MINOR.PATCH version. }
    ServerAgentConnectRequest:
      type: object
      additionalProperties: false
      required: [url, token]
      properties:
        url: { type: string, maxLength: 300, description: "Where OpenVMS reaches the agent: http://host:port on a LAN or VPN, or https://name for a published agent. No path, user or query." }
        token: { type: string, minLength: 1, maxLength: 256, writeOnly: true, description: A token created on the agent (openvms-agent connection). Stored sealed. }
        headers:
          type: object
          writeOnly: true
          maxProperties: 8
          additionalProperties: { type: string, maxLength: 1024 }
          description: Extra headers a gateway in front of the agent asks for (a Zero Trust service token). Stored sealed. Authorization and Host cannot be set.
        ca_pem: { type: string, maxLength: 65536, description: Public certificate authority of a private https agent. Applies to this address only. }
        replace_existing: { type: boolean, description: Confirms replacing an agent that is already registered for the server. }
    ServerAgentConnectResult:
      type: object
      additionalProperties: false
      required: [base_url, version, scopes]
      properties:
        base_url: { type: string }
        version: { type: string, maxLength: 64 }
        scopes:
          type: object
          additionalProperties: false
          required: [read, events, control]
          description: What the token may do on the agent, as far as OpenVMS could tell without changing anything. update cannot be probed.
          properties:
            read: { type: boolean }
            events: { type: boolean, description: Collecting plate readings. }
            control: { type: boolean, description: ONVIF operations and the camera registry. }
    ServerAgentConnection:
      type: object
      additionalProperties: false
      required: [connected, has_headers, has_custom_ca]
      properties:
        connected: { type: boolean, description: True when the agent was connected by address. }
        base_url: { type: string }
        has_headers: { type: boolean }
        has_custom_ca: { type: boolean }
    ServerAgentTLSConfig:
      type: object
      additionalProperties: false
      required: [secure_port, trust_mode]
      properties:
        secure_port: { type: integer, minimum: 1, maximum: 65535 }
        trust_mode: { type: string, enum: [system, custom] }
        ca_pem: { type: string, maxLength: 65536, description: Public CA certificates in PEM format; required only for custom trust mode. }
    OnvifDiscoveryRequest:
      type: object
      additionalProperties: false
      required: [interface_name]
      properties:
        interface_name: { type: string, minLength: 1, maxLength: 64 }
    OnvifDiscoveryDevice:
      type: object
      additionalProperties: false
      required: [xaddrs]
      properties:
        xaddrs: { type: array, items: { type: string, format: uri } }
        scopes: { type: array, items: { type: string } }
    OnvifDiscoveryResult:
      type: object
      additionalProperties: false
      required: [devices]
      properties:
        devices: { type: array, items: { $ref: "#/components/schemas/OnvifDiscoveryDevice" } }
    CameraOnvifCapabilities:
      type: object
      additionalProperties: true
      properties:
        manufacturer: { type: string }
        model: { type: string }
        firmware_version: { type: string }
        serial_number: { type: string }
        hardware_id: { type: string }
        profiles: { type: array, items: { type: string } }
        has_analytics: { type: boolean }
        has_events: { type: boolean }
        has_ptz: { type: boolean }
        has_media2: { type: boolean }
        has_media1: { type: boolean }
        has_imaging: { type: boolean }
        services:
          type: array
          items: { $ref: "#/components/schemas/OnvifProbeService" }
        analytics:
          type: array
          description: |
            Analytics the camera advertises over ONVIF events, read from its event topics. Advertised
            means the camera lists the topic; it is not proof that it fires it.
          items: { $ref: "#/components/schemas/CameraAnalyticsCapability" }
    CameraAnalyticsCapability:
      type: object
      required: [id, source, status, topics]
      properties:
        id:
          type: string
          enum: [lpr, face, person, vehicle, line_crossing, intrusion, motion, tamper]
        source: { type: string, enum: [onvif_events] }
        status: { type: string, enum: [advertised] }
        topics: { type: array, items: { type: string } }
    CameraLprTestRequest:
      type: object
      additionalProperties: false
      properties:
        wait_seconds:
          type: integer
          minimum: 0
          maximum: 30
          default: 0
          description: Seconds to wait for a keepalive newer than the call (Provision cameras).
    CameraLprTestCheck:
      type: object
      required: [id, status, message]
      properties:
        id: { type: string }
        status: { type: string, enum: [pass, fail, warn, skip] }
        message: { type: string }
        detail: { type: string }
    CameraLprTestObserved:
      type: object
      properties:
        last_seen: { type: string, format: date-time }
        keepalive_count: { type: integer, format: int64 }
        event_count: { type: integer, format: int64 }
        last_plate: { type: string }
        last_event_time: { type: string, format: date-time }
        reads_24h: { type: integer }
        last_read_at: { type: string, format: date-time }
    CameraLprTest:
      type: object
      required: [engine, passed, checks, hints, observed]
      properties:
        engine: { type: string, enum: [provision, frigate, none] }
        passed: { type: boolean }
        checks:
          type: array
          items: { $ref: "#/components/schemas/CameraLprTestCheck" }
        hints:
          type: array
          items: { type: string }
        observed: { $ref: "#/components/schemas/CameraLprTestObserved" }
    CameraOnvifCheckRequest:
      type: object
      additionalProperties: false
      properties:
        endpoint: { type: string, maxLength: 2048 }
        username: { type: string, maxLength: 256 }
        password: { type: string, maxLength: 1024, writeOnly: true }
    CameraWebSessionRequest:
      type: object
      additionalProperties: false
      properties:
        scheme: { type: string, enum: [http, https] }
        port: { type: integer, minimum: 1, maximum: 65535 }
    CameraWebSession:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string, description: Same-origin path of the proxied camera interface, to load in a sandboxed iframe }
        expires_at: { type: string, format: date-time }
    ServerCheckCamerasOnvifRequest:
      type: object
      additionalProperties: false
      properties:
        interface_name: { type: string, maxLength: 64 }
    ServerCheckCamerasOnvifResult:
      type: object
      additionalProperties: false
      required: [checked, matched, updated, cameras]
      properties:
        checked: { type: integer }
        matched: { type: integer }
        updated: { type: integer }
        cameras:
          type: array
          items: { $ref: "#/components/schemas/Camera" }
    AddCameraToFrigateRequest:
      type: object
      additionalProperties: false
      required: [name, main_stream_url]
      properties:
        name: { type: string, maxLength: 64 }
        title: { type: string, maxLength: 128 }
        main_stream_url: { type: string, maxLength: 2048 }
        sub_stream_url: { type: string, maxLength: 2048 }
        onvif_host: { type: string, maxLength: 256 }
        onvif_port: { type: integer, minimum: 1, maximum: 65535 }
        onvif_user: { type: string, maxLength: 128 }
        onvif_password: { type: string, maxLength: 256, writeOnly: true }
    AddCameraToFrigateResponse:
      type: object
      additionalProperties: false
      required: [revision_id, restart_required]
      properties:
        camera: { $ref: "#/components/schemas/Camera" }
        revision_id: { type: string, format: uuid }
        restart_required: { type: boolean }
    CameraOnvifSnapshotRequest:
      type: object
      additionalProperties: false
      required: [profile_token]
      properties:
        endpoint: { type: string, maxLength: 2048 }
        username: { type: string, maxLength: 128 }
        password: { type: string, maxLength: 256, writeOnly: true }
        profile_token: { type: string, minLength: 1, maxLength: 128 }
    CameraOnvifSyncTimeRequest:
      type: object
      additionalProperties: false
      properties:
        endpoint: { type: string, maxLength: 2048 }
        username: { type: string, maxLength: 128 }
        password: { type: string, maxLength: 256, writeOnly: true }
    CameraOnvifSyncTimeResult:
      type: object
      additionalProperties: false
      required: [success, synced_at]
      properties:
        success: { type: boolean }
        synced_at: { type: string, format: date-time }
    CameraOnvifPTZRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        endpoint: { type: string, maxLength: 2048 }
        username: { type: string, maxLength: 128 }
        password: { type: string, maxLength: 256, writeOnly: true }
        profile_token: { type: string, maxLength: 128 }
        action: { type: string, enum: [continuous_move, stop, goto_preset, get_presets] }
        pan: { type: number }
        tilt: { type: number }
        zoom: { type: number }
        preset_token: { type: string, maxLength: 128 }
    CameraOnvifPTZResult:
      type: object
      additionalProperties: false
      required: [success]
      properties:
        success: { type: boolean }
        presets:
          type: array
          items:
            type: object
            properties:
              token: { type: string }
              name: { type: string }
    CameraOnvifVideoConfigRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        endpoint: { type: string, maxLength: 2048 }
        username: { type: string, maxLength: 128 }
        password: { type: string, maxLength: 256, writeOnly: true }
        action: { type: string, enum: [get, set] }
        configuration:
          type: object
          properties:
            token: { type: string }
            name: { type: string }
            encoding: { type: string }
            width: { type: integer }
            height: { type: integer }
            fps: { type: number }
            bitrate: { type: integer }
    CameraOnvifVideoConfigResult:
      type: object
      additionalProperties: false
      required: [success]
      properties:
        success: { type: boolean }
        configurations:
          type: array
          items:
            type: object
            properties:
              token: { type: string }
              name: { type: string }
              encoding: { type: string }
              width: { type: integer }
              height: { type: integer }
              fps: { type: number }
              bitrate: { type: integer }
    CameraOnvifVideoEncodingRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        endpoint: { type: string, maxLength: 2048 }
        username: { type: string, maxLength: 128 }
        password: { type: string, maxLength: 256, writeOnly: true }
        action: { type: string, enum: [options, set] }
        config_token: { type: string, maxLength: 128, description: "Encoder configuration to change; required for set." }
        encoding: { type: string, enum: [H264, H265], description: "Target encoding; required for set." }
    CameraOnvifVideoEncodingResult:
      type: object
      additionalProperties: false
      required: [success, supported]
      properties:
        success: { type: boolean }
        supported: { type: boolean, description: "False when the camera has no Media2 service." }
        code: { type: string }
        detail: { type: string }
        previous_encoding: { type: string }
        encoding: { type: string }
        configurations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [token, name, encoding, width, height, fps, bitrate, supported_encodings]
            properties:
              token: { type: string }
              name: { type: string }
              encoding: { type: string }
              profile: { type: string }
              width: { type: integer }
              height: { type: integer }
              fps: { type: number }
              bitrate: { type: integer }
              supported_encodings: { type: array, items: { type: string } }
    CameraOnvifImagingRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        endpoint: { type: string, maxLength: 2048 }
        username: { type: string, maxLength: 128 }
        password: { type: string, maxLength: 256, writeOnly: true }
        video_source_token: { type: string, maxLength: 128 }
        action: { type: string, enum: [get, options, set] }
        settings:
          type: object
          properties:
            brightness: { type: number }
            color_saturation: { type: number }
            contrast: { type: number }
            sharpness: { type: number }
            ir_cut_filter: { type: string }
            wdr_mode: { type: string }
            wdr_level: { type: number }
    CameraOnvifImagingResult:
      type: object
      additionalProperties: false
      required: [success]
      properties:
        success: { type: boolean }
        settings:
          type: object
          properties:
            brightness: { type: number }
            color_saturation: { type: number }
            contrast: { type: number }
            sharpness: { type: number }
            ir_cut_filter: { type: string }
            wdr_mode: { type: string }
            wdr_level: { type: number }
        options:
          type: object
          additionalProperties: false
          properties:
            brightness: { $ref: "#/components/schemas/OnvifFloatRange" }
            color_saturation: { $ref: "#/components/schemas/OnvifFloatRange" }
            contrast: { $ref: "#/components/schemas/OnvifFloatRange" }
            sharpness: { $ref: "#/components/schemas/OnvifFloatRange" }
            ir_cut_filter_modes: { type: array, items: { type: string } }
            wide_dynamic_range:
              type: object
              additionalProperties: false
              properties:
                modes: { type: array, items: { type: string } }
                level: { $ref: "#/components/schemas/OnvifFloatRange" }
    OnvifFloatRange:
      type: object
      additionalProperties: false
      required: [min, max]
      properties:
        min: { type: number }
        max: { type: number }
    OnvifProbeRequest:
      type: object
      additionalProperties: false
      required: [endpoint]
      properties:
        endpoint: { type: string, minLength: 1, maxLength: 2048, description: HTTP(S) ONVIF device endpoint on an IPv4 literal. }
        username: { type: string, maxLength: 256 }
        password: { type: string, maxLength: 1024, writeOnly: true }
    OnvifProbeResult:
      type: object
      additionalProperties: false
      required: [device_information, services, system_time]
      properties:
        device_information: { $ref: "#/components/schemas/OnvifProbeDeviceInformation" }
        services: { type: array, maxItems: 32, items: { $ref: "#/components/schemas/OnvifProbeService" } }
        system_time: { $ref: "#/components/schemas/OnvifProbeClock" }
        profiles: { type: array, maxItems: 32, items: { $ref: "#/components/schemas/OnvifProbeProfile" } }
    OnvifProbeProfile:
      type: object
      additionalProperties: false
      required: [token, name, fixed, media_version, source_configuration_token, encoder_configuration_token, ptz_configuration_token, encoding, width, height, fps, frame_rate, bitrate, stream_uri]
      properties:
        token: { type: string, maxLength: 256, description: Camera-assigned stable identity for this stream profile. }
        name: { type: string, maxLength: 256 }
        fixed: { type: boolean, description: Whether the device marks this profile as fixed. }
        media_version: { type: string, enum: ["1.0", "2.0"] }
        source_configuration_token: { type: string, maxLength: 256 }
        encoder_configuration_token: { type: string, maxLength: 256 }
        ptz_configuration_token: { type: string, maxLength: 256 }
        encoding: { type: string, maxLength: 256 }
        width: { type: integer, minimum: 0, maximum: 100000 }
        height: { type: integer, minimum: 0, maximum: 100000 }
        fps: { type: integer, minimum: 0, maximum: 10000, description: Integer compatibility view of the advertised frame rate. }
        frame_rate: { type: number, minimum: 0, maximum: 10000 }
        bitrate: { type: integer, minimum: 0, maximum: 100000000 }
        stream_uri: { type: string, maxLength: 2048, description: RTSP URI with user information and query parameters removed. }
    OnvifProbeDeviceInformation:
      type: object
      additionalProperties: false
      required: [manufacturer, model, firmware_version, serial_number, hardware_id]
      properties:
        manufacturer: { type: string, maxLength: 256 }
        model: { type: string, maxLength: 256 }
        firmware_version: { type: string, maxLength: 256 }
        serial_number: { type: string, maxLength: 256 }
        hardware_id: { type: string, maxLength: 256 }
    OnvifProbeService:
      type: object
      additionalProperties: false
      required: [namespace, xaddrs, version]
      properties:
        namespace: { type: string, maxLength: 256 }
        xaddrs: { type: array, maxItems: 16, items: { type: string, format: uri } }
        version: { $ref: "#/components/schemas/OnvifProbeVersion" }
    OnvifProbeVersion:
      type: object
      additionalProperties: false
      required: [major, minor]
      properties:
        major: { type: integer, minimum: 0, maximum: 10000 }
        minor: { type: integer, minimum: 0, maximum: 10000 }
    OnvifProbeClock:
      type: object
      additionalProperties: false
      required: [date_time_type, utc, local]
      properties:
        date_time_type: { type: string, maxLength: 256 }
        utc: { $ref: "#/components/schemas/OnvifProbeDateTime" }
        local: { $ref: "#/components/schemas/OnvifProbeDateTime" }
    OnvifProbeDateTime:
      type: object
      additionalProperties: false
      required: [time, date]
      properties:
        time: { $ref: "#/components/schemas/OnvifProbeTime" }
        date: { $ref: "#/components/schemas/OnvifProbeDate" }
    OnvifProbeTime:
      type: object
      additionalProperties: false
      required: [hour, minute, second]
      properties:
        hour: { type: integer, minimum: 0, maximum: 23 }
        minute: { type: integer, minimum: 0, maximum: 59 }
        second: { type: integer, minimum: 0, maximum: 60 }
    OnvifProbeDate:
      type: object
      additionalProperties: false
      required: [year, month, day]
      properties:
        year: { type: integer, minimum: 0, maximum: 9999 }
        month: { type: integer, minimum: 0, maximum: 12 }
        day: { type: integer, minimum: 0, maximum: 31 }
    ServerAgent:
      type: object
      required: [installed, version, current_version, outdated, binary_status, binary_upgrade_available]
      properties:
        installed: { type: boolean }
        version: { type: string }
        current_version: { type: string }
        outdated: { type: boolean }
        binary_status: { $ref: "#/components/schemas/ServerAgentBinaryStatus" }
        binary_available: { $ref: "#/components/schemas/ServerAgentBinaryIdentity" }
        binary_observed: { $ref: "#/components/schemas/ServerAgentBinaryIdentity" }
        binary_outdated: { type: boolean, description: "Present only when both exact binary digests were verified." }
        binary_upgrade_available: { type: boolean, description: "A user-triggered install or upgrade path is available; this does not imply a known binary mismatch." }
        variant: { type: string }
        ntp: { type: string }
        cpu_percent: { type: number }
        network_interfaces:
          type: array
          maxItems: 256
          items: { $ref: "#/components/schemas/ServerAgentNetworkInterface" }
          description: "Per-interface rates; absent for legacy agents or when no valid counter interval is available. Loopback is excluded."
        network_sampled_at: { type: string, format: date-time, description: "UTC time of the latest valid network rate sample." }
        memory_total_bytes: { type: integer, format: int64 }
        memory_available_bytes: { type: integer, format: int64 }
        coral: { type: boolean }
        coral_usb: { type: boolean }
        coral_pcie: { type: boolean }
        openvino: { type: boolean }
        hailo: { type: boolean }
        nvidia: { type: boolean }
        gpu_present: { type: boolean }
        gpu_vendor: { type: string }
        gpu_name: { type: string }
        cctv_total_bytes: { type: integer, format: int64 }
        cctv_free_bytes: { type: integer, format: int64 }
        database_total_bytes: { type: integer, format: int64 }
        database_free_bytes: { type: integer, format: int64 }
        storage_buffer_percent: { type: integer, description: "Percentage of storage reserved as safety buffer against corruption (default 15%)." }
        storage_watchdog: { type: boolean, description: "Whether edge agent storage watchdog is enabled." }
        storage_over_85_percent: { type: boolean, description: "True when storage usage exceeds 85% (free space < 15% safety buffer)." }
        database_critical: { type: boolean, description: "True when database mount has less than 15% free space remaining." }
        pruned_segments_count: { type: integer, format: int64, description: "Total number of emergency pruned old recording segments." }
        os: { type: string, description: "Operating system distribution and version" }
        sampled_at: { type: string, format: date-time, description: "UTC time when the agent sample was taken." }
        error: { type: string }
    ServerAgentBackup:
      type: object
      required: [exists, frigate_version, registered_by, sha256, size]
      properties:
        exists: { type: boolean, description: "False when the agent holds no original configuration yet." }
        saved_at: { type: string, format: date-time, nullable: true, description: "UTC time the agent stored the copy." }
        frigate_version: { type: string }
        registered_by: { type: string, description: "Free text saying which OpenVMS registered the server." }
        sha256: { type: string, description: "Hex digest of the stored config.yml." }
        size: { type: integer, description: "Size of the stored config.yml in bytes." }
    ServerAgentNetworkInterface:
      type: object
      required: [name, rx_bytes_per_second, tx_bytes_per_second]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        rx_bytes_per_second: { type: number, minimum: 0 }
        tx_bytes_per_second: { type: number, minimum: 0 }
        ip_address: { type: string }
        mac_address: { type: string }
        subnet: { type: string }
        netmask: { type: string }
        gateway: { type: string }
        is_default: { type: boolean }
        role:
          type: string
          enum: [cameras, monitoring, lan]
    ServerAgentBinaryStatus:
      type: string
      enum: [not_installed, current, update_available, unknown, unreachable]
      description: "Binary lifecycle state; separate from protocol version and the legacy protocol outdated flag."
    ServerAgentBinaryIdentity:
      type: object
      required: [sha256, architecture]
      properties:
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        architecture: { type: string, maxLength: 32 }
        version: { type: string, maxLength: 256, description: "Go binary release label; omitted when development or unavailable." }
        commit: { type: string, maxLength: 256, description: "Go VCS revision embedded in these exact binary bytes, when available." }
    Camera:
      type: object
      required: [id, tenant_id, site_id, server_id, remote_name, display_name, enabled, zones, lpr, status, group_ids, folder_id, sort_order, default_live_quality, description, location, tags, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        server_id: { type: string, format: uuid }
        remote_name:
          type: string
          description: Camera name inside its Frigate server.
        display_name: { type: string }
        enabled: { type: boolean }
        zones: { type: array, items: { type: string } }
        live_codec: { type: string, nullable: true, description: "Video codec of the live (sub) go2rtc stream as go2rtc reports it, lowercase (h264, h265); null when unknown." }
        hq_codec: { type: string, nullable: true, description: "Video codec of the hq (main) go2rtc stream; null when unknown." }
        lpr: { type: boolean }
        status: { $ref: "#/components/schemas/HealthStatus" }
        fps: { type: number, nullable: true }
        missing_since: { type: string, format: date-time, nullable: true }
        group_ids: { type: array, items: { type: string, format: uuid } }
        folder_id:
          type: string
          format: uuid
          nullable: true
          description: Shared explorer folder of the camera's server; null at the server root.
        sort_order: { type: integer, description: Shared position inside its folder (or the server root). }
        default_live_quality:
          $ref: "#/components/schemas/CameraLiveQuality"
        description: { type: string, maxLength: 1000 }
        location: { type: string, maxLength: 200 }
        tags: { type: array, items: { type: string, maxLength: 40 }, maxItems: 20 }
        onvif_endpoint: { type: string, nullable: true }
        onvif_profile: { type: string, nullable: true }
        onvif_version: { type: string, nullable: true }
        onvif_capabilities:
          $ref: "#/components/schemas/CameraOnvifCapabilities"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CameraFolder:
      type: object
      required: [id, tenant_id, server_id, name, sort_order, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        server_id: { type: string, format: uuid }
        name: { type: string }
        sort_order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CameraLiveQuality:
      type: string
      enum: [sub, main]
      description: Stream a camera gets when it is added to a Live grid tile. VMS-owned; the Frigate sync never overwrites it.
    CameraUpdate:
      type: object
      properties:
        display_name: { type: string, minLength: 1, maxLength: 200 }
        enabled: { type: boolean }
        default_live_quality:
          $ref: "#/components/schemas/CameraLiveQuality"
        description: { type: string, maxLength: 1000 }
        location: { type: string, maxLength: 200 }
        tags:
          type: array
          items: { type: string, maxLength: 40 }
          maxItems: 20
          description: Replaces the camera's tags. Values are trimmed and de-duplicated case-insensitively.
        onvif_endpoint: { type: string, maxLength: 2048, nullable: true }
        onvif_profile: { type: string, maxLength: 64, nullable: true }
        onvif_version: { type: string, maxLength: 64, nullable: true }
    CameraZonePoint:
      type: object
      required: [x, y]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
      description: Normalized coordinate within the camera frame; persisted to three decimal places.
    CameraZoneInput:
      type: object
      required: [name, points]
      properties:
        name: { type: string, pattern: "^[a-z0-9_]+$", maxLength: 128 }
        points:
          type: array
          minItems: 3
          items: { $ref: "#/components/schemas/CameraZonePoint" }
        settings:
          type: object
          additionalProperties: true
          description: Frigate zone options other than name and coordinates, preserved for synchronization.
    CameraZone:
      allOf:
        - $ref: "#/components/schemas/CameraZoneInput"
        - type: object
          required: [id, camera_id, settings, created_at, updated_at]
          properties:
            id: { type: string, format: uuid, readOnly: true }
            camera_id: { type: string, format: uuid, readOnly: true }
            settings: { type: object, additionalProperties: true }
            created_at: { type: string, format: date-time, readOnly: true }
            updated_at: { type: string, format: date-time, readOnly: true }
            sync_status:
              type: string
              enum: [pending, synced, failed, conflict]
              readOnly: true
              description: State of synchronization to Frigate; failed and conflict can be retried with retryCameraZoneSync.
            sync_error: { type: string, readOnly: true, description: Last synchronization failure or conflict reason; absent unless failed or conflicted. }
    CameraPtzTourStep:
      type: object
      additionalProperties: false
      required: [preset_token, dwell_seconds, speed]
      properties:
        preset_token: { type: string, minLength: 1, maxLength: 128 }
        preset_name: { type: string, maxLength: 128 }
        dwell_seconds: { type: integer, minimum: 0, maximum: 3600 }
        speed: { type: number, minimum: 0, maximum: 1 }
    CameraPtzTourInput:
      type: object
      additionalProperties: false
      required: [name, steps]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        steps:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/CameraPtzTourStep" }
        repeat_count: { type: integer, minimum: 0, maximum: 1000, description: 0 repeats until stopped. }
    CameraPtzTour:
      type: object
      required: [id, camera_id, name, steps, repeat_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        camera_id: { type: string, format: uuid }
        name: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/CameraPtzTourStep" }
        repeat_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CameraPtzTourList:
      type: object
      required: [tours]
      properties:
        tours:
          type: array
          items: { $ref: "#/components/schemas/CameraPtzTour" }
    CameraZoneList:
      type: object
      required: [zones]
      properties:
        zones:
          type: array
          items: { $ref: "#/components/schemas/CameraZone" }
    CameraConfig:
      type: object
      description: Engine-agnostic configuration model of one camera.
      required: [identity, origin, device, capabilities, streams, recording, detection, analytics, zones, ptz, fisheye, integrations, overrides, sources, warnings, state]
      properties:
        state: { $ref: "#/components/schemas/CameraConfigState" }
        profile: { $ref: "#/components/schemas/CameraConfigProfileRef" }
        provenance:
          type: object
          description: Where each field's effective value comes from (engine, profile, override), by patch path.
          additionalProperties: { $ref: "#/components/schemas/CameraConfigProvenance" }
        identity:
          type: object
          required: [camera_id, name, remote_name, tags, enabled]
          properties:
            camera_id: { type: string }
            name: { type: string }
            remote_name: { type: string }
            description: { type: string }
            location: { type: string }
            tags: { type: array, items: { type: string } }
            enabled: { type: boolean }
        origin:
          type: object
          required: [engine, server_id]
          properties:
            engine: { type: string, description: Engine kind, for example frigate. }
            engine_version: { type: string }
            server_id: { type: string }
            server_name: { type: string }
        device:
          type: object
          properties:
            manufacturer: { type: string }
            model: { type: string }
            firmware: { type: string }
            serial_number: { type: string }
            address: { type: string }
            onvif_version: { type: string }
            onvif_profile: { type: string }
        capabilities:
          type: array
          description: Only capabilities with positive evidence.
          items:
            type: string
            enum: [onvif, audio, ptz, lpr, fisheye, object_detection, recording, analytics, events]
        streams:
          type: object
          description: Streams by role; recording is present only when it differs from primary.
          properties:
            primary: { $ref: "#/components/schemas/CameraConfigStream" }
            detection: { $ref: "#/components/schemas/CameraConfigStream" }
            recording: { $ref: "#/components/schemas/CameraConfigStream" }
        recording:
          type: object
          properties:
            enabled: { type: boolean }
        detection:
          type: object
          required: [objects]
          properties:
            enabled: { type: boolean }
            objects: { type: array, items: { type: string }, description: Raw engine labels being tracked }
            selection: { type: array, items: { type: string }, description: Catalog object ids collapsed from the tracked labels }
            categories: { type: array, items: { type: string }, description: Catalog categories whose every engine-supported object is selected }
            raw: { type: array, items: { type: string }, description: Tracked labels the catalog does not know }
            available_labels: { type: array, items: { type: string }, description: Labels the engine model supports; omitted when unknown }
            notes: { type: array, items: { type: string }, description: Limits of what the engine reports (for example Provision does not tell vehicle types apart); omitted when none }
        analytics:
          type: object
          required: [modules]
          properties:
            lpr: { type: boolean }
            audio: { type: boolean }
            modules:
              type: array
              description: Analytics handled as modules, in display order. A module is available only with positive evidence.
              items: { $ref: "#/components/schemas/CameraAnalyticsModule" }
        zones:
          type: array
          items:
            type: object
            required: [name, objects]
            properties:
              name: { type: string }
              objects: { type: array, items: { type: string } }
        ptz:
          type: object
          required: [supported]
          properties:
            supported: { type: boolean }
            autotracking: { type: boolean }
        fisheye:
          type: object
          required: [supported]
          properties:
            supported: { type: boolean }
        integrations:
          type: array
          description: |
            Features wired to the camera and, with an `id`, the status of each backend integration
            (frigate, onvif, provision_isr). Statuses come from evidence OpenVMS already has.
          items:
            type: object
            required: [name, enabled]
            properties:
              name: { type: string }
              enabled: { type: boolean }
              id: { type: string, enum: [frigate, onvif, provision_isr] }
              label: { type: string }
              status: { type: string, enum: [connected, not_configured, error, unknown] }
              detail: { type: string }
        overrides:
          type: object
          properties:
            default_live_quality: { type: string }
        sources:
          type: array
          description: |
            Where each part of the model came from and whether it could be read. The `onvif` source
            (present when the caller may use the camera's ONVIF credentials) carries a video reason
            code in `detail` when the camera's own video settings could not be read.
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string }
              status: { type: string, enum: [ok, unavailable] }
              detail: { type: string }
        warnings: { type: array, items: { type: string } }
    CameraVideoReason:
      type: string
      enum: [no_onvif, no_credentials, unreachable, unsupported]
    CameraVideoOptions:
      type: object
      required: [camera_id, available, streams]
      properties:
        camera_id: { type: string, format: uuid }
        available: { type: boolean, description: True when at least one stream could be read. }
        reason: { $ref: "#/components/schemas/CameraVideoReason" }
        streams:
          type: array
          items: { $ref: "#/components/schemas/CameraStreamVideoOptions" }
    CameraStreamVideoOptions:
      type: object
      required: [role, available, codecs, apply_via]
      properties:
        role: { type: string, enum: [primary, detection] }
        profile_token: { type: string }
        profile_name: { type: string }
        available: { type: boolean }
        reason: { $ref: "#/components/schemas/CameraVideoReason" }
        current:
          type: object
          description: Values the stream uses now; an item the camera did not report is omitted.
          properties:
            codec: { type: string, example: h264 }
            width: { type: integer }
            height: { type: integer }
            fps: { type: number }
            bitrate_kbps: { type: integer }
            bitrate_mode: { type: string }
            gop: { type: integer }
        codecs:
          type: array
          items:
            type: object
            required: [codec, resolutions, frame_rates, bitrate_modes]
            properties:
              codec: { type: string, example: h264 }
              resolutions:
                type: array
                items:
                  type: object
                  required: [width, height]
                  properties: { width: { type: integer }, height: { type: integer } }
              frame_rates: { type: array, items: { type: number }, description: Discrete FPS values when the camera lists them. }
              fps: { $ref: "#/components/schemas/CameraVideoRange" }
              bitrate_kbps: { $ref: "#/components/schemas/CameraVideoRange" }
              gop: { $ref: "#/components/schemas/CameraVideoRange" }
              bitrate_modes: { type: array, items: { type: string } }
        apply_via:
          type: object
          required: [resolution, fps, codec, bitrate_kbps, gop]
          properties:
            resolution: { $ref: "#/components/schemas/CameraVideoApplyVia" }
            fps: { $ref: "#/components/schemas/CameraVideoApplyVia" }
            codec: { $ref: "#/components/schemas/CameraVideoApplyVia" }
            bitrate_kbps: { $ref: "#/components/schemas/CameraVideoApplyVia" }
            gop: { $ref: "#/components/schemas/CameraVideoApplyVia" }
    CameraVideoRange:
      type: object
      required: [min, max]
      properties: { min: { type: number }, max: { type: number } }
    CameraVideoApplyVia:
      type: string
      enum: [onvif, frigate, none]
    CameraConfigOrigin:
      type: string
      description: Where a configuration change comes from. Defaults to ui.
      enum: [ui, profile, group, api, sync, yaml, external_device]
    CameraAnalyticsModule:
      type: object
      required: [id, label, available, enabled, writable, engine, settings, advanced]
      properties:
        id: { type: string, enum: [lpr, face_detection, face_recognition, vehicle_classification, vehicle_color, clothing_color, similar_search] }
        label: { type: string, example: Matrículas (LPR) }
        available: { type: boolean }
        enabled: { type: boolean }
        writable: { type: boolean, description: OpenVMS can switch the module through its engine }
        engine: { type: string, enum: [frigate, provision, native, none] }
        reason: { type: string, description: Why the module cannot be switched on from here, example No disponible con este motor }
        settings:
          type: object
          description: Only fields with a real backing in the engine
          properties:
            min_area: { type: integer, description: Smallest object area, in pixels, the engine analyses }
        advanced:
          type: array
          description: Read-only summary of the engine-specific parameters
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: string }
    CameraConfigPatch:
      type: object
      description: |
        Sparse change to the normalized model; omitted fields stay as they are. The fields that can
        be changed today are `detection.enabled` (boolean), `detection.objects` (raw engine object
        labels), `detection.selection` (catalog object or category ids from
        `/api/v1/camera-config/object-catalog`, expanded to the engine labels its model supports;
        sending it together with `detection.objects` is a 400, and ids the model cannot honor are
        listed in the review `unsupported` and rejected on apply), `recording.enabled` (boolean),
        `analytics.lpr` (boolean), `analytics.modules.<id>.enabled` (boolean; `lpr` is the same
        switch as `analytics.lpr`) and `analytics.modules.<id>.settings.min_area` (lpr and
        face_recognition), where an unknown module id is a 400 and so is a module that is not
        available or not configurable for the camera (for example Provision LPR), and
        `streams.primary` / `streams.detection`, each a sparse object
        with `resolution` ({width, height}), `fps`, `codec` (h264, h265, mjpeg, mpeg4),
        `bitrate_kbps` and `gop`. Stream fields are written to the camera over ONVIF; the detection
        stream's `resolution` and `fps` go to Frigate's detect section when it has no ONVIF profile
        of its own (see getCameraVideoOptions `apply_via`). The schema is deliberately open so the
        server can reject every other field,
        nested ones included, with 400 instead of dropping it silently.
      additionalProperties: true
      example:
        detection: { enabled: true, objects: [person, car] }
        recording: { enabled: true }
        analytics: { lpr: false }
    ObjectCatalog:
      type: object
      required: [engine, categories]
      properties:
        engine: { type: string }
        categories:
          type: array
          items:
            type: object
            required: [id, label, objects]
            properties:
              id: { type: string, example: vehicle }
              label: { type: string, example: Vehículos }
              objects:
                type: array
                items:
                  type: object
                  required: [id, label, requires_model, supported]
                  properties:
                    id: { type: string, example: vehicle.truck }
                    label: { type: string, example: Camión }
                    requires_model: { type: boolean }
                    supported: { type: boolean, nullable: true, description: null means unknown }
    CameraConfigReview:
      type: object
      required: [changes, impact, unsupported]
      properties:
        changes:
          type: array
          items:
            type: object
            required: [path, label]
            properties:
              path: { type: string, example: detection.enabled }
              label: { type: string, example: detección de objetos }
              from: { nullable: true, description: Current value; null when the engine did not report it }
              to: { nullable: true }
        impact:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [engine_reload, engine_restart, recording_interruption, stream_restart] }
              message: { type: string, example: "Frigate recargará configuración;" }
        unsupported:
          type: array
          description: Fields of the request the engine cannot apply (never silently dropped)
          items: { type: string }
    CameraConfigState:
      type: object
      description: Desired state against the effective state reported by the engine.
      required: [desired_revision, applied_revision, sync_state, last_error, drift]
      properties:
        desired_revision: { type: integer, format: int64 }
        applied_revision: { type: integer, format: int64 }
        sync_state:
          type: string
          description: synced = Sincronizado, pending = Cambios pendientes, drift = Diferencia detectada, error = Error, unverifiable = No verificable
          enum: [synced, pending, drift, error, unverifiable]
        last_error: { type: string, description: Sanitized; never carries credentials }
        drift:
          type: array
          items:
            type: object
            required: [path]
            properties:
              path: { type: string }
              desired: { nullable: true }
              effective: { nullable: true }
    CameraConfigApplyResult:
      type: object
      required: [result, state, review]
      properties:
        result: { type: string, enum: [ok, error, unverified] }
        state: { $ref: "#/components/schemas/CameraConfigState" }
        review: { $ref: "#/components/schemas/CameraConfigReview" }
        plain_error:
          description: |
            The apply's failure in plain words with the technical text apart. Additive: `state.last_error`
            keeps the sanitized raw text. Absent when the apply did not fail.
          allOf:
            - { $ref: "#/components/schemas/CameraPlainError" }
    CameraPlainError:
      type: object
      description: |
        A failure in plain words (`message`, shown by default) with the sanitized technical text
        (`technical`, shown under "Ver información técnica"). Credentials, query strings and
        key=value secrets are removed from `technical`.
      required: [message, technical]
      properties:
        message: { type: string, example: "No se pudo iniciar el stream de grabación." }
        technical: { type: string, example: ffmpeg exited with code 1 }
    CameraYamlManagedPath:
      type: object
      description: A part of the engine configuration that OpenVMS manages (path relative to the section).
      required: [patch_path, engine_path, value]
      properties:
        patch_path: { type: string, example: detection.enabled }
        engine_path: { type: string, example: enabled }
        value: { nullable: true, description: The value OpenVMS wants }
    CameraYamlSection:
      type: object
      required: [camera_id, section, yaml, exists, secrets_visible, managed_paths, revision]
      properties:
        camera_id: { type: string, format: uuid }
        section: { type: string }
        yaml: { type: string }
        exists: { type: boolean, description: false when the camera has no such section yet }
        secrets_visible: { type: boolean }
        managed_paths:
          type: array
          items: { $ref: "#/components/schemas/CameraYamlManagedPath" }
        revision: { type: integer, format: int64 }
    CameraYamlSyntaxIssue:
      type: object
      required: [line, column, message]
      properties:
        line: { type: integer }
        column: { type: integer }
        message: { type: string }
    CameraYamlSchemaIssue:
      type: object
      required: [path, message]
      properties:
        path: { type: string, description: Dotted path from the section }
        message: { type: string }
    CameraYamlChange:
      type: object
      required: [path, kind]
      properties:
        path: { type: string }
        kind: { type: string, enum: [added, removed, changed] }
        from: { nullable: true }
        to: { nullable: true }
    CameraYamlConflict:
      type: object
      required: [patch_path, engine_path]
      properties:
        patch_path: { type: string }
        engine_path: { type: string }
        desired: { nullable: true }
        new: { nullable: true }
    CameraYamlValidation:
      type: object
      required: [section, valid, schema_checked, syntax, schema, changes, managed_conflicts, warnings, revision]
      properties:
        section: { type: string }
        valid: { type: boolean }
        schema_checked: { type: boolean }
        syntax:
          type: array
          items: { $ref: "#/components/schemas/CameraYamlSyntaxIssue" }
        schema:
          type: array
          items: { $ref: "#/components/schemas/CameraYamlSchemaIssue" }
        changes:
          type: array
          items: { $ref: "#/components/schemas/CameraYamlChange" }
        managed_conflicts:
          type: array
          items: { $ref: "#/components/schemas/CameraYamlConflict" }
        warnings:
          type: array
          items: { type: string }
        revision: { type: integer, format: int64 }
    CameraYamlApplyResult:
      type: object
      required: [validation, frigate, marked_drift, revision, sync_state]
      properties:
        validation: { $ref: "#/components/schemas/CameraYamlValidation" }
        frigate: { $ref: "#/components/schemas/FrigatePatchResult" }
        marked_drift: { type: boolean, description: true when managed parameters were changed and the camera was left in drift }
        revision: { type: integer, format: int64, description: The camera's desired-state revision after the edit }
        sync_state: { type: string, description: Stored sync state when it was just marked; empty otherwise }
    CameraConfigHistoryChange:
      type: object
      required: [path]
      properties:
        path: { type: string }
        from: { nullable: true }
        to: { nullable: true }
    CameraConfigHistoryEntry:
      type: object
      required: [id, time, origin, result, changes, rollbackable]
      properties:
        id: { type: integer, format: int64, description: Audit id; pass it as audit_id to roll back }
        time: { type: string, format: date-time }
        user_id: { type: string, format: uuid, nullable: true }
        user: { type: string }
        origin: { $ref: "#/components/schemas/CameraConfigOrigin" }
        result: { type: string, enum: [ok, error, unverified] }
        section: { type: string, description: Set for YAML edits }
        changes:
          type: array
          items: { $ref: "#/components/schemas/CameraConfigHistoryChange" }
        error: { $ref: "#/components/schemas/CameraPlainError" }
        rollback_of: { type: integer, format: int64, description: The change this one undid }
        rolled_back_by: { type: integer, format: int64, description: The change that undid this one }
        rollbackable: { type: boolean }
        rollback_reason: { type: string }
    CameraConfigRollbackResult:
      type: object
      required: [rolled_back, result]
      properties:
        rolled_back: { type: integer, format: int64, description: Audit id of the change that was undone }
        result: { $ref: "#/components/schemas/CameraConfigApplyResult" }
    CameraAdvancedProfile:
      type: object
      required: [token, name, encoding, width, height, fps, bitrate, stream_uri]
      properties:
        token: { type: string }
        name: { type: string }
        encoding: { type: string }
        width: { type: integer }
        height: { type: integer }
        fps: { type: number }
        bitrate: { type: integer }
        stream_uri: { type: string, description: Scheme, host and path only }
    CameraAdvanced:
      type: object
      required: [camera_id, frigate, onvif, provision]
      properties:
        camera_id: { type: string, format: uuid }
        frigate:
          type: object
          required: [available, version, sections, managed_sections, desired_revision, applied_revision, sync_state]
          properties:
            available: { type: boolean }
            reason: { type: string }
            version: { type: string }
            sections: { type: array, items: { type: string } }
            managed_sections: { type: array, items: { type: string } }
            desired_revision: { type: integer, format: int64 }
            applied_revision: { type: integer, format: int64 }
            sync_state: { type: string }
        onvif:
          type: object
          required: [configured, endpoint, profiles, capabilities, services, reported]
          properties:
            configured: { type: boolean }
            endpoint: { type: string, description: Scheme, host and path only }
            version: { type: string }
            profile: { type: string }
            manufacturer: { type: string }
            model: { type: string }
            firmware: { type: string }
            profiles: { type: array, items: { $ref: "#/components/schemas/CameraAdvancedProfile" } }
            capabilities: { type: object, additionalProperties: { type: boolean } }
            services: { type: array, items: { type: string } }
            reported: { type: object, additionalProperties: true }
        provision:
          type: object
          required: [evidence, tags, link]
          properties:
            evidence: { type: boolean }
            tags: { type: array, items: { type: string } }
            manufacturer: { type: string }
            model: { type: string }
            link:
              type: object
              description: The agent's view of the camera; reachable=false when it could not be asked.
              required: [reachable, registered, online, event_count]
              properties:
                reachable: { type: boolean }
                registered: { type: boolean }
                online: { type: boolean }
                event_count: { type: integer, format: int64 }
                last_event_at: { type: string, format: date-time, nullable: true }
    CameraConfigProvenance:
      type: object
      required: [source]
      properties:
        source: { type: string, enum: [engine, profile, override], description: "engine = heredado; profile = definido por perfil; override = modificado localmente" }
        profile_id: { type: string }
        profile_name: { type: string }
    CameraConfigProfileRef:
      type: object
      required: [id, name, version, outdated]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: integer, format: int64 }
        outdated: { type: boolean }
    CameraConfigProfileInput:
      type: object
      required: [name, patch]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        patch: { $ref: "#/components/schemas/CameraConfigPatch" }
        expected_version: { type: integer, format: int64, minimum: 0 }
    CameraConfigProfile:
      type: object
      required: [id, name, description, patch, version, camera_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        patch: { $ref: "#/components/schemas/CameraConfigPatch" }
        version: { type: integer, format: int64 }
        camera_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CameraConfigProfileDetail:
      allOf:
        - $ref: "#/components/schemas/CameraConfigProfile"
        - type: object
          required: [cameras]
          properties:
            cameras:
              type: array
              items:
                type: object
                required: [camera_id, outdated]
                properties:
                  camera_id: { type: string, format: uuid }
                  outdated: { type: boolean }
    CameraConfigProfileAssign:
      type: object
      required: [profile_id]
      properties:
        profile_id: { type: string, format: uuid, nullable: true, description: null unlinks the camera's profile }
        keep_values: { type: boolean, default: true, description: Only when unlinking; keep the profile's current values as overrides. }
    CameraConfigProfileReview:
      type: object
      required: [review, parameters, shadowed, converted, dropped]
      properties:
        profile: { $ref: "#/components/schemas/CameraConfigProfileRef" }
        review: { $ref: "#/components/schemas/CameraConfigReview" }
        parameters: { type: integer }
        shadowed: { type: array, items: { type: string } }
        converted: { type: array, items: { type: string } }
        dropped: { type: array, items: { type: string } }
    CameraConfigProfileApplyResult:
      type: object
      required: [review]
      properties:
        review: { $ref: "#/components/schemas/CameraConfigProfileReview" }
        apply: { $ref: "#/components/schemas/CameraConfigApplyResult" }
    CameraConfigBulkRequest:
      type: object
      required: [patch]
      properties:
        camera_ids: { type: array, maxItems: 200, items: { type: string, format: uuid } }
        group_id: { type: string, format: uuid }
        patch: { $ref: "#/components/schemas/CameraConfigPatch" }
        origin: { type: string, enum: [group, api], default: group }
    CameraConfigBulkReport:
      type: object
      required: [section, rows, totals, restarts]
      properties:
        section: { type: string, enum: [detection, recording, analytics, streams] }
        restarts: { type: integer, description: Cameras whose change needs an engine restart. }
        totals:
          type: object
          required: [cameras, will_apply, applied, failed, incompatible, skipped, unreachable]
          properties:
            cameras: { type: integer }
            will_apply: { type: integer }
            applied: { type: integer }
            failed: { type: integer }
            incompatible: { type: integer }
            skipped: { type: integer }
            unreachable: { type: integer }
        rows:
          type: array
          items:
            type: object
            required: [camera_id, name, status, changes, impact, reason]
            properties:
              camera_id: { type: string }
              name: { type: string }
              status: { type: string, enum: [will_apply, applied, failed, incompatible, skipped, unreachable] }
              changes: { type: array, items: { type: object, required: [path, label], properties: { path: { type: string }, label: { type: string }, from: { nullable: true }, to: { nullable: true } } } }
              impact: { type: array, items: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string } } } }
              reason: { type: string }
    CameraConfigStream:
      type: object
      required: [roles]
      properties:
        name: { type: string }
        url: { type: string, description: Scheme, host and path only; never credentials or query. }
        codec: { type: string }
        width: { type: integer }
        height: { type: integer }
        fps: { type: number }
        bitrate_kbps: { type: integer, description: Read from the camera (ONVIF) when reachable. }
        gop: { type: integer, description: Read from the camera (ONVIF) when reachable. }
        roles: { type: array, items: { type: string } }
    CameraFrigateConfig:
      type: object
      required: [camera_id, camera_name, server_id, detect_enabled, tracked_objects, lpr_enabled, zones]
      properties:
        camera_id: { type: string, format: uuid }
        camera_name: { type: string }
        server_id: { type: string, format: uuid }
        detect_enabled: { type: boolean }
        tracked_objects: { type: array, items: { type: string } }
        lpr_enabled: { type: boolean }
        zones: { type: array, items: { type: string } }
    CameraFrigateConfigUpdate:
      type: object
      properties:
        detect_enabled: { type: boolean }
        tracked_objects: { type: array, items: { type: string } }
        lpr_enabled: { type: boolean }
    FrigateCameraConfigDoc:
      type: object
      required: [camera_id, camera_name, server_id, frigate_version, editable, secrets_visible, config]
      properties:
        camera_id: { type: string, format: uuid }
        camera_name: { type: string }
        server_id: { type: string, format: uuid }
        frigate_version: { type: string }
        editable: { type: boolean }
        secrets_visible: { type: boolean }
        config: { type: object, additionalProperties: true, description: The camera section of Frigate's effective config. }
    FrigateConfigPatch:
      type: object
      required: [sections]
      properties:
        sections:
          type: object
          additionalProperties: true
          description: Top-level camera section name to its new value. Objects are merged into the current section, lists are replaced.
    FrigateSectionResult:
      type: object
      required: [section, applied_live, requires_restart]
      properties:
        section: { type: string }
        applied_live: { type: boolean }
        requires_restart: { type: boolean }
    FrigatePatchResult:
      type: object
      required: [revision_id, sections, restart_required]
      properties:
        revision_id: { type: string, format: uuid }
        sections: { type: array, items: { $ref: "#/components/schemas/FrigateSectionResult" } }
        restart_required: { type: boolean }
    FrigateRawConfig:
      type: object
      required: [yaml]
      properties:
        yaml: { type: string }
    FrigateRawSaveResult:
      type: object
      required: [revision_id, restart_required]
      properties:
        revision_id: { type: string, format: uuid }
        restart_required: { type: boolean }
    FrigateConfigRevision:
      type: object
      required: [id, server_id, actor_name, kind, sections, patch, created_at]
      properties:
        id: { type: string, format: uuid }
        server_id: { type: string, format: uuid }
        camera_id: { type: string, format: uuid, nullable: true }
        actor_user_id: { type: string, format: uuid, nullable: true }
        actor_name: { type: string }
        kind: { type: string, enum: [camera_patch, server_patch, raw_save, rollback] }
        sections: { type: array, items: { type: string } }
        patch: { type: object, additionalProperties: true }
        before_yaml: { type: string, description: Only with servers.config.secrets and include_yaml=true. }
        after_yaml: { type: string, description: Only with servers.config.secrets and include_yaml=true. }
        created_at: { type: string, format: date-time }
    FrigateConfigRevisionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FrigateConfigRevision" } }
    CameraGroupFilter:
      type: object
      additionalProperties: false
      description: |
        Selects the tenant's cameras of a dynamic group. Fields combine with AND, the values of one field
        with OR. At least one field must be set. Tags match case-insensitively; name_contains is a
        case-insensitive substring of the camera display name.
      properties:
        site_ids: { type: array, items: { type: string, format: uuid }, maxItems: 100 }
        server_ids: { type: array, items: { type: string, format: uuid }, maxItems: 100 }
        tags: { type: array, items: { type: string, maxLength: 64 }, maxItems: 100 }
        name_contains: { type: string, maxLength: 200 }
    CameraGroupInput:
      type: object
      required: [tenant_id, name]
      properties:
        tenant_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        camera_ids:
          type: array
          description: Members of a manual group. Must be empty or omitted when filter is set.
          items: { type: string, format: uuid }
          maxItems: 5000
        filter:
          $ref: "#/components/schemas/CameraGroupFilter"
    CameraGroup:
      type: object
      required: [id, tenant_id, name, description, camera_ids, member_count_total, member_count_hidden, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        camera_ids:
          type: array
          description: Members the caller can view.
          items: { type: string, format: uuid }
        filter:
          allOf:
            - $ref: "#/components/schemas/CameraGroupFilter"
          description: Present for dynamic groups; absent for manual groups.
        member_count_total:
          type: integer
          description: Every member of the group in the tenant, whether or not the caller can view it.
        member_count_hidden:
          type: integer
          description: Members the caller cannot view (member_count_total minus camera_ids).
        version:
          type: integer
          description: Incremented on every update; send it in If-Match for optimistic locking.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LivenessStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadinessStatus:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/DependencyCheck"
    DependencyCheck:
      type: object
      required: [name, status, latency_ms]
      properties:
        name:
          type: string
          example: postgres
        status:
          type: string
          enum: [ok, error]
        latency_ms:
          type: integer
          format: int64
        error:
          type: string
    Features:
      type: object
      required: [persistent_players, video_surface_layer, adaptive_streaming, stream_prewarming, seamless_quality_switch, maps]
      properties:
        persistent_players: { type: boolean }
        video_surface_layer: { type: boolean }
        adaptive_streaming: { type: boolean }
        stream_prewarming: { type: boolean }
        seamless_quality_switch: { type: boolean }
        maps: { type: boolean }
    SystemInfo:
      type: object
      required: [name, version, commit, build_time, go_version, schema_version]
      properties:
        name:
          type: string
          example: openvms-api
        version:
          type: string
          example: v0.1.0
        commit:
          type: string
        build_time:
          type: string
        go_version:
          type: string
        schema_version:
          type: integer
          format: int64
          description: Latest applied database migration.
    SystemCapacity:
      type: object
      required: [cpu, memory, disk, gpu, openvino, classifier]
      properties:
        cpu:
          type: object
          required: [model, online, percent]
          properties:
            model: { type: string }
            online: { type: integer }
            percent: { type: number, format: float }
        memory:
          type: object
          required: [total_bytes, available_bytes]
          properties:
            total_bytes: { type: integer, format: int64 }
            available_bytes: { type: integer, format: int64 }
        disk:
          type: object
          required: [path, total_bytes, free_bytes]
          properties:
            path: { type: string }
            total_bytes: { type: integer, format: int64 }
            free_bytes: { type: integer, format: int64 }
        gpu:
          type: object
          required: [present, vendor, name]
          properties:
            present: { type: boolean }
            vendor: { type: string }
            name: { type: string }
        openvino:
          type: object
          required: [installed, active, runtime]
          properties:
            installed: { type: boolean }
            active: { type: boolean }
            runtime: { type: string }
        classifier:
          type: object
          required: [installed, measuring, cameras_on, cameras_total]
          properties:
            installed: { type: boolean }
            measuring: { type: boolean }
            model: { type: string }
            latency_ms: { type: number, format: float }
            crops_per_second: { type: number, format: float }
            crops_per_minute: { type: number, format: float }
            threads: { type: integer }
            cameras_on: { type: integer }
            cameras_total: { type: integer }
    ClassifyPolicy:
      type: object
      required: [servers, cameras]
      properties:
        servers:
          type: array
          items:
            type: object
            required: [id, enabled]
            properties:
              id: { type: string, format: uuid }
              enabled: { type: boolean }
        cameras:
          type: array
          items:
            type: object
            required: [id, server_id, enabled, effective]
            properties:
              id: { type: string, format: uuid }
              server_id: { type: string, format: uuid }
              enabled: { type: boolean }
              effective: { type: boolean }
    BodyClassifyInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
    Severity:
      type: string
      enum: [alert, detection]
    Event:
      type: object
      required: [id, tenant_id, site_id, site_name, server_id, server_name, camera_id, camera_name, remote_id, severity, labels, sub_labels, zones, plates, start_time, reviewed, has_thumbnail, has_snapshot, has_preview, tracks]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        site_name: { type: string }
        server_id: { type: string, format: uuid }
        server_name: { type: string }
        camera_id: { type: string, format: uuid }
        camera_name: { type: string }
        remote_id:
          type: string
          description: Review id inside the origin Frigate.
        severity: { $ref: "#/components/schemas/Severity" }
        labels: { type: array, items: { type: string } }
        sub_labels:
          type: array
          description: >-
            On LPR-capable cameras, recognized plate text (empty without lpr.view). On other
            cameras, an ordinary event field (e.g. a recognized face name) visible under normal
            events.view.
          items: { type: string }
        zones: { type: array, items: { type: string } }
        plates:
          type: array
          description: Normalized plates read during the event. Empty without lpr.view.
          items: { type: string }
        start_time: { type: string, format: date-time }
        end_time:
          type: string
          format: date-time
          nullable: true
          description: Null while the event is in progress.
        reviewed: { type: boolean }
        has_thumbnail:
          type: boolean
          description: The VMS keeps its own copy of the thumbnail.
        has_snapshot:
          type: boolean
          description: Frigate reported a saved snapshot for at least one detection of this event.
        has_preview:
          type: boolean
          description: >-
            The VMS has copied this event's preview clip to central storage (an OpenVMS-internal
            signal, not a probe of Frigate's own preview availability).
        attributes:
          $ref: "#/components/schemas/EventAttributes"
        tracks:
          type: array
          description: Tracked objects of this event as reported by Frigate. Empty when none were recorded.
          items: { $ref: "#/components/schemas/ObjectTrack" }
    ObjectTrack:
      type: object
      required: [object_id, label, zones, path, start_time]
      properties:
        object_id: { type: string, description: Tracked-object id inside the origin Frigate. }
        label: { type: string }
        zones:
          type: array
          description: Zones the object entered, as last reported by Frigate.
          items: { type: string }
        box:
          type: array
          nullable: true
          description: Latest bounding box [x, y, width, height], normalized 0..1. Not time-indexed.
          minItems: 4
          maxItems: 4
          items: { type: number, format: double }
        path:
          type: array
          description: Observed positions, oldest first.
          items: { $ref: "#/components/schemas/TrackPoint" }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time, nullable: true }
    TrackPoint:
      type: object
      required: [x, y, t]
      properties:
        x: { type: number, format: double, description: Normalized 0..1, bottom-center of the box. }
        y: { type: number, format: double, description: Normalized 0..1, bottom-center of the box. }
        t: { type: number, format: double, description: Unix seconds. }
    EventAttributes:
      type: object
      properties:
        vehicle: { $ref: "#/components/schemas/VehicleAttributes" }
        person: { $ref: "#/components/schemas/PersonAttributes" }
        vehicle_job:
          type: string
          enum: [pending, processing, completed, failed]
          description: Set while a vehicle classification job exists for this event.
        person_job:
          type: string
          enum: [pending, processing, completed, failed]
          description: Set while a clothing classification job exists for this event.
    PersonAttributes:
      type: object
      required: [upper_color, upper_confidence, lower_color, lower_confidence, color_quality]
      properties:
        upper_color: { type: string, example: blue, description: Shirt or jacket color. }
        upper_confidence: { type: number, format: float, minimum: 0, maximum: 1 }
        lower_color: { type: string, example: black, description: Pants or skirt color. }
        lower_confidence: { type: number, format: float, minimum: 0, maximum: 1 }
        color_quality: { type: string, enum: [good, medium, low] }
    VehicleAttributes:
      type: object
      required: [type, type_confidence, color, color_confidence, color_quality]
      properties:
        type: { type: string, example: suv }
        type_confidence: { type: number, format: float, minimum: 0, maximum: 1 }
        color: { type: string, example: black }
        color_confidence: { type: number, format: float, minimum: 0, maximum: 1 }
        color_quality: { type: string, enum: [good, medium, low] }
        trailer_color:
          type: string
          description: Color of the trailer when the type is a truck with a trailer. Empty otherwise.
        trailer_color_confidence: { type: number, format: float, minimum: 0, maximum: 1 }
    EventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        next_cursor:
          type: string
          description: Pass as cursor to get the next page. Absent on the last page.
    FaceSyncSummary:
      type: object
      required: [total, synced, pending, failed, conflict, disabled]
      properties:
        total: { type: integer }
        synced: { type: integer }
        pending: { type: integer, description: "Waiting or being processed." }
        failed: { type: integer }
        conflict: { type: integer, description: "A face with the same name and its own images already exists in that Frigate." }
        disabled: { type: integer, description: "Face recognition is not enabled on that server." }
    FacePerson:
      type: object
      required: [id, tenant_id, display_name, frigate_name, notes, image_count, sync, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        display_name: { type: string }
        frigate_name: { type: string, description: "Identifier of the face inside Frigate; it is the sub_label Frigate reports when it recognizes the person." }
        notes: { type: string }
        image_count: { type: integer }
        sync: { $ref: "#/components/schemas/FaceSyncSummary" }
        last_recognition:
          $ref: "#/components/schemas/FaceLastRecognition"
        first_image_id: { type: string, format: uuid, description: "Oldest enrollment image; present only in the person list, to render a card thumbnail without one request per person." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FaceTombstone:
      type: object
      required: [id, display_name, deleted_at, pending_server_count]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        deleted_at: { type: string, format: date-time }
        pending_server_count: { type: integer, minimum: 1 }
    FaceLastRecognition:
      type: object
      description: |
        The person's newest sighting on a camera the caller holds events.view on. Present only in
        the person list, and absent when the person was never recognized there. Use the event
        thumbnail endpoint (events.view) for the picture.
      required: [event_id, start_time, has_thumbnail]
      properties:
        event_id: { type: string, format: uuid }
        start_time: { type: string, format: date-time }
        has_thumbnail: { type: boolean }
    FacePersonCreate:
      type: object
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        notes: { type: string, maxLength: 2000 }
    FacePersonUpdate:
      type: object
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        notes: { type: string, maxLength: 2000 }
    FaceWatchlist:
      type: object
      required: [id, tenant_id, name, description, person_ids, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        person_ids: { type: array, items: { type: string, format: uuid } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FaceWatchlistCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        person_ids: { type: array, maxItems: 500, items: { type: string, format: uuid } }
    FaceWatchlistUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        person_ids: { type: array, maxItems: 500, items: { type: string, format: uuid } }
    FaceImage:
      type: object
      required: [id, person_id, content_type, size_bytes, width, height, created_at]
      properties:
        id: { type: string, format: uuid }
        person_id: { type: string, format: uuid }
        content_type: { type: string }
        size_bytes: { type: integer }
        width: { type: integer }
        height: { type: integer }
        created_at: { type: string, format: date-time }
    FaceSyncStatus:
      type: object
      required: [server_id, server_name, status, owned, desired_revision, synced_revision, updated_at]
      properties:
        server_id: { type: string, format: uuid }
        server_name: { type: string }
        status: { type: string, enum: [pending, processing, synced, failed, conflict, disabled] }
        owned: { type: boolean }
        desired_revision: { type: integer, format: int64 }
        synced_revision: { type: integer, format: int64 }
        last_error: { type: string }
        last_synced_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FaceRecognition:
      type: object
      required: [event_id, person_id, person_name, camera_id, camera_name, site_id, site_name, server_name, start_time, has_thumbnail, has_snapshot]
      properties:
        event_id: { type: string, format: uuid }
        person_id: { type: string, format: uuid }
        person_name: { type: string }
        camera_id: { type: string, format: uuid }
        camera_name: { type: string }
        site_id: { type: string, format: uuid }
        site_name: { type: string }
        server_name: { type: string }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        has_thumbnail: { type: boolean }
        has_snapshot: { type: boolean }
    FaceRecognitionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FaceRecognition" }
        next_cursor:
          type: string
          description: Pass as cursor to get the next page. Absent on the last page.
    FaceTrainAttempt:
      type: object
      required: [server_id, server_name, file]
      properties:
        server_id: { type: string, format: uuid }
        server_name: { type: string }
        file: { type: string, description: "Handle of the attempt in that server's train folder." }
        seen_at: { type: string, format: date-time, description: "Parsed from the file name when it follows Frigate's naming; absent otherwise." }
        label: { type: string, description: "Name Frigate guessed, or unknown; parsed from the file name when possible." }
        score: { type: number, format: double }
    FaceTrainServer:
      type: object
      required: [server_id, server_name]
      properties:
        server_id: { type: string, format: uuid }
        server_name: { type: string }
        error: { type: string, description: "Short reason when the server could not be read." }
    FaceCameraConfig:
      type: object
      required: [camera_id, name, enabled]
      properties:
        camera_id: { type: string, format: uuid }
        name: { type: string }
        enabled: { type: boolean, description: Effective value (the camera override, else the global switch). }
        enabled_override: { type: boolean, nullable: true, description: The camera's own face_recognition.enabled; null when unset. }
        min_area: { type: integer, nullable: true, description: The camera's own face_recognition.min_area; null when unset. }
    FaceServerConfig:
      type: object
      required: [server_id, server_name, site_name, frigate_version, can_edit, cameras]
      properties:
        server_id: { type: string, format: uuid }
        server_name: { type: string }
        site_name: { type: string }
        frigate_version: { type: string }
        can_edit: { type: boolean, description: True when the caller holds faces.manage and servers.config on this server. }
        error: { type: string, description: Short reason when the server could not be read; the settings are then absent. }
        enabled: { type: boolean }
        model_size: { type: string, enum: [small, large] }
        detection_threshold: { type: number, format: double }
        recognition_threshold: { type: number, format: double }
        unknown_score: { type: number, format: double }
        min_faces: { type: integer }
        min_area: { type: integer }
        save_attempts: { type: integer }
        blur_confidence_filter: { type: boolean }
        cameras: { type: array, items: { $ref: "#/components/schemas/FaceCameraConfig" } }
    FaceConfigList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FaceServerConfig" } }
    FaceCameraConfigPatch:
      type: object
      required: [camera_id]
      description: Only the fields present change. min_area null is not supported; send a number.
      properties:
        camera_id: { type: string, format: uuid }
        enabled: { type: boolean }
        min_area: { type: integer, minimum: 0, maximum: 1000000 }
    FaceConfigPatch:
      type: object
      description: Only the fields present change; an empty patch is rejected.
      properties:
        enabled: { type: boolean }
        model_size: { type: string, enum: [small, large] }
        detection_threshold: { type: number, format: double, minimum: 0, maximum: 1 }
        recognition_threshold: { type: number, format: double, minimum: 0, maximum: 1 }
        unknown_score: { type: number, format: double, minimum: 0, maximum: 1 }
        min_faces: { type: integer, minimum: 1, maximum: 6 }
        min_area: { type: integer, minimum: 0, maximum: 1000000 }
        save_attempts: { type: integer, minimum: 0, maximum: 10000 }
        blur_confidence_filter: { type: boolean }
        cameras: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/FaceCameraConfigPatch" } }
    FaceConfigPatchResult:
      type: object
      required: [revision_ids, restart_required]
      properties:
        revision_ids: { type: array, items: { type: string, format: uuid } }
        restart_required: { type: boolean }
    FaceTrainList:
      type: object
      required: [items, servers]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FaceTrainAttempt" }
        servers:
          type: array
          description: One entry per face-enabled server of the tenant; empty when none has face recognition enabled.
          items: { $ref: "#/components/schemas/FaceTrainServer" }
    FaceTrainAssign:
      type: object
      required: [server_id, file]
      description: Exactly one of person_id and new_person_display_name.
      properties:
        server_id: { type: string, format: uuid }
        file: { type: string, maxLength: 255 }
        person_id: { type: string, format: uuid }
        new_person_display_name: { type: string, maxLength: 120 }
    FaceTrainAssignResult:
      type: object
      required: [person, image, attempt_removed]
      properties:
        person: { $ref: "#/components/schemas/FacePerson" }
        image: { $ref: "#/components/schemas/FaceImage" }
        attempt_removed: { type: boolean, description: "Whether the attempt was also deleted from Frigate." }
    FaceReviewSighting:
      type: object
      required: [id, identity_id, server_id, server_name, site_id, first_seen_at, crop_available]
      properties:
        id: { type: string, format: uuid, description: Stable opaque identity for this sighting. }
        identity_id: { type: string, format: uuid, description: Group ID when grouped, otherwise this sighting ID. }
        group_id: { type: string, format: uuid, nullable: true, description: Confirmed manager-created identity group, if any. }
        server_id: { type: string, format: uuid }
        server_name: { type: string }
        site_id: { type: string, format: uuid }
        first_seen_at: { type: string, format: date-time }
        seen_at: { type: string, format: date-time, description: Best-effort time parsed from Frigate's source file name. }
        label: { type: string, description: Best-effort label parsed from Frigate's source file name. }
        score: { type: number, format: double }
        crop_available: { type: boolean }
        ingest_error: { type: string, description: Sanitized retry reason; never contains source URLs or image data. }
        suggestions:
          type: array
          description: Other pending identities that may be the same person. Advisory only; an operator must confirm grouping.
          items: { $ref: "#/components/schemas/FaceReviewSuggestion" }
    FaceReviewSuggestion:
      type: object
      required: [identity_id, similarity]
      properties:
        identity_id: { type: string, format: uuid, description: Identity ID (group ID or sighting ID) of the possible match. }
        similarity: { type: number, format: double, description: Cosine similarity of the best member pair, between 0 and 1. }
    FaceReviewInbox:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FaceReviewSighting" } }
    FaceSuggestionDecisionCreate:
      type: object
      required: [sighting_id, other_sighting_id, decision, similarity]
      properties:
        sighting_id: { type: string, format: uuid }
        other_sighting_id: { type: string, format: uuid }
        decision: { type: string, enum: [same, different] }
        similarity: { type: number, minimum: 0, maximum: 1 }
    FaceReviewIdentityGroupCreate:
      type: object
      required: [sighting_ids]
      properties:
        sighting_ids:
          type: array
          minItems: 2
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    FaceReviewIdentityGroup:
      type: object
      required: [group_id, member_count]
      properties:
        group_id: { type: string, format: uuid, description: Stable identity ID retained by the group. }
        member_count: { type: integer, minimum: 2 }
    FaceReviewSightingAssign:
      type: object
      description: Exactly one of person_id and new_person_display_name.
      properties:
        person_id: { type: string, format: uuid }
        new_person_display_name: { type: string, maxLength: 120 }
    FaceReviewSightingAssignResult:
      type: object
      required: [person, image, attempt_removed]
      properties:
        person: { $ref: "#/components/schemas/FacePerson" }
        image: { $ref: "#/components/schemas/FaceImage" }
        attempt_removed: { type: boolean, description: Whether Frigate's source attempt was also removed. }
    VisionAISource:
      type: string
      enum: [general, personas, vehiculos, lpr, perimetro, alarmas]
      default: general
    VisionAILayout:
      type: string
      enum: ["1", "4", "9", "16", focus]
      default: "4"
    VisionAISlots:
      type: object
      required: [source, layout, generated_at, plates_visible, slots]
      properties:
        source: { $ref: "#/components/schemas/VisionAISource" }
        layout: { $ref: "#/components/schemas/VisionAILayout" }
        generated_at: { type: string, format: date-time }
        plates_visible: { type: boolean, description: "True when the caller holds lpr.view on at least one of the cameras it can see for events; false means plate text is never exposed to this caller." }
        slots:
          type: array
          description: One entry per layout slot, in slot order (focus has 5, the hero first).
          items: { $ref: "#/components/schemas/VisionAISlot" }
    VisionAISlot:
      type: object
      required: [slot, camera_id, pinned]
      properties:
        slot: { type: integer, minimum: 0 }
        camera_id: { type: string, format: uuid, nullable: true, description: "Null for an empty slot; every field below is then absent." }
        pinned: { type: boolean }
        camera_name: { type: string }
        event_id: { type: string, description: "Event that put the camera in the slot." }
        object: { type: string, description: "Detected label of that event (person, car, ...)." }
        confidence: { type: number, format: double, minimum: 0, maximum: 1, description: "LPR read score when available, otherwise a neutral default (0.75)." }
        zone: { type: string }
        plate: { type: string, description: "Only on cameras where the caller holds lpr.view." }
        alarm: { type: string, description: "Alarm severity (critical, high, ...) when the event is an alarm." }
        score: { type: number, format: double }
        assigned_at: { type: string, format: date-time }
        display_seconds: { type: integer, minimum: 0, description: "Seconds the camera has been in the slot." }
        detected_at: { type: string, format: date-time, description: "Start of the latest detection that holds the camera in the slot." }
        active: { type: boolean, description: "True while any detection on the camera is still running." }
        last_seen_at: { type: string, format: date-time, description: "Latest detection activity on the camera (the request time while active); drives the inactivity release." }
        breakdown:
          type: object
          description: Score contributions by term (object, confidence, zone, alarm, recency, ...).
          additionalProperties: { type: number, format: double }
    EventSyncStatus:
      type: object
      required: [server_id, last_error, event_count]
      properties:
        server_id: { type: string, format: uuid }
        review_cursor: { type: string, format: date-time, nullable: true }
        object_cursor: { type: string, format: date-time, nullable: true }
        last_success_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string }
        event_count: { type: integer, format: int64 }
    PlateRead:
      type: object
      required: [id, site_id, site_name, server_id, server_name, camera_id, camera_name, plate, plate_normalized, label, zones, seen_at]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        site_name: { type: string }
        server_id: { type: string, format: uuid }
        server_name: { type: string }
        camera_id: { type: string, format: uuid }
        camera_name: { type: string }
        plate: { type: string, description: As read by Frigate. }
        plate_normalized: { type: string, example: AB123CD }
        score: { type: number, nullable: true }
        label: { type: string, example: car }
        zones: { type: array, items: { type: string } }
        seen_at: { type: string, format: date-time }
        event_id:
          type: string
          format: uuid
          nullable: true
          description: Indexed event that contains this read, when known.
        vehicle:
          $ref: "#/components/schemas/VehicleAttributes"
          description: Type and color of the vehicle that carried this plate, once enrichment has finished.
        has_crop:
          type: boolean
          description: "True when the license plate crop is permanently archived in OpenVMS object storage."
    PlateReadPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PlateRead" }
        next_cursor: { type: string }
    ClipWatermarkJobStatus:
      type: string
      enum: [queued, running, done, failed]
    ClipWatermarkJob:
      type: object
      required: [id, lpr_read_id, status, error, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        lpr_read_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ClipWatermarkJobStatus" }
        error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, format: password, minLength: 1, maxLength: 256 }
        totp_code: { type: string, maxLength: 7 }
    PasswordRecoveryRequest:
      type: object
      required: [username]
      properties:
        username: { type: string, minLength: 1, maxLength: 200 }
    PasswordRecoveryAccepted:
      type: object
      required: [message]
      properties:
        message: { type: string }
    PasswordRecoveryConfirm:
      type: object
      required: [username, code, new_password]
      properties:
        username: { type: string, minLength: 1, maxLength: 200 }
        code: { type: string, pattern: "^[0-9]{6}$" }
        new_password: { type: string, minLength: 1, maxLength: 1024 }
    LoginResponse:
      type: object
      required: [mfa_required]
      properties:
        mfa_required:
          type: boolean
          description: True when the password was right and a TOTP code must be sent too.
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/Me" }
    UserStatus:
      type: string
      enum: [active, disabled, locked, pending]
    User:
      type: object
      required: [id, tenant_id, username, display_name, status, mfa_enabled, has_password, must_change_password, group_ids, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid, nullable: true, description: Null for platform users. }
        username: { type: string }
        display_name: { type: string }
        email: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/UserStatus" }
        mfa_enabled: { type: boolean }
        has_password: { type: boolean, description: False for users that only use API tokens. }
        must_change_password: { type: boolean }
        locked_until: { type: string, format: date-time, nullable: true }
        last_login_at: { type: string, format: date-time, nullable: true }
        group_ids: { type: array, items: { type: string, format: uuid } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserCreate:
      type: object
      required: [username]
      properties:
        tenant_id:
          type: string
          format: uuid
          description: Defaults to the caller's tenant. Omit (platform administrators) for a platform user.
        username: { type: string, minLength: 3, maxLength: 64, pattern: "^[A-Za-z0-9._@-]+$" }
        display_name: { type: string, maxLength: 200 }
        email: { type: string, maxLength: 200 }
        password: { type: string, format: password, minLength: 8, description: Omit for a user that only uses API tokens. }
        must_change_password: { type: boolean, default: false }
        group_ids: { type: array, items: { type: string, format: uuid } }
    UserUpdate:
      type: object
      properties:
        display_name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, maxLength: 200 }
        status: { type: string, enum: [active, disabled, locked] }
        password: { type: string, format: password, minLength: 8, description: Resets the password and closes the user's sessions. }
        must_change_password: { type: boolean }
        group_ids: { type: array, items: { type: string, format: uuid } }
        disable_mfa: { type: boolean, description: Removes the second factor (lost phone). }
    UserGroupInput:
      type: object
      required: [name]
      properties:
        tenant_id: { type: string, format: uuid, description: Defaults to the caller's tenant. }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        member_ids: { type: array, items: { type: string, format: uuid }, maxItems: 5000 }
    UserGroup:
      type: object
      required: [id, tenant_id, name, description, member_ids, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        description: { type: string }
        member_ids: { type: array, items: { type: string, format: uuid } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      required: [id, occurred_at, actor_name, action, target_type, request_id, details]
      properties:
        id: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }
        tenant_id: { type: string, format: uuid, nullable: true }
        actor_id: { type: string, format: uuid, nullable: true }
        actor_name: { type: string }
        action: { type: string, example: LOGIN_SUCCESS }
        target_type: { type: string }
        target_id: { type: string, format: uuid, nullable: true }
        request_id: { type: string }
        ip: { type: string, nullable: true }
        details: { type: object, additionalProperties: true }
    ViewCell:
      type: object
      description: A tile. It shows a camera (camera_id), a virtual source (vision), or nothing when both are absent.
      properties:
        camera_id: { type: string, format: uuid }
        quality: { type: string, enum: [sub, main], default: sub }
        vision: { $ref: "#/components/schemas/ViewVisionRef" }
    ViewVisionRef:
      type: object
      description: A virtual Live tile such as a Vision AI source or an LPR/face detection channel.
      required: [id, name]
      properties:
        id: { type: string, pattern: "^visionai:[a-z0-9-]{1,40}$", example: "visionai:lpr-channel" }
        name: { type: string, maxLength: 100 }
    ViewLayout:
      type: object
      required: [columns, cells]
      properties:
        columns: { type: integer, minimum: 1, maximum: 8 }
        cells:
          type: array
          maxItems: 64
          description: Tiles in reading order.
          items: { $ref: "#/components/schemas/ViewCell" }
    ViewInput:
      type: object
      required: [name, layout]
      properties:
        tenant_id: { type: string, format: uuid, description: Required for platform users. }
        name: { type: string, minLength: 1, maxLength: 200 }
        shared: { type: boolean, default: false }
        layout: { $ref: "#/components/schemas/ViewLayout" }
    View:
      type: object
      required: [id, tenant_id, owner_id, name, shared, layout, editable, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        owner_name: { type: string, nullable: true, description: The owner's display name. }
        name: { type: string }
        shared: { type: boolean }
        layout: { $ref: "#/components/schemas/ViewLayout" }
        editable: { type: boolean, description: The caller may change or delete it. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RecordingSpan:
      type: object
      required: [start_time, end_time, motion, objects]
      properties:
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        motion: { type: integer }
        objects: { type: integer }
    ExportInput:
      type: object
      required: [camera_id, start_time, end_time]
      properties:
        camera_id: { type: string, format: uuid }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time, description: At most 2 hours after start_time. }
        name: { type: string, maxLength: 200 }
    ExportStatus:
      type: string
      enum: [pending, running, ready, failed]
    Export:
      type: object
      required: [id, tenant_id, site_id, server_id, camera_id, camera_name, requested_by, requested_by_name, name, start_time, end_time, status, progress, error, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        server_id: { type: string, format: uuid }
        camera_id: { type: string, format: uuid }
        camera_name: { type: string }
        requested_by: { type: string, format: uuid }
        requested_by_name: { type: string }
        name: { type: string }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/ExportStatus" }
        progress: { type: number, description: 0 to 100. }
        error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ExportJobStatus:
      type: string
      enum: [queued, preparing, transferring, processing, ready, failed, cancelled, expired]
    ExportJobItemStatus:
      type: string
      enum: [queued, preparing, transferring, processing, ready, failed, cancelled]
    ExportJobItem:
      type: object
      required: [id, job_id, tenant_id, camera_id, camera_name, server_id, server_name, status, progress, error, total_bytes, transferred_bytes, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        camera_id: { type: string, format: uuid }
        camera_name: { type: string }
        server_id: { type: string, format: uuid }
        server_name: { type: string }
        remote_export_id: { type: string }
        status: { $ref: "#/components/schemas/ExportJobItemStatus" }
        progress: { type: number, description: 0 to 100. }
        error: { type: string }
        total_bytes: { type: integer, format: int64 }
        transferred_bytes: { type: integer, format: int64 }
        remote_path: { type: string }
        local_path: { type: string }
        sha256_hash: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ExportJob:
      type: object
      required: [id, tenant_id, requested_by, requested_by_name, name, start_time, end_time, status, progress, error, total_bytes, transferred_bytes, speed_bps, eta_seconds, camera_count, protected, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        requested_by: { type: string, format: uuid }
        requested_by_name: { type: string }
        name: { type: string }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/ExportJobStatus" }
        progress: { type: number, description: 0 to 100. }
        error: { type: string }
        total_bytes: { type: integer, format: int64 }
        transferred_bytes: { type: integer, format: int64 }
        speed_bps: { type: number }
        eta_seconds: { type: integer }
        camera_count: { type: integer }
        local_path: { type: string }
        manifest: { type: object, additionalProperties: true }
        protected: { type: boolean }
        expires_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/ExportJobItem" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateExportJobInput:
      type: object
      required: [camera_ids, start_time, end_time]
      properties:
        camera_ids:
          type: array
          items: { type: string, format: uuid }
          minItems: 1
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        name: { type: string, maxLength: 200 }
        protected: { type: boolean }
    AlarmStatus:
      type: string
      enum: [open, acknowledged, assigned, investigating, resolved, closed]
    Alarm:
      type: object
      required: [id, tenant_id, site_id, site_name, camera_id, camera_name, event_id, event_severity, event_start_time, event_labels, event_sub_labels, source, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        site_name: { type: string }
        camera_id: { type: string, format: uuid }
        camera_name: { type: string }
        server_name: { type: string }
        vehicle:
          $ref: "#/components/schemas/VehicleAttributes"
          description: OpenVMS classification of the vehicle on this alarm, when the event was enriched.
        person:
          $ref: "#/components/schemas/PersonAttributes"
          description: Upper and lower clothing color when the event includes a person.
        event_id: { type: string, format: uuid }
        event_severity: { type: string }
        event_start_time: { type: string, format: date-time }
        event_end_time: { type: string, format: date-time, nullable: true }
        event_labels: { type: array, items: { type: string } }
        event_sub_labels: { type: array, items: { type: string } }
        source: { type: string, enum: [event, rule] }
        status: { $ref: "#/components/schemas/AlarmStatus" }
        assigned_to: { type: string, format: uuid, nullable: true }
        assigned_to_name: { type: string, nullable: true }
        acknowledged_by: { type: string, format: uuid, nullable: true }
        acknowledged_by_name: { type: string, nullable: true }
        acknowledged_at: { type: string, format: date-time, nullable: true }
        resolved_by: { type: string, format: uuid, nullable: true }
        resolved_by_name: { type: string, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        closed_by: { type: string, format: uuid, nullable: true }
        closed_by_name: { type: string, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        event_count:
          type: integer
          description: Number of correlated events folded into this alarm.
        first_event_at:
          type: string
          format: date-time
          description: Start time of the first event correlated into this alarm.
        last_event_at:
          type: string
          format: date-time
          description: Start time of the most recent event correlated into this alarm.
        late:
          type: boolean
          description: True when the alarm was opened from an event older than the auto-close window at ingestion time.
        auto_closed:
          type: boolean
          description: True when the alarm was closed automatically by the inactivity sweeper or backlog cleanup.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AlarmEvent:
      type: object
      required: [id, remote_id, severity, labels, sub_labels, zones, start_time, has_thumbnail, linked_at]
      properties:
        id: { type: string, format: uuid }
        remote_id: { type: string }
        severity: { type: string }
        labels: { type: array, items: { type: string } }
        sub_labels: { type: array, items: { type: string } }
        zones: { type: array, items: { type: string } }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time, nullable: true }
        has_thumbnail: { type: boolean }
        linked_at: { type: string, format: date-time }
    AlarmTransition:
      type: object
      required: [id, tenant_id, alarm_id, comment, at]
      properties:
        id: { type: integer, format: int64 }
        tenant_id: { type: string, format: uuid }
        alarm_id: { type: string, format: uuid }
        from_status: { type: string, nullable: true }
        to_status: { type: string, nullable: true }
        actor_id: { type: string, format: uuid, nullable: true }
        actor_name: { type: string, nullable: true }
        comment: { type: string }
        at: { type: string, format: date-time }
    AlarmAssignInput:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string, format: uuid }
    AlarmBulkInput:
      type: object
      required: [alarm_ids, action]
      properties:
        alarm_ids:
          type: array
          items: { type: string, format: uuid }
        action:
          type: string
          enum: [acknowledge, resolve]
    AlarmBulkResult:
      type: object
      required: [updated]
      properties:
        updated: { type: integer }
    AlarmAssignee:
      type: object
      required: [id, username, display_name]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
    SearchResult:
      type: object
      required: [cameras, sites, servers, events, plates]
      properties:
        cameras:
          type: array
          items: { $ref: "#/components/schemas/SearchCameraHit" }
        sites:
          type: array
          items: { $ref: "#/components/schemas/SearchSiteHit" }
        servers:
          type: array
          items: { $ref: "#/components/schemas/SearchServerHit" }
        events:
          type: array
          items: { $ref: "#/components/schemas/SearchEventHit" }
        plates:
          type: array
          items: { $ref: "#/components/schemas/SearchPlateHit" }
    SearchCameraHit:
      type: object
      required: [id, display_name, site_id, site_name, status]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        site_id: { type: string, format: uuid }
        site_name: { type: string }
        location: { type: string }
        status: { $ref: "#/components/schemas/HealthStatus" }
    SearchSiteHit:
      type: object
      required: [id, name, camera_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        camera_count: { type: integer }
    SearchServerHit:
      type: object
      required: [id, name, site_id, site_name, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        site_id: { type: string, format: uuid }
        site_name: { type: string }
        status: { $ref: "#/components/schemas/HealthStatus" }
    SearchEventHit:
      type: object
      required: [id, camera_id, camera_name, site_name, severity, labels, start_time, has_thumbnail]
      properties:
        id: { type: string, format: uuid }
        camera_id: { type: string, format: uuid }
        camera_name: { type: string }
        site_name: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        labels: { type: array, items: { type: string } }
        start_time: { type: string, format: date-time }
        has_thumbnail: { type: boolean }
    SearchPlateHit:
      type: object
      required: [plate, camera_id, camera_name, site_name, seen_at]
      properties:
        plate: { type: string }
        camera_id: { type: string, format: uuid }
        camera_name: { type: string }
        site_name: { type: string }
        seen_at: { type: string, format: date-time }
        event_id: { type: string, format: uuid, nullable: true }
    RuleTriggerType:
      type: string
      enum: [event, camera_offline, server_offline]
    RuleConditions:
      type: object
      properties:
        camera_ids:
          type: array
          items: { type: string, format: uuid }
        server_ids:
          type: array
          items: { type: string, format: uuid }
        site_ids:
          type: array
          description: Only match cameras, servers and events that belong to one of these sites. Empty means every site.
          items: { type: string, format: uuid }
        labels:
          type: array
          items: { type: string }
        zones:
          type: array
          items: { type: string }
        severities:
          type: array
          items: { type: string }
        vehicle_types:
          type: array
          description: Matched after vehicle enrichment. Empty means any type.
          items: { type: string }
        vehicle_colors:
          type: array
          description: Matched after vehicle enrichment. Empty means any color.
          items: { type: string }
        duration_seconds:
          type: integer
          minimum: 0
          description: Offline rules only. Minimum outage duration before the rule fires.
        camera_group_ids:
          type: array
          description: Event rules only. Match cameras that belong to any of these groups.
          items: { type: string, format: uuid }
        map_zone_ids:
          type: array
          description: Event rules only. Match events from cameras inside or linked to these map zones.
          items: { type: string, format: uuid }
        face_person_ids:
          type: array
          maxItems: 100
          description: Event rules only. Match events whose recognized face (sub_label) is one of these registered persons. Combined with face_watchlist_ids as "any of". Needs faces.view to set.
          items: { type: string, format: uuid }
        face_watchlist_ids:
          type: array
          maxItems: 100
          description: Event rules only. Match events whose recognized face belongs to any person of these watchlists, resolved when the event is evaluated.
          items: { type: string, format: uuid }
        schedule: { $ref: "#/components/schemas/RuleSchedule" }
        cooldown_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: Event rules only. Quiet period per rule and camera after firing; 0 or unset uses the 300 second default.
    RuleSchedule:
      type: object
      description: Event rules only. Evaluated in the camera's site timezone, falling back to timezone and then UTC. start_time later than end_time is an overnight window.
      properties:
        days_of_week:
          type: array
          description: 0 (Sunday) to 6 (Saturday). Empty means every day.
          items: { type: integer, minimum: 0, maximum: 6 }
        start_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: HH:MM, set together with end_time }
        end_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: HH:MM, set together with start_time }
        timezone: { type: string, description: IANA timezone used when the site has none }
    RuleActions:
      type: object
      properties:
        create_alarm:
          type: boolean
        notify_in_app:
          type: boolean
        severity:
          type: string
          enum: [info, warning, critical]
        channel_ids:
          type: array
          description: External notification channels to deliver to, in addition to the in-app notification and alarm.
          items: { type: string, format: uuid }
    Rule:
      type: object
      required: [id, tenant_id, name, trigger_type, conditions, actions, enabled, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer, minimum: 1, description: Optimistic-locking version; send it back as If-Match on update. }
        trigger_type: { $ref: "#/components/schemas/RuleTriggerType" }
        conditions: { $ref: "#/components/schemas/RuleConditions" }
        actions: { $ref: "#/components/schemas/RuleActions" }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RuleCreate:
      type: object
      required: [name, trigger_type]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        trigger_type: { $ref: "#/components/schemas/RuleTriggerType" }
        conditions: { $ref: "#/components/schemas/RuleConditions" }
        actions: { $ref: "#/components/schemas/RuleActions" }
        enabled: { type: boolean, default: true }
    RuleUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        trigger_type: { $ref: "#/components/schemas/RuleTriggerType" }
        conditions: { $ref: "#/components/schemas/RuleConditions" }
        actions: { $ref: "#/components/schemas/RuleActions" }
        enabled: { type: boolean }
    RulesList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Rule" }
    RuleTemplate:
      type: object
      required: [id, name, description, trigger_type, conditions, actions]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        trigger_type: { $ref: "#/components/schemas/RuleTriggerType" }
        conditions: { $ref: "#/components/schemas/RuleConditions" }
        actions: { $ref: "#/components/schemas/RuleActions" }
    RuleTemplatesList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RuleTemplate" }
    RuleSimulationRequest:
      type: object
      required: [trigger_type, conditions]
      properties:
        trigger_type: { $ref: "#/components/schemas/RuleTriggerType" }
        conditions: { $ref: "#/components/schemas/RuleConditions" }
        hours: { type: integer, minimum: 1, maximum: 168, default: 24 }
        limit: { type: integer, minimum: 1, maximum: 100, default: 100 }
    RuleSimulationMatch:
      type: object
      required: [event_id, camera_id, camera_name, site_name, severity, labels, start_time]
      properties:
        event_id: { type: string, format: uuid }
        camera_id: { type: string, format: uuid }
        camera_name: { type: string }
        site_name: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        labels: { type: array, items: { type: string } }
        start_time: { type: string, format: date-time }
    RuleSimulation:
      type: object
      required: [evaluated, condition_matched, matched, cooldown_suppressed, cooldown_seconds, has_more, window_start, window_end, matches]
      properties:
        evaluated: { type: integer }
        condition_matched: { type: integer, description: Events matching conditions before cooldown suppression. }
        matched: { type: integer, description: Condition matches remaining after the historical per-camera cooldown projection. }
        cooldown_suppressed: { type: integer, description: Historical condition matches suppressed by an earlier match on the same camera. }
        cooldown_seconds: { type: integer, minimum: 1, description: Effective cooldown; unset or zero conditions use the 300 second production default. }
        has_more: { type: boolean }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        matches:
          type: array
          items: { $ref: "#/components/schemas/RuleSimulationMatch" }
    RuleVersion:
      type: object
      required: [version, snapshot, created_at]
      properties:
        version: { type: integer, minimum: 1 }
        snapshot: { $ref: "#/components/schemas/Rule" }
        changed_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
    RuleVersionsList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RuleVersion" }
    NotificationSeverity:
      type: string
      enum: [info, warning, critical]
    Notification:
      type: object
      required: [id, tenant_id, title, body, severity, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, nullable: true }
        rule_id: { type: string, format: uuid, nullable: true }
        title: { type: string }
        body: { type: string }
        link: { type: string, nullable: true }
        severity: { $ref: "#/components/schemas/NotificationSeverity" }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    NotificationList:
      type: object
      required: [items, unread_count]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        unread_count: { type: integer }
    NotificationChannelType:
      type: string
      enum: [webhook, email, whatsapp, telegram]
    NotificationChannelConfig:
      type: object
      description: Non-secret settings; only the fields of the channel type are used.
      properties:
        url: { type: string, description: "webhook: http(s) URL; link-local and metadata addresses are refused" }
        host: { type: string, description: "email: SMTP host" }
        port: { type: integer, minimum: 1, maximum: 65535 }
        tls: { type: string, enum: [none, starttls, tls] }
        username: { type: string, description: "email: SMTP user" }
        from: { type: string, description: "email: sender address" }
        recipients:
          type: array
          description: "email: addresses; whatsapp: phone numbers or chat ids (stored as <number>@c.us or <id>@g.us)"
          items: { type: string }
        session: { type: string, description: "whatsapp: WAHA session name" }
        chat_ids:
          type: array
          description: "telegram: chat ids or @channel names"
          items: { type: string }
    NotificationChannelSecrets:
      type: object
      description: Write-only values. They are never returned.
      properties:
        signing_secret: { type: string, description: "webhook: HMAC-SHA256 key for X-OpenVMS-Signature" }
        headers:
          type: object
          description: "webhook: custom request headers"
          additionalProperties: { type: string }
        smtp_password: { type: string }
        bot_token: { type: string, description: "telegram: Bot API token" }
    NotificationChannel:
      type: object
      required: [id, tenant_id, name, type, enabled, config, secrets_set, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: "#/components/schemas/NotificationChannelType" }
        enabled: { type: boolean }
        config: { $ref: "#/components/schemas/NotificationChannelConfig" }
        secrets_set:
          type: array
          description: Names of the secrets that hold a value.
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NotificationChannelCreate:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        type: { $ref: "#/components/schemas/NotificationChannelType" }
        enabled: { type: boolean, default: true }
        config: { $ref: "#/components/schemas/NotificationChannelConfig" }
        secrets: { $ref: "#/components/schemas/NotificationChannelSecrets" }
    NotificationChannelUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        enabled: { type: boolean }
        config: { $ref: "#/components/schemas/NotificationChannelConfig" }
        secrets: { $ref: "#/components/schemas/NotificationChannelSecrets" }
        clear_secrets:
          type: array
          items: { type: string, enum: [signing_secret, headers, smtp_password, bot_token] }
    NotificationChannelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NotificationChannel" }
    NotificationChannelTestResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [destination, ok]
            properties:
              destination: { type: string, description: "Recipient, chat id or empty for webhooks" }
              ok: { type: boolean }
              error: { type: string }
    NotificationDelivery:
      type: object
      required: [id, channel_name, channel_type, destination, status, attempts, next_attempt_at, created_at]
      properties:
        id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid, nullable: true }
        channel_name: { type: string }
        channel_type: { $ref: "#/components/schemas/NotificationChannelType" }
        rule_id: { type: string, format: uuid, nullable: true }
        notification_id: { type: string, format: uuid, nullable: true }
        destination: { type: string }
        status: { type: string, enum: [pending, sent, failed] }
        attempts: { type: integer }
        last_error: { type: string, nullable: true }
        next_attempt_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time, nullable: true }
    NotificationDeliveryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NotificationDelivery" }
    WhatsAppSession:
      type: object
      required: [name, status]
      properties:
        name: { type: string }
        status:
          type: string
          description: WAHA session status (STOPPED, STARTING, SCAN_QR_CODE, WORKING, FAILED) or NOT_FOUND.
        phone: { type: string, description: Paired phone number when the session is working }
    WhatsAppQR:
      type: object
      required: [mimetype, data]
      properties:
        mimetype: { type: string }
        data: { type: string, description: Base64 image }
    MapProviderConfig:
      type: object
      required: [id, kind, attribution, max_zoom, offline]
      properties:
        id: { type: string, example: "protomaps-local" }
        kind: { type: string, enum: [vector-style, pmtiles, raster] }
        style_url_light: { type: string, nullable: true }
        style_url_dark: { type: string, nullable: true }
        tiles:
          type: array
          items: { type: string }
          nullable: true
        attribution: { type: string, example: "© OpenStreetMap contributors" }
        max_zoom: { type: integer, example: 18 }
        offline: { type: boolean }
    MapDefaultCenter:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }
    MapConfig:
      type: object
      required: [provider, default_center, default_zoom]
      properties:
        provider: { $ref: "#/components/schemas/MapProviderConfig" }
        default_center: { $ref: "#/components/schemas/MapDefaultCenter" }
        default_zoom: { type: integer, example: 2 }
    MapSiteOverview:
      type: object
      required: [id, name, camera_count, online_cameras, offline_cameras, degraded_cameras, alarm_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        default_zoom: { type: number, format: float, nullable: true }
        region_id: { type: string, format: uuid, nullable: true }
        region_name: { type: string, nullable: true }
        camera_count: { type: integer }
        online_cameras: { type: integer }
        offline_cameras: { type: integer }
        degraded_cameras: { type: integer }
        alarm_count: { type: integer }
    MapSiteOverviewList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MapSiteOverview" }
    MapBuildingInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    MapFloorInput:
      type: object
      required: [name, ordinal]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        ordinal: { type: integer, minimum: -10000, maximum: 10000 }
    MapFloor:
      type: object
      required: [id, building_id, name, ordinal]
      properties:
        revision: { type: integer, format: int64 }
        id: { type: string, format: uuid }
        building_id: { type: string, format: uuid }
        name: { type: string }
        ordinal: { type: integer }
        plan_key: { type: string, nullable: true }
        plan_content_type: { type: string, nullable: true }
        plan_width_px: { type: integer, nullable: true }
        plan_height_px: { type: integer, nullable: true }
        georef: { type: object, nullable: true }
    MapBuilding:
      type: object
      required: [id, site_id, name, floors]
      properties:
        revision: { type: integer, format: int64 }
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        name: { type: string }
        footprint: { type: object, nullable: true }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        floors:
          type: array
          items: { $ref: "#/components/schemas/MapFloor" }
    MapZone:
      type: object
      required: [id, site_id, name, kind, geometry]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        floor_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        kind: { type: string, enum: [security, perimeter, warning, custom] }
        geometry: { type: object }
        min_lat: { type: number, format: double, nullable: true }
        min_lng: { type: number, format: double, nullable: true }
        max_lat: { type: number, format: double, nullable: true }
        max_lng: { type: number, format: double, nullable: true }
        style: { type: object, nullable: true }
        metadata: { type: object, nullable: true }
    MapSiteDetails:
      type: object
      required: [id, name, buildings, zones]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        default_zoom: { type: number, format: float, nullable: true }
        region_id: { type: string, format: uuid, nullable: true }
        buildings:
          type: array
          items: { $ref: "#/components/schemas/MapBuilding" }
        zones:
          type: array
          items: { $ref: "#/components/schemas/MapZone" }
    MapPosition:
      type: object
      required: [k]
      properties:
        k: { type: string, enum: [geo, floor] }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        floor_id: { type: string, format: uuid, nullable: true }
        x: { type: number, format: float, nullable: true }
        y: { type: number, format: float, nullable: true }
    MapCameraProps:
      type: object
      required: [bearing, fov, range, type, ptz, lpr]
      properties:
        bearing: { type: number, format: float }
        fov: { type: number, format: float }
        range: { type: number, format: float }
        type: { type: string }
        ptz: { type: boolean }
        lpr: { type: boolean }
    MapEntity:
      type: object
      required: [id, t, site, name, pos, st, alarms, rev]
      properties:
        id: { type: string, format: uuid }
        t: { type: string, enum: [camera, server, device] }
        site: { type: string, format: uuid }
        srv: { type: string, format: uuid, nullable: true }
        name: { type: string }
        pos: { $ref: "#/components/schemas/MapPosition" }
        cam: { $ref: "#/components/schemas/MapCameraProps", nullable: true }
        st: { type: string, enum: [online, offline, degraded, unknown] }
        alarms: { type: integer }
        rev:
          type: integer
          format: int64
          description: Placement revision; the editor sends it back as If-Match on save.
    MapEntitiesResponse:
      type: object
      required: [revision, entities]
      properties:
        revision: { type: integer, format: int64 }
        entities:
          type: array
          items: { $ref: "#/components/schemas/MapEntity" }
    MapUnplacedCamera:
      type: object
      required: [id, name, site_id, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        remote_name: { type: string, nullable: true }
        site_id: { type: string, format: uuid }
        status: { type: string }
    MapUnplacedCameraList:
      type: object
      required: [site_id, cameras]
      properties:
        site_id: { type: string, format: uuid }
        cameras:
          type: array
          items: { $ref: "#/components/schemas/MapUnplacedCamera" }
    MapUpsertPlacementRequest:
      type: object
      required: [site_id]
      properties:
        site_id: { type: string, format: uuid }
        floor_id: { type: string, format: uuid, nullable: true }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        x: { type: number, format: float, nullable: true }
        y: { type: number, format: float, nullable: true }
        bearing_deg: { type: number, format: float, nullable: true }
        fov_deg: { type: number, format: float, nullable: true }
        range_m: { type: number, format: float, nullable: true }
        props: { type: object, nullable: true }
    MapPlacement:
      type: object
      required: [id, site_id, entity_type, entity_id, revision, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        entity_type: { type: string, enum: [camera, server, device] }
        entity_id: { type: string, format: uuid }
        floor_id: { type: string, format: uuid, nullable: true }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        x: { type: number, format: float, nullable: true }
        y: { type: number, format: float, nullable: true }
        bearing_deg: { type: number, format: float, nullable: true }
        fov_deg: { type: number, format: float, nullable: true }
        range_m: { type: number, format: float, nullable: true }
        props: { type: object, nullable: true }
        revision: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ImportMapPlacementsRequest:
      type: object
      required: [site_id, csv, dry_run]
      properties:
        site_id: { type: string, format: uuid }
        csv:
          type: string
          description: CSV text with a header row; camera,lat,lng required, bearing,fov,range optional.
        dry_run: { type: boolean }
    MapImportReport:
      type: object
      required: [dry_run, rows, upserted, errors]
      properties:
        dry_run: { type: boolean }
        rows:
          type: integer
          description: Data rows seen, valid or not (header excluded).
        upserted:
          type: integer
          description: Placements written; 0 for dry runs and for applies rejected by row errors.
        errors:
          type: array
          description: At most one entry per invalid row.
          items:
            type: object
            required: [line, message]
            properties:
              line:
                type: integer
                description: Physical CSV line number; the header is line 1.
              message: { type: string }
    MapLayerPreference:
      type: object
      description: Visibility of every map layer group. Absent keys fall back to the client defaults.
      properties:
        sites: { type: boolean }
        cameras: { type: boolean }
        coverage: { type: boolean }
        ptz_direction: { type: boolean }
        ai_person: { type: boolean }
        ai_vehicle: { type: boolean }
        lpr: { type: boolean }
        faces: { type: boolean }
        events_alarm: { type: boolean }
        events_motion: { type: boolean }
        events_audio: { type: boolean }
        infra_servers: { type: boolean }
        infra_network: { type: boolean }
        infra_access: { type: boolean }
        infra_sensors: { type: boolean }
        heatmap: { type: boolean }
        traffic: { type: boolean }
    MapFilters:
      type: object
      description: Combinable filters applied to the entities drawn on the map.
      properties:
        site_ids:
          type: array
          items: { type: string, format: uuid }
        camera_ids:
          type: array
          items: { type: string, format: uuid }
        server_ids:
          type: array
          items: { type: string, format: uuid }
        tags:
          type: array
          items: { type: string }
        objects:
          type: array
          items: { type: string }
        priority:
          type: array
          items: { type: string, enum: [alert, detection] }
        camera_types:
          type: array
          description: Restricts the drawn cameras to these hardware types.
          items: { type: string, enum: [fixed, dome, ptz, fisheye, lpr] }
        event_types:
          type: array
          items: { type: string }
        status:
          type: array
          items: { type: string, enum: [ONLINE, DEGRADED, OFFLINE, NO_SIGNAL, RECORDING_ERROR, UNREACHABLE, ALARM] }
        time_range:
          type: object
          nullable: true
          required: [start, end]
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
    MapUserPrefs:
      type: object
      description: Per-user map preferences. Every key is optional and the stored blob replaces the previous one on save.
      properties:
        layers: { $ref: "#/components/schemas/MapLayerPreference" }
        filters: { $ref: "#/components/schemas/MapFilters" }
        focus_mode:
          type: string
          enum: [none, current-site]
          description: Incident auto-focus policy. Defaults to none, which never moves the map.
        hover_live: { type: boolean }
    UpdateSiteGeoRequest:
      type: object
      properties:
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        default_zoom: { type: number, format: float, nullable: true }
        region_id: { type: string, format: uuid, nullable: true }
    SiteGeo:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        default_zoom: { type: number, format: float, nullable: true }
        region_id: { type: string, format: uuid, nullable: true }
        updated_at: { type: string, format: date-time }
    MapZoneList:
      type: object
      required: [site_id, zones]
      properties:
        site_id: { type: string, format: uuid }
        zones:
          type: array
          items: { $ref: "#/components/schemas/MapZone" }
    CreateMapZoneRequest:
      type: object
      required: [name, kind, geometry]
      properties:
        floor_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        kind: { type: string, enum: [security, perimeter, warning, custom] }
        geometry: { type: object }
        style: { type: object, nullable: true }
        metadata: { type: object, nullable: true }
    UpdateMapZoneRequest:
      type: object
      properties:
        floor_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        kind: { type: string, enum: [security, perimeter, warning, custom] }
        geometry: { type: object }
        style: { type: object, nullable: true }
        metadata: { type: object, nullable: true }
    MapAnalyticsPoint:
      type: object
      required: [lat, lng, weight, count]
      properties:
        camera_id: { type: string, format: uuid, nullable: true }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        weight: { type: number, format: double }
        count: { type: integer, format: int64 }
    MapAnalyticsResponse:
      type: object
      required: [points, total, max_count]
      properties:
        points:
          type: array
          items: { $ref: "#/components/schemas/MapAnalyticsPoint" }
        total: { type: integer, format: int64 }
        max_count: { type: integer, format: int64 }


