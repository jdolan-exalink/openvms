        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [notification-channels]
      operationId: deleteNotificationChannel
      summary: Delete a notification channel
      description: Removes the channel from every rule that used it. Delivery history is kept.
      responses:
        "204":
          description: Channel deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/notification-channels/{channelId}/test:
    parameters:
      - name: channelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [notification-channels]
      operationId: testNotificationChannel
      summary: Send a test message through a channel
      description: Sends synchronously to every destination and reports the outcome of each one. Works on disabled channels.
      responses:
        "200":
          description: Per-destination outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannelTestResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/notification-channels/{channelId}/whatsapp/session:
    parameters:
      - name: channelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [notification-channels]
      operationId: getWhatsAppSession
      summary: WhatsApp pairing status of a channel's WAHA session
      description: Proxies WAHA. Only for whatsapp channels. Requires notifications.manage.
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppSession"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/WahaUnavailable" }
  /api/v1/notification-channels/{channelId}/whatsapp/session/start:
    parameters:
      - name: channelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [notification-channels]
      operationId: startWhatsAppSession
      summary: Start (or create) the channel's WAHA session
      responses:
        "200":
          description: Session status after the start request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppSession"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/WahaUnavailable" }
  /api/v1/notification-channels/{channelId}/whatsapp/qr:
    parameters:
      - name: channelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [notification-channels]
      operationId: getWhatsAppQR
      summary: Pairing QR of the channel's WAHA session
      description: Available only while the session status is SCAN_QR_CODE; otherwise 409.
      responses:
        "200":
          description: QR image, base64 encoded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppQR"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/WahaUnavailable" }
  /api/v1/notification-deliveries:
    get:
      tags: [notification-channels]
      operationId: listNotificationDeliveries
      summary: List recent external notification deliveries
      description: Newest first. Requires notifications.manage.
      parameters:
        - name: channel_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDeliveryList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: List in-app notifications
      description: Returns recent notifications for the authenticated user and tenant.
      parameters:
        - name: unread_only
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Notifications list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/notifications/{id}/read:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [notifications]
      operationId: markNotificationRead
      summary: Mark a notification as read
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      summary: Mark all notifications as read for current user
      responses:
        "200":
          description: Result count
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer }
  /api/v1/maps/config:
    get:
      tags: [maps]
      operationId: getMapConfig
      summary: Map configuration
      description: Tile provider, style URLs, attribution, offline flag, and limits.
      responses:
        "200":
          description: Map configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapConfig"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/maps/overview:
    get:
      tags: [maps]
      operationId: getMapOverview
      summary: Sites map overview
      description: Geo positions and health/alarm aggregates for sites the caller can view.
      responses:
        "200":
          description: Sites overview list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapSiteOverviewList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/maps/sites/{siteId}:
    get:
      tags: [maps]
      operationId: getMapSite
      summary: Site map details
      description: Bounds, buildings, floors, and zones for the site.
      parameters:
        - name: siteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Site map details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapSiteDetails"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/maps/sites/{siteId}/entities:
    get:
      tags: [maps]
      operationId: getMapSiteEntities
      summary: Placed entities for site
      description: Compact placed entities (cameras, servers, devices) with status and alarm counts.
      parameters:
        - name: siteId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: floor_id
          in: query
          schema: { type: string, format: uuid }
        - name: is_geo
          in: query
          schema: { type: boolean }
        - name: min_lat
          in: query
          schema: { type: number, format: double }
        - name: min_lng
          in: query
          schema: { type: number, format: double }
        - name: max_lat
          in: query
          schema: { type: number, format: double }
        - name: max_lng
          in: query
          schema: { type: number, format: double }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: Compact placed entities
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapEntitiesResponse"
        "304":
          description: Entities have not changed since If-None-Match revision
          headers:
            ETag:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/maps/unplaced:
    get:
      tags: [maps]
      operationId: getMapUnplacedCameras
      summary: Unplaced cameras on site
      description: Returns cameras on the site that have no geographic placement.
      parameters:
        - name: site_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: List of unplaced cameras
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapUnplacedCameraList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/maps/placements/{entityType}/{entityId}:
    put:
      tags: [maps]
      operationId: upsertMapPlacement
      summary: Upsert entity placement
      description: Place or update position/orientation/FOV of a camera, server, or device.
      parameters:
        - name: entityType
          in: path
          required: true
          schema: { type: string, enum: [camera, server, device] }
        - name: entityId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: If-Match
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapUpsertPlacementRequest"
      responses:
        "200":
          description: Updated placement
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapPlacement"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/maps/placements/{placementId}:
    delete:
      tags: [maps]
      operationId: deleteMapPlacement
      summary: Delete entity placement
      description: Removes a placement by placement ID.
      parameters:
        - name: placementId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: If-Match
          in: header
          schema: { type: string }
      responses:
        "204":
          description: Placement removed
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/sites/{siteId}/geo:
    patch:
      tags: [maps]
      operationId: updateSiteGeo
      summary: Update site geographic position
      description: Sets site lat/lng, default zoom, and region.
      parameters:
        - name: siteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSiteGeoRequest"
      responses:
        "200":
          description: Updated site geographic details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteGeo"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/maps/sites/{siteId}/zones:
    get:
      tags: [maps]
      operationId: listMapSiteZones
      summary: List map zones for site
      description: Returns all active security/perimeter/warning/custom zones for a site.
      parameters:
        - name: siteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: List of zones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapZoneList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [maps]
      operationId: createMapSiteZone
      summary: Create map zone
      description: Creates a new security zone with geometry validation.
      parameters:
        - name: siteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMapZoneRequest"
      responses:
        "201":
          description: Created zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapZone"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/maps/zones/{zoneId}:
    patch:
      tags: [maps]
      operationId: updateMapZone
      summary: Update map zone
      description: Updates zone properties or geometry with validation.
      parameters:
        - name: zoneId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMapZoneRequest"
      responses:
        "200":
          description: Updated zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapZone"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [maps]
      operationId: deleteMapZone
      summary: Delete map zone
      description: Soft-deletes a map zone.
      parameters:
        - name: zoneId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Zone deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API token for scripts and integrations. Browsers use the openvms_session cookie set by login.
    cookieAuth:
      type: apiKey
      in: cookie
      name: openvms_session
      description: Browser session. State-changing requests must also send the X-OpenVMS-Request header.
  responses:
    BadRequest:
      description: The request is invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The caller lacks the permission on this resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The resource does not exist or belongs to another tenant
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The request conflicts with existing data
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    FrigateUnreachable:
      description: Frigate could not be reached or rejected the credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WahaUnavailable:
      description: The internal WhatsApp service (WAHA) could not be reached
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Me:
      type: object
      required: [id, username, display_name, tenant_id, grants, mfa_enabled, must_change_password, auth_method]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        mfa_enabled: { type: boolean }
        must_change_password: { type: boolean }
        auth_method:
          type: string
          enum: [session, token]
          description: How this request was authenticated.
        tenant_id:
          type: string
          format: uuid
          nullable: true
          description: Null for platform users.
        grants:
          type: array
          items: { $ref: "#/components/schemas/Grant" }
    SubjectType:
      type: string
      enum: [user, group]
    ScopeType:
      type: string
      enum: [platform, tenant, site, server, camera_group, camera]
    Effect:
      type: string
      enum: [allow, deny]
    PermissionDefinition:
      type: object
      required: [permission, description, narrowest_scope]
      properties:
        permission: { type: string, example: live.view }
        description: { type: string }
        narrowest_scope: { $ref: "#/components/schemas/ScopeType" }
    GrantInput:
      type: object
      required: [subject_type, subject_id, permission, effect, scope_type]
      properties:
        subject_type: { $ref: "#/components/schemas/SubjectType" }
        subject_id: { type: string, format: uuid }
        permission: { type: string, example: live.view }
        effect: { $ref: "#/components/schemas/Effect" }
        scope_type: { $ref: "#/components/schemas/ScopeType" }
        scope_id:
          type: string
          format: uuid
          description: Required unless scope_type is platform.
    Grant:
      allOf:
        - $ref: "#/components/schemas/GrantInput"
        - type: object
          required: [id, created_at]
          properties:
            id: { type: string, format: uuid }
            tenant_id: { type: string, format: uuid, nullable: true }
            created_at: { type: string, format: date-time }
    TenantInput:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$", example: municipalidad-helvecia }
        name: { type: string, minLength: 1, maxLength: 200 }
    Tenant:
      allOf:
        - $ref: "#/components/schemas/TenantInput"
        - type: object
          required: [id, created_at]
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
    TenantBranding:
      type: object
      required: [tenant_id, owner_name, timezone, has_logo, updated_at]
      properties:
        tenant_id: { type: string, format: uuid }
        owner_name: { type: string }
        timezone:
          type: string
          description: |
            IANA time zone name used to render the watermark's date/time (PDW-7). Defaults to
            America/Argentina/Buenos_Aires when the tenant has not configured one explicitly.
          example: America/Argentina/Buenos_Aires
        has_logo: { type: boolean }
        logo_content_type: { type: string }
        updated_at: { type: string, format: date-time }
    TenantBrandingInput:
      type: object
      properties:
        owner_name: { type: string, maxLength: 200 }
        timezone:
          type: string
          description: IANA time zone name (validated server-side); omit to keep the current value.
          example: America/Argentina/Buenos_Aires
        logo:
          type: string
          format: byte
          description: Base64-encoded PNG or JPEG, at most 512 KB decoded.
        logo_content_type: { type: string, enum: [image/png, image/jpeg] }
        remove_logo: { type: boolean, default: false, description: Clears the logo; cannot be combined with logo. }
    SiteCreate:
      type: object
      required: [tenant_id, name]
      properties:
        tenant_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        timezone: { type: string, example: America/Argentina/Cordoba }
        address: { type: string, maxLength: 500 }
    SiteUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        timezone: { type: string }
        address: { type: string, maxLength: 500 }
    Site:
      type: object
      required: [id, tenant_id, name, timezone, address, server_count, camera_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string }
        address: { type: string }
        server_count: { type: integer }
        camera_count:
          type: integer
          description: Cameras in this site the caller can view.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    HealthStatus:
      type: string
      enum: [unknown, online, degraded, offline]
    AuthMode:
      type: string
      enum: [credentials, none]
      description: |
        credentials logs in with a Frigate user on the authenticated port (8971).
        none is for a Frigate without login (internal port 5000 or auth disabled); use it only
        on trusted networks.
    ServerProbe:
      type: object
      required: [site_id, base_url]
      properties:
        site_id: { type: string, format: uuid }
        base_url:
          type: string
          example: https://10.20.0.11:8971
          description: Frigate URL. Port 5000 is only accepted with auth_mode none.
        auth_mode: { $ref: "#/components/schemas/AuthMode" }
        username: { type: string, description: Required with auth_mode credentials. }
        password: { type: string, format: password, description: Required with auth_mode credentials. Stored encrypted. }
        tls_skip_verify:
          type: boolean
          default: false
          description: Accept Frigate's self-signed certificate.
    ServerCreate:
      allOf:
        - $ref: "#/components/schemas/ServerProbe"
        - type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 200, example: Frigate-H01 }
            import_cameras: { type: boolean, default: true }
    ServerUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        site_id: { type: string, format: uuid }
        base_url: { type: string }
        auth_mode: { $ref: "#/components/schemas/AuthMode" }
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1, format: password }
        tls_skip_verify: { type: boolean }
    Capabilities:
      type: object
      required: [review, preview, exports, lpr, face_recognition, semantic_search, audio, ptz]
      properties:
        review: { type: boolean }
        preview: { type: boolean }
        exports: { type: boolean }
        lpr: { type: boolean }
        face_recognition: { type: boolean }
        semantic_search: { type: boolean }
        audio: { type: boolean }
        ptz: { type: boolean }
    DiscoveredCamera:
      type: object
      required: [remote_name, enabled, zones, lpr]
      properties:
        remote_name: { type: string }
        enabled: { type: boolean }
        zones: { type: array, items: { type: string } }
        lpr: { type: boolean }
    ProbeResult:
      type: object
      required: [frigate_version, adapter, capabilities, cameras]
      properties:
        frigate_version: { type: string, example: 0.17.2 }
        adapter:
          type: string
          description: Adapter chosen for this version.
          example: v017
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        cameras:
          type: array
          items: { $ref: "#/components/schemas/DiscoveredCamera" }
    ServerStorage:
      type: object
      required: [total_mb, used_mb, free_mb]
      properties:
        total_mb: { type: number }
        used_mb: { type: number }
        free_mb: { type: number }
    Server:
      type: object
      required: [id, tenant_id, site_id, name, base_url, auth_mode, username, tls_skip_verify, frigate_version, capabilities, status, last_error, camera_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        name: { type: string }
        base_url: { type: string }
        auth_mode: { $ref: "#/components/schemas/AuthMode" }
        username: { type: string }
        tls_skip_verify: { type: boolean }
        frigate_version: { type: string }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        status: { $ref: "#/components/schemas/HealthStatus" }
        last_seen_at: { type: string, format: date-time, nullable: true }
        last_checked_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string }
        uptime_seconds: { type: integer, nullable: true }
        storage: { $ref: "#/components/schemas/ServerStorage" }
        camera_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SyncResult:
      type: object
      required: [server, added, updated, missing]
      properties:
        server: { $ref: "#/components/schemas/Server" }
        added: { type: integer }
        updated: { type: integer }
        missing:
          type: integer
          description: Cameras no longer present in Frigate. They are kept and flagged, not deleted.
    Camera:
      type: object
      required: [id, tenant_id, site_id, server_id, remote_name, display_name, enabled, zones, lpr, status, group_ids, folder_id, sort_order, default_live_quality, description, location, tags, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        server_id: { type: string, format: uuid }
        remote_name:
          type: string
          description: Camera name inside its Frigate server.
        display_name: { type: string }
        enabled: { type: boolean }
        zones: { type: array, items: { type: string } }
        lpr: { type: boolean }
        status: { $ref: "#/components/schemas/HealthStatus" }
        fps: { type: number, nullable: true }
        missing_since: { type: string, format: date-time, nullable: true }
        group_ids: { type: array, items: { type: string, format: uuid } }
        folder_id:
          type: string
          format: uuid
          nullable: true
          description: Shared explorer folder of the camera's server; null at the server root.
        sort_order: { type: integer, description: Shared position inside its folder (or the server root). }
        default_live_quality:
          $ref: "#/components/schemas/CameraLiveQuality"
        description: { type: string, maxLength: 1000 }
        location: { type: string, maxLength: 200 }
        tags: { type: array, items: { type: string, maxLength: 40 }, maxItems: 20 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CameraFolder:
      type: object
      required: [id, tenant_id, server_id, name, sort_order, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        server_id: { type: string, format: uuid }
        name: { type: string }
        sort_order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CameraLiveQuality:
      type: string
      enum: [sub, main]
      description: Stream a camera gets when it is added to a Live grid tile. VMS-owned; the Frigate sync never overwrites it.
    CameraUpdate:
      type: object
      properties:
        display_name: { type: string, minLength: 1, maxLength: 200 }
        enabled: { type: boolean }
        default_live_quality:
          $ref: "#/components/schemas/CameraLiveQuality"
        description: { type: string, maxLength: 1000 }
        location: { type: string, maxLength: 200 }
        tags:
          type: array
          items: { type: string, maxLength: 40 }
          maxItems: 20
          description: Replaces the camera's tags. Values are trimmed and de-duplicated case-insensitively.
    CameraFrigateConfig:
      type: object
      required: [camera_id, camera_name, server_id, detect_enabled, tracked_objects, lpr_enabled, zones]
      properties:
        camera_id: { type: string, format: uuid }
        camera_name: { type: string }
        server_id: { type: string, format: uuid }
        detect_enabled: { type: boolean }
        tracked_objects: { type: array, items: { type: string } }
        lpr_enabled: { type: boolean }
        zones: { type: array, items: { type: string } }
    CameraFrigateConfigUpdate:
      type: object
      properties:
        detect_enabled: { type: boolean }
        tracked_objects: { type: array, items: { type: string } }
        lpr_enabled: { type: boolean }
    FrigateCameraConfigDoc:
      type: object
      required: [camera_id, camera_name, server_id, frigate_version, editable, secrets_visible, config]
      properties:
        camera_id: { type: string, format: uuid }
        camera_name: { type: string }
        server_id: { type: string, format: uuid }
        frigate_version: { type: string }
        editable: { type: boolean }
        secrets_visible: { type: boolean }
        config: { type: object, additionalProperties: true, description: The camera section of Frigate's effective config. }
    FrigateConfigPatch:
      type: object
      required: [sections]
      properties:
        sections:
          type: object
          additionalProperties: true
          description: Top-level camera section name to its new value. Objects are merged into the current section, lists are replaced.
    FrigateSectionResult:
      type: object
      required: [section, applied_live, requires_restart]
      properties:
        section: { type: string }
        applied_live: { type: boolean }
        requires_restart: { type: boolean }
    FrigatePatchResult:
      type: object
      required: [revision_id, sections, restart_required]
      properties:
        revision_id: { type: string, format: uuid }
        sections: { type: array, items: { $ref: "#/components/schemas/FrigateSectionResult" } }
        restart_required: { type: boolean }
    FrigateRawConfig:
      type: object
      required: [yaml]
      properties:
        yaml: { type: string }
    FrigateRawSaveResult:
      type: object
      required: [revision_id, restart_required]
      properties:
        revision_id: { type: string, format: uuid }
        restart_required: { type: boolean }
    FrigateConfigRevision:
      type: object
      required: [id, server_id, actor_name, kind, sections, patch, created_at]
      properties:
        id: { type: string, format: uuid }
        server_id: { type: string, format: uuid }
        camera_id: { type: string, format: uuid, nullable: true }
        actor_user_id: { type: string, format: uuid, nullable: true }
        actor_name: { type: string }
        kind: { type: string, enum: [camera_patch, raw_save, rollback] }
        sections: { type: array, items: { type: string } }
        patch: { type: object, additionalProperties: true }
        before_yaml: { type: string, description: Only with servers.config.secrets and include_yaml=true. }
        after_yaml: { type: string, description: Only with servers.config.secrets and include_yaml=true. }
        created_at: { type: string, format: date-time }
    FrigateConfigRevisionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FrigateConfigRevision" } }
    CameraGroupInput:
      type: object
      required: [tenant_id, name, camera_ids]
      properties:
        tenant_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        camera_ids: { type: array, items: { type: string, format: uuid }, maxItems: 5000 }
    CameraGroup:
      type: object
      required: [id, tenant_id, name, description, camera_ids, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        camera_ids:
          type: array
          description: Members the caller can view.
          items: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LivenessStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadinessStatus:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/DependencyCheck"
    DependencyCheck:
      type: object
      required: [name, status, latency_ms]
      properties:
        name:
          type: string
          example: postgres
        status:
          type: string
          enum: [ok, error]
        latency_ms:
          type: integer
          format: int64
        error:
          type: string
    Features:
      type: object
      required: [persistent_players, video_surface_layer, adaptive_streaming, stream_prewarming, seamless_quality_switch, maps]
      properties:
        persistent_players: { type: boolean }
        video_surface_layer: { type: boolean }
        adaptive_streaming: { type: boolean }
        stream_prewarming: { type: boolean }
        seamless_quality_switch: { type: boolean }
        maps: { type: boolean }
    SystemInfo:
      type: object
      required: [name, version, commit, build_time, go_version, schema_version]
      properties:
        name:
          type: string
          example: openvms-api
        version:
          type: string
          example: v0.1.0
        commit:
          type: string
        build_time:
          type: string
        go_version:
          type: string
        schema_version:
          type: integer
          format: int64
          description: Latest applied database migration.
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
    Severity:
      type: string
      enum: [alert, detection]
    Event:
      type: object
      required: [id, tenant_id, site_id, site_name, server_id, server_name, camera_id, camera_name, remote_id, severity, labels, sub_labels, zones, plates, start_time, reviewed, has_thumbnail, has_snapshot, has_preview]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        site_name: { type: string }
        server_id: { type: string, format: uuid }
        server_name: { type: string }
        camera_id: { type: string, format: uuid }
        camera_name: { type: string }
        remote_id:
          type: string
          description: Review id inside the origin Frigate.
        severity: { $ref: "#/components/schemas/Severity" }
        labels: { type: array, items: { type: string } }
        sub_labels:
          type: array
          description: >-
            On LPR-capable cameras, recognized plate text (empty without lpr.view). On other
            cameras, an ordinary event field (e.g. a recognized face name) visible under normal
            events.view.
          items: { type: string }
        zones: { type: array, items: { type: string } }
        plates:
          type: array
          description: Normalized plates read during the event. Empty without lpr.view.
          items: { type: string }
        start_time: { type: string, format: date-time }
        end_time:
          type: string
          format: date-time
          nullable: true
          description: Null while the event is in progress.
        reviewed: { type: boolean }
        has_thumbnail:
          type: boolean
          description: The VMS keeps its own copy of the thumbnail.
        has_snapshot:
          type: boolean
          description: Frigate reported a saved snapshot for at least one detection of this event.
        has_preview:
          type: boolean
          description: >-
            The VMS has copied this event's preview clip to central storage (an OpenVMS-internal
            signal, not a probe of Frigate's own preview availability).
    EventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        next_cursor:
          type: string
          description: Pass as cursor to get the next page. Absent on the last page.
    EventSyncStatus:
      type: object
      required: [server_id, last_error, event_count]
      properties:
        server_id: { type: string, format: uuid }
        review_cursor: { type: string, format: date-time, nullable: true }
        object_cursor: { type: string, format: date-time, nullable: true }
        last_success_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string }
        event_count: { type: integer, format: int64 }
    PlateRead:
      type: object
      required: [id, site_id, site_name, server_id, server_name, camera_id, camera_name, plate, plate_normalized, label, zones, seen_at]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        site_name: { type: string }
        server_id: { type: string, format: uuid }
        server_name: { type: string }
        camera_id: { type: string, format: uuid }
        camera_name: { type: string }
        plate: { type: string, description: As read by Frigate. }
        plate_normalized: { type: string, example: AB123CD }
        score: { type: number, nullable: true }
        label: { type: string, example: car }
        zones: { type: array, items: { type: string } }
        seen_at: { type: string, format: date-time }
        event_id:
          type: string
          format: uuid
          nullable: true
          description: Indexed event that contains this read, when known.
    PlateReadPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PlateRead" }
        next_cursor: { type: string }
    ClipWatermarkJobStatus:
      type: string
      enum: [queued, running, done, failed]
    ClipWatermarkJob:
      type: object
      required: [id, lpr_read_id, status, error, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        lpr_read_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ClipWatermarkJobStatus" }
        error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, format: password, minLength: 1, maxLength: 256 }
        totp_code: { type: string, maxLength: 7 }
    LoginResponse:
      type: object
      required: [mfa_required]
      properties:
        mfa_required:
          type: boolean
          description: True when the password was right and a TOTP code must be sent too.
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/Me" }
    UserStatus:
      type: string
      enum: [active, disabled, locked, pending]
    User:
      type: object
      required: [id, tenant_id, username, display_name, status, mfa_enabled, has_password, must_change_password, group_ids, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid, nullable: true, description: Null for platform users. }
        username: { type: string }
        display_name: { type: string }
        email: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/UserStatus" }
        mfa_enabled: { type: boolean }
        has_password: { type: boolean, description: False for users that only use API tokens. }
        must_change_password: { type: boolean }
        locked_until: { type: string, format: date-time, nullable: true }
        last_login_at: { type: string, format: date-time, nullable: true }
        group_ids: { type: array, items: { type: string, format: uuid } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserCreate:
      type: object
      required: [username]
      properties:
        tenant_id:
          type: string
          format: uuid
          description: Defaults to the caller's tenant. Omit (platform administrators) for a platform user.
        username: { type: string, minLength: 3, maxLength: 64, pattern: "^[A-Za-z0-9._@-]+$" }
        display_name: { type: string, maxLength: 200 }
        email: { type: string, maxLength: 200 }
        password: { type: string, format: password, minLength: 10, description: Omit for a user that only uses API tokens. }
        must_change_password: { type: boolean, default: false }
        group_ids: { type: array, items: { type: string, format: uuid } }
    UserUpdate:
      type: object
      properties:
        display_name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, maxLength: 200 }
        status: { type: string, enum: [active, disabled, locked] }
        password: { type: string, format: password, minLength: 10, description: Resets the password and closes the user's sessions. }
        must_change_password: { type: boolean }
        group_ids: { type: array, items: { type: string, format: uuid } }
        disable_mfa: { type: boolean, description: Removes the second factor (lost phone). }
    UserGroupInput:
      type: object
      required: [name]
      properties:
        tenant_id: { type: string, format: uuid, description: Defaults to the caller's tenant. }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        member_ids: { type: array, items: { type: string, format: uuid }, maxItems: 5000 }
    UserGroup:
      type: object
      required: [id, tenant_id, name, description, member_ids, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        description: { type: string }
        member_ids: { type: array, items: { type: string, format: uuid } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      required: [id, occurred_at, actor_name, action, target_type, request_id, details]
      properties:
        id: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }
        tenant_id: { type: string, format: uuid, nullable: true }
        actor_id: { type: string, format: uuid, nullable: true }
        actor_name: { type: string }
        action: { type: string, example: LOGIN_SUCCESS }
        target_type: { type: string }
        target_id: { type: string, format: uuid, nullable: true }
        request_id: { type: string }
        ip: { type: string, nullable: true }
        details: { type: object, additionalProperties: true }
    ViewCell:
      type: object
      description: A tile. Without camera_id it is empty.
      properties:
        camera_id: { type: string, format: uuid }
        quality: { type: string, enum: [sub, main], default: sub }
    ViewLayout:
      type: object
      required: [columns, cells]
      properties:
        columns: { type: integer, minimum: 1, maximum: 8 }
        cells:
          type: array
          maxItems: 64
          description: Tiles in reading order.
          items: { $ref: "#/components/schemas/ViewCell" }
    ViewInput:
      type: object
      required: [name, layout]
      properties:
        tenant_id: { type: string, format: uuid, description: Required for platform users. }
        name: { type: string, minLength: 1, maxLength: 200 }
        shared: { type: boolean, default: false }
        layout: { $ref: "#/components/schemas/ViewLayout" }
    View:
      type: object
      required: [id, tenant_id, owner_id, name, shared, layout, editable, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        owner_name: { type: string, nullable: true, description: The owner's display name. }
        name: { type: string }
        shared: { type: boolean }
        layout: { $ref: "#/components/schemas/ViewLayout" }
        editable: { type: boolean, description: The caller may change or delete it. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RecordingSpan:
      type: object
      required: [start_time, end_time, motion, objects]
      properties:
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        motion: { type: integer }
        objects: { type: integer }
    ExportInput:
      type: object
      required: [camera_id, start_time, end_time]
      properties:
        camera_id: { type: string, format: uuid }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time, description: At most 2 hours after start_time. }
        name: { type: string, maxLength: 200 }
    ExportStatus:
      type: string
      enum: [pending, running, ready, failed]
    Export:
      type: object
      required: [id, tenant_id, site_id, server_id, camera_id, camera_name, requested_by, requested_by_name, name, start_time, end_time, status, progress, error, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        server_id: { type: string, format: uuid }
        camera_id: { type: string, format: uuid }
        camera_name: { type: string }
        requested_by: { type: string, format: uuid }
        requested_by_name: { type: string }
        name: { type: string }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/ExportStatus" }
        progress: { type: number, description: 0 to 100. }
        error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AlarmStatus:
      type: string
      enum: [open, acknowledged, resolved]
    Alarm:
      type: object
      required: [id, tenant_id, site_id, site_name, camera_id, camera_name, event_id, event_severity, event_start_time, event_labels, event_sub_labels, source, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        site_name: { type: string }
        camera_id: { type: string, format: uuid }
        camera_name: { type: string }
        event_id: { type: string, format: uuid }
        event_severity: { type: string }
        event_start_time: { type: string, format: date-time }
        event_end_time: { type: string, format: date-time, nullable: true }
        event_labels: { type: array, items: { type: string } }
        event_sub_labels: { type: array, items: { type: string } }
        source: { type: string, enum: [event, rule] }
        status: { $ref: "#/components/schemas/AlarmStatus" }
        assigned_to: { type: string, format: uuid, nullable: true }
        assigned_to_name: { type: string, nullable: true }
        acknowledged_by: { type: string, format: uuid, nullable: true }
        acknowledged_by_name: { type: string, nullable: true }
        acknowledged_at: { type: string, format: date-time, nullable: true }
        resolved_by: { type: string, format: uuid, nullable: true }
        resolved_by_name: { type: string, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AlarmAssignInput:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string, format: uuid }
    AlarmBulkInput:
      type: object
      required: [alarm_ids, action]
      properties:
        alarm_ids:
          type: array
          items: { type: string, format: uuid }
        action:
          type: string
          enum: [acknowledge, resolve]
    AlarmBulkResult:
      type: object
      required: [updated]
      properties:
        updated: { type: integer }
    AlarmAssignee:
      type: object
      required: [id, username, display_name]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
    SearchResult:
      type: object
      required: [cameras, sites, servers, events, plates]
      properties:
        cameras:
          type: array
          items: { $ref: "#/components/schemas/SearchCameraHit" }
        sites:
          type: array
          items: { $ref: "#/components/schemas/SearchSiteHit" }
        servers:
          type: array
          items: { $ref: "#/components/schemas/SearchServerHit" }
        events:
          type: array
          items: { $ref: "#/components/schemas/SearchEventHit" }
        plates:
          type: array
          items: { $ref: "#/components/schemas/SearchPlateHit" }
    SearchCameraHit:
      type: object
      required: [id, display_name, site_id, site_name, status]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        site_id: { type: string, format: uuid }
        site_name: { type: string }
        location: { type: string }
        status: { $ref: "#/components/schemas/HealthStatus" }
    SearchSiteHit:
