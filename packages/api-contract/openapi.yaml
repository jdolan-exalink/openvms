      operationId: enableMfa
      summary: Confirm a TOTP code and turn MFA on
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9 ]{6,7}$" }
      responses:
        "204": { description: Enabled }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
