syntax = "proto3";

package openvms.v1;

option go_package = "github.com/jdolan-exalink/openvms/gen/go/openvms/v1;openvmsv1";

import "proto/openvms/v1/common.proto";

message NodeSpecs {
  int32 cpu_cores = 1;
  float cpu_usage_pct = 2;
  int64 ram_total_bytes = 3;
  int64 ram_used_bytes = 4;
  string gpu_name = 5;
  int64 vram_total_bytes = 6;
  int64 vram_used_bytes = 7;
  int64 storage_total_bytes = 8;
  int64 storage_used_bytes = 9;
}

message NodeNetworkInterface {
  string name = 1;
  string ip_address = 2;
  string mac_address = 3;
  bool is_default = 4;
}

message Node {
  string id = 1;
  string site_id = 2;
  string hostname = 3;
  string version = 4;
  OperationalStatus status = 5;
  repeated NodeNetworkInterface interfaces = 6;
  string lan_address = 7;
  int32 lan_port = 8;
  string wan_address = 9;
  int32 wan_port = 10;
  string relay_address = 11;
  int32 relay_port = 12;
  repeated string capabilities = 13;
  NodeSpecs specs = 14;
  int64 uptime_seconds = 15;
  int32 camera_count = 16;
}

message ListNodesRequest {
  string site_id = 1;
  Pagination pagination = 2;
}

message ListNodesResponse {
  repeated Node nodes = 1;
  Pagination pagination = 2;
}

message GetNodeRequest {
  string node_id = 1;
}

message GetNodeResponse {
  Node node = 1;
}

message NodeHeartbeatRequest {
  string node_id = 1;
  string version = 2;
  OperationalStatus status = 3;
  NodeSpecs specs = 4;
  repeated NodeNetworkInterface interfaces = 5;
  int64 timestamp = 6;
}

message NodeHeartbeatResponse {
  bool acknowledged = 1;
  string command = 2;
}

service NodeService {
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc Heartbeat(NodeHeartbeatRequest) returns (NodeHeartbeatResponse);
}
