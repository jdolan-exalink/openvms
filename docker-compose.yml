# Local environment: `docker compose up -d` (or `make up`) starts the whole platform
# plus two simulated Frigate sites. Credentials here are for development only.
name: openvms

x-go-env: &go-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://openvms:${POSTGRES_PASSWORD:-openvms}@postgres:5432/openvms?sslmode=disable
  VALKEY_ADDR: valkey:6379
  NATS_URL: nats://nats:4222
  S3_ENDPOINT: http://seaweedfs:8333
  S3_ACCESS_KEY: openvms
  S3_SECRET_KEY: openvms-dev-secret
  S3_BUCKET: openvms
  HTTP_ADDR: ":8080"
  # Seals Frigate credentials (AES-256-GCM). Development value: generate a real one
  # with `openssl rand -base64 32` and keep it out of the repository.
  OPENVMS_MASTER_KEY: ${OPENVMS_MASTER_KEY:-b3BlbnZtcy1kZXYtbWFzdGVyLWtleS0zMmJ5dGVzISE=}
  # Internal WhatsApp gateway (WAHA) used by WhatsApp notification channels.
  WAHA_BASE_URL: http://waha:3000
  WAHA_API_KEY: ${WAHA_API_KEY:-openvms-dev-waha-key}
  # Feature flags (comma-separated, docs/live-view-architecture.md). The code defaults every
  # flag to off; the local stack enables the Live View P0 flags for testing.
  OPENVMS_FEATURES: ${OPENVMS_FEATURES:-persistentPlayers,videoSurfaceLayer}
  # First platform admin on a fresh install (never resets an existing one). Change the default.
  OPENVMS_ADMIN_USERNAME: ${OPENVMS_ADMIN_USERNAME:-admin}
  OPENVMS_ADMIN_PASSWORD: ${OPENVMS_ADMIN_PASSWORD:-}
  # Tenant and site created on first start only when the install has no tenant at all.
  OPENVMS_DEFAULT_TENANT: ${OPENVMS_DEFAULT_TENANT:-openvms}
  OPENVMS_DEFAULT_SITE: ${OPENVMS_DEFAULT_SITE:-Sitio principal}
  OPENVMS_DEFAULT_SITE_TZ: ${OPENVMS_DEFAULT_SITE_TZ:-America/Argentina/Cordoba}
  SESSION_TTL: ${SESSION_TTL:-12h}
  SESSION_IDLE: ${SESSION_IDLE:-2h}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openvms
      POSTGRES_USER: openvms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openvms}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["${OPENVMS_POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openvms -d openvms"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    volumes: ["${OPENVMS_DATA_DIR:-/mnt/cctv/openvms}/nats:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - ${OPENVMS_DATA_DIR:-/mnt/cctv/openvms}/seaweedfs:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["127.0.0.1:1883:1883"]
    volumes: [./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/#' -C 1 -W 3 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frigate-helvecia:
    profiles: [mock]
    build: { context: ., dockerfile: deploy/docker/go.Dockerfile, args: { APP: frigate-mock } }
    environment:
      MOCK_NAME: frigate-h01
      MOCK_CAMERAS: acceso_norte+lpr:entrada|salida,plaza:centro,cementerio:porton,tesoreria
      MOCK_TOPIC_PREFIX: frigate-h01
      MOCK_MQTT_URL: tcp://mosquitto:1883
      MOCK_PASSWORD: helvecia-dev
    ports: ["127.0.0.1:18971:8971"]
    depends_on:
      mosquitto: { condition: service_healthy }

  frigate-cayasta:
    profiles: [mock]
    build: { context: ., dockerfile: deploy/docker/go.Dockerfile, args: { APP: frigate-mock } }
    environment:
      MOCK_NAME: frigate-c01
      MOCK_CAMERAS: ruta_1+lpr:ingreso,plaza:centro,muelle
      MOCK_TOPIC_PREFIX: frigate-c01
      MOCK_MQTT_URL: tcp://mosquitto:1883
      MOCK_PASSWORD: cayasta-dev
    ports: ["127.0.0.1:28971:8971"]
    depends_on:
      mosquitto: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: deploy/docker/go.Dockerfile, args: { APP: api, VERSION: "${VERSION:-}", COMMIT: "${COMMIT:-unknown}", BUILD_TIME: "${BUILD_TIME:-unknown}", AGENT_VERSION: "${AGENT_VERSION:-}" } }
    environment:
      <<: *go-env
      # The API gRPC listener certificate is a dedicated local agent endpoint certificate;
      # the public HTTPS certificate below is mounted only as enrollment trust material.
      GRPC_TLS_CERT_FILE: /etc/openvms/agent-grpc/tls.crt
      GRPC_TLS_KEY_FILE: /etc/openvms/agent-grpc/tls.key
      GRPC_AGENT_ADDR: ${OPENVMS_AGENT_GRPC_BIND_HOST:-0.0.0.0}:${OPENVMS_AGENT_GRPC_CONTAINER_PORT:-9443}
      AGENT_GRPC_PUBLIC_ADDR: ${OPENVMS_AGENT_GRPC_PUBLIC_ADDR:-${OPENVMS_HTTPS_SITE_IPV4:-localhost}:${OPENVMS_AGENT_GRPC_HOST_PORT:-9443}}
      AGENT_API_PUBLIC_URL: ${OPENVMS_AGENT_API_PUBLIC_URL:-https://${OPENVMS_HTTPS_SITE_IPV4:-localhost}:${WEB_HTTPS_PORT:-8443}}
      AGENT_GRPC_CA_FILE: /etc/openvms/agent-grpc/tls.crt
      AGENT_API_CA_FILE: /etc/openvms/api-ca/cert.pem
      TRUST_FORWARDED_FOR: "true"
      CREDENTIAL_TRUSTED_PROXY_CIDRS: ${CREDENTIAL_TRUSTED_PROXY_CIDRS:-${OPENVMS_AGENT_WEB_IPV4:-172.29.240.4}/32}
      HOST_PROC: /host/proc
      HOST_DRM: /host/drm
      HOST_DISK: /hostfs
      WORKER_URL: http://worker:8081
    volumes:
      - /proc:/host/proc:ro
      - /sys/class/drm:/host/drm:ro
      - /:/hostfs:ro
      - ${OPENVMS_DATA_DIR:-/mnt/cctv/openvms}/exports:/mnt/openvms/exports
      - type: bind
        source: ${OPENVMS_AGENT_GRPC_TLS_CERT_HOST_FILE:-./deploy/docker/local-tls/agent-grpc/tls.crt}
        target: /etc/openvms/agent-grpc/tls.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${OPENVMS_AGENT_GRPC_TLS_KEY_HOST_FILE:-./deploy/docker/local-tls/agent-grpc/tls.key}
        target: /etc/openvms/agent-grpc/tls.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${OPENVMS_AGENT_API_CA_HOST_FILE:-${OPENVMS_WEB_TLS_CERT_HOST_FILE:-./deploy/docker/local-tls/tls.crt}}
        target: /etc/openvms/api-ca/cert.pem
        read_only: true
        bind:
          create_host_path: true
    ports:
      - "${OPENVMS_AGENT_GRPC_PUBLISH_ADDR:-0.0.0.0}:${OPENVMS_AGENT_GRPC_HOST_PORT:-9443}:${OPENVMS_AGENT_GRPC_CONTAINER_PORT:-9443}"
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      nats: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
    networks:
      default: {}
      onvif-agent:
        ipv4_address: ${OPENVMS_AGENT_API_IPV4:-172.29.240.2}
    restart: unless-stopped

  # Optional local agent runtime. Credentials are accepted only on its verified HTTPS
  # listener; HTTP remains available for legacy metrics/update/discovery only.
  edge-agent:
    profiles: [onvif-agent]
    image: openvms-api
    entrypoint: ["/opt/openvms/edge-agent"]
    user: "${OPENVMS_AGENT_UID:-1000}:${OPENVMS_AGENT_GID:-1000}"
    environment:
      OPENVMS_AGENT_LISTEN: "0.0.0.0:7419"
      OPENVMS_AGENT_ONVIF_TLS_LISTEN: "0.0.0.0:${OPENVMS_AGENT_TLS_PORT:-7443}"
      TLS_CERT_FILE: /etc/openvms/onvif/tls.crt
      TLS_KEY_FILE: /etc/openvms/onvif/tls.key
      OPENVMS_AGENT_TOKEN_FILE: /etc/openvms/agent.token
      ONVIF_DISCOVERY_INTERFACES: ${ONVIF_DISCOVERY_INTERFACES:-eth0}
      ONVIF_ALLOWED_CIDRS: ${ONVIF_ALLOWED_CIDRS:-192.0.2.0/24}
    volumes:
      - ${OPENVMS_AGENT_TOKEN_HOST_FILE:-./deploy/agent/compose/local/agent.token}:/etc/openvms/agent.token:ro
      - ${OPENVMS_AGENT_TLS_CERT_HOST_FILE:-./deploy/agent/compose/local/tls.crt}:/etc/openvms/onvif/tls.crt:ro
      - ${OPENVMS_AGENT_TLS_KEY_HOST_FILE:-./deploy/agent/compose/local/tls.key}:/etc/openvms/onvif/tls.key:ro
    networks:
      onvif-agent:
        ipv4_address: ${OPENVMS_AGENT_IPV4:-172.29.240.3}
    depends_on: [api]
    restart: unless-stopped

  relay:
    build: { context: ., dockerfile: deploy/docker/go.Dockerfile, args: { APP: relay, VERSION: "${VERSION:-}", COMMIT: "${COMMIT:-unknown}", BUILD_TIME: "${BUILD_TIME:-unknown}" } }
    environment:
      OPENVMS_RELAY_ADDR: ":8554"
    restart: unless-stopped

  worker:
    # runtime-ffmpeg (not the default distroless runtime): PDW-4's clip watermark job
    # shells out to ffmpeg. Every other Go service stays distroless (deploy/docker/go.Dockerfile).
    build: { context: ., dockerfile: deploy/docker/go.Dockerfile, target: runtime-ffmpeg, args: { APP: worker, VERSION: "${VERSION:-}", COMMIT: "${COMMIT:-unknown}", BUILD_TIME: "${BUILD_TIME:-unknown}" } }
    environment:
      <<: *go-env
      HTTP_ADDR: ":8081"
    volumes:
      - ${OPENVMS_DATA_DIR:-/mnt/cctv/openvms}/exports:/mnt/openvms/exports
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

  # WhatsApp gateway for notification channels (docs/notification-channels.md). WAHA drives
  # WhatsApp Web, which is unofficial: use a dedicated phone number. It is only reachable from
  # the compose network (no published port); admins pair the phone from the OpenVMS UI, which
  # proxies the session status and QR. Core edition supports the single session "default".
  waha:
    image: devlikeapro/waha:noweb
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-openvms-dev-waha-key}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_START_SESSION: default
    volumes: ["${OPENVMS_DATA_DIR:-/mnt/cctv/openvms}/waha:/app/.sessions"]
    expose: ["3000"]
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: deploy/docker/web.Dockerfile, args: { VERSION: "${VERSION:-}", COMMIT: "${COMMIT:-unknown}", BUILD_TIME: "${BUILD_TIME:-unknown}" } }
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      HTTPS_SITE_ADDRESS: ${OPENVMS_HTTPS_SITE_IPV4:-:443}
      OPENVMS_HTTPS_SANS: ${OPENVMS_HTTPS_SANS:-${OPENVMS_HTTPS_SITE_IPV4:-localhost,127.0.0.1,::1}}
      OPENVMS_HTTPS_DEFAULT_SNI: ${OPENVMS_HTTPS_DEFAULT_SNI:-${OPENVMS_HTTPS_SITE_IPV4:-localhost}}
      OPENVMS_WEB_TLS_CERT_FILE: ${OPENVMS_WEB_TLS_CERT_HOST_FILE:+/etc/caddy/tls.crt}
      OPENVMS_WEB_TLS_KEY_FILE: ${OPENVMS_WEB_TLS_KEY_HOST_FILE:+/etc/caddy/tls.key}
      OPENVMS_WEB_HTTPS_PORT: ${WEB_HTTPS_PORT:-8443}
      API_UPSTREAM: ${OPENVMS_AGENT_API_IPV4:-172.29.240.2}:8080
      # An empty static proxy list denies all forwarded-header trust by default.
      HTTPS_INGRESS_PROXY_CIDRS: ${HTTPS_INGRESS_PROXY_CIDRS:-}
    ports: ["${WEB_PORT:-8000}:80", "${WEB_HTTPS_PORT:-8443}:443"]
    depends_on: [api]
    volumes:
      - ${OPENVMS_DATA_DIR:-/mnt/cctv/openvms}/caddy:/data
      - ${OPENVMS_DATA_DIR:-/mnt/cctv/openvms}/web-tls:/var/lib/openvms/tls
      - type: bind
        source: ${OPENVMS_WEB_TLS_CERT_HOST_FILE:-./deploy/docker/local-tls/tls.crt}
        target: /etc/caddy/tls.crt
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${OPENVMS_WEB_TLS_KEY_HOST_FILE:-./deploy/docker/local-tls/tls.key}
        target: /etc/caddy/tls.key
        read_only: true
        bind:
          create_host_path: true
    networks:
      default: {}
      onvif-agent:
        ipv4_address: ${OPENVMS_AGENT_WEB_IPV4:-172.29.240.4}
    restart: unless-stopped

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.5.0
    volumes: [./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes: [./deploy/grafana/provisioning:/etc/grafana/provisioning:ro]
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped

networks:
  onvif-agent:
    ipam:
      config:
        - subnet: ${OPENVMS_AGENT_SUBNET:-172.29.240.0/24}
