# Local environment: `docker compose up -d` (or `make up`) starts the whole platform
# plus two simulated Frigate sites. Credentials here are for development only.
name: openvms

x-go-env: &go-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://openvms:${POSTGRES_PASSWORD:-openvms}@postgres:5432/openvms?sslmode=disable
  VALKEY_ADDR: valkey:6379
  NATS_URL: nats://nats:4222
  S3_ENDPOINT: http://seaweedfs:8333
  S3_ACCESS_KEY: openvms
  S3_SECRET_KEY: openvms-dev-secret
  S3_BUCKET: openvms
  HTTP_ADDR: ":8080"
  # Seals Frigate credentials (AES-256-GCM). Development value: generate a real one
  # with `openssl rand -base64 32` and keep it out of the repository.
  OPENVMS_MASTER_KEY: ${OPENVMS_MASTER_KEY:-b3BlbnZtcy1kZXYtbWFzdGVyLWtleS0zMmJ5dGVzISE=}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openvms
      POSTGRES_USER: openvms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openvms}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openvms -d openvms"]
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    volumes: [nats:/data]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - seaweedfs:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      retries: 30

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["127.0.0.1:1883:1883"]
    volumes: [./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro]

  frigate-helvecia:
    profiles: [mock]
    build: { context: ., dockerfile: deploy/docker/go.Dockerfile, args: { APP: frigate-mock } }
    environment:
      MOCK_NAME: frigate-h01
      MOCK_CAMERAS: acceso_norte+lpr:entrada|salida,plaza:centro,cementerio:porton,tesoreria
      MOCK_TOPIC_PREFIX: frigate-h01
      MOCK_MQTT_URL: tcp://mosquitto:1883
      MOCK_PASSWORD: helvecia-dev
    ports: ["127.0.0.1:18971:8971"]
    depends_on: [mosquitto]

  frigate-cayasta:
    profiles: [mock]
    build: { context: ., dockerfile: deploy/docker/go.Dockerfile, args: { APP: frigate-mock } }
    environment:
      MOCK_NAME: frigate-c01
      MOCK_CAMERAS: ruta_1+lpr:ingreso,plaza:centro,muelle
      MOCK_TOPIC_PREFIX: frigate-c01
      MOCK_MQTT_URL: tcp://mosquitto:1883
      MOCK_PASSWORD: cayasta-dev
    ports: ["127.0.0.1:28971:8971"]
    depends_on: [mosquitto]

  api:
    build: { context: ., dockerfile: deploy/docker/go.Dockerfile, args: { APP: api, VERSION: "${VERSION:-dev}" } }
    environment:
      <<: *go-env
      TRUST_FORWARDED_FOR: "true"
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      nats: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
    restart: unless-stopped

  worker:
    # runtime-ffmpeg (not the default distroless runtime): PDW-4's clip watermark job
    # shells out to ffmpeg. Every other Go service stays distroless (deploy/docker/go.Dockerfile).
    build: { context: ., dockerfile: deploy/docker/go.Dockerfile, target: runtime-ffmpeg, args: { APP: worker, VERSION: "${VERSION:-dev}" } }
    environment:
      <<: *go-env
      HTTP_ADDR: ":8081"
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: deploy/docker/web.Dockerfile }
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports: ["${WEB_PORT:-8000}:80"]
    depends_on: [api]
    volumes: [caddy:/data]

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.5.0
    volumes: [./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes: [./deploy/grafana/provisioning:/etc/grafana/provisioning:ro]
    ports: ["127.0.0.1:3000:3000"]

volumes:
  postgres:
  nats:
  seaweedfs:
  caddy:
